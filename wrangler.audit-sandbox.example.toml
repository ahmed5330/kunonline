# NON-DEPLOYABLE: isolated auth-only Worker and NEW dedicated D1 only.
# No Production/Preview dependencies, assets, live commerce routes, Cron,
# providers or service bindings. Requires separate Cloudflare audit authorization.
# Replace all REPLACE_ placeholders *after* provisioning a brand-new D1/Worker.
# This config is not a sandbox until actual Cloudflare IDs/bindings are verified.

name = "REPLACE_WITH_UNIQUE_AUDIT_WORKER_NAME"
main = "src/audit-sandbox-auth-worker.js"
compatibility_date = "2026-08-23"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_NEW_AUDIT_D1_NAME"
database_id = "REPLACE_WITH_NEW_D1_UUID"
migrations_dir = "sandbox/migrations"

[triggers]
crons = []

[vars]
APP_ENV = "audit_sandbox"
AUDIT_EGRESS_OFFLINE = "true"
# AUDIT_QA_KEY must be a NEW >=32 character secret in the sandbox only.
# Do not use SESSION_SECRET or any Cloudflare key shared with a live Worker.
