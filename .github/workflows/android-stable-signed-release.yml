name: Android stable signed release

on:
  push:
    branches: [main]
    paths:
      - 'android/app/**'
      - 'android/build.gradle.kts'
      - 'android/settings.gradle.kts'
      - 'android/signing/signing-bundle.enc.b64'
      - 'android/signing/signing-bundle-key.enc.b64'
      - 'android/signing/transport-private.pem.enc'
      - '.github/workflows/android-stable-signed-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kunonline-android-stable-signed-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANDROID_SIGNING_MASTER: ${{ secrets.ANDROID_SIGNING_MASTER }}
      EXPECTED_CERT_SHA256: ed4be3cfc9d0c2ca4fad68303b74adf2fb09dfbb21399cc915e6cdc3131c614f
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and test unsigned release
        working-directory: android
        run: gradle test assembleRelease

      - name: Recover signing material in runner only
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="${ANDROID_SIGNING_MASTER:-}"
          if [ -z "$SOURCE" ]; then SOURCE="$CLOUDFLARE_API_TOKEN"; fi
          test -n "$SOURCE"
          MASTER="$(printf '%s|kun-online-android-signing-v1' "$SOURCE" | sha256sum | awk '{print $1}')"
          export MASTER

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/signing/transport-private.pem.enc \
            -out /tmp/kun-transport-private.pem \
            -pass env:MASTER
          chmod 600 /tmp/kun-transport-private.pem

          base64 -d android/signing/signing-bundle-key.enc.b64 > /tmp/kun-bundle-key.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/kun-transport-private.pem \
            -in /tmp/kun-bundle-key.enc \
            -out /tmp/kun-bundle-pass.txt \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256

          base64 -d android/signing/signing-bundle.enc.b64 > /tmp/kun-signing-bundle.enc
          BUNDLE_PASS="$(cat /tmp/kun-bundle-pass.txt)"
          export BUNDLE_PASS
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/kun-signing-bundle.enc \
            -out /tmp/kun-signing-bundle.tar.gz \
            -pass env:BUNDLE_PASS

          mkdir -p /tmp/kun-signing
          tar -xzf /tmp/kun-signing-bundle.tar.gz -C /tmp/kun-signing
          test -s /tmp/kun-signing/kunonline-release.p12
          test -s /tmp/kun-signing/signing.properties
          chmod 600 /tmp/kun-signing/kunonline-release.p12 /tmp/kun-signing/signing.properties

      - name: Align, sign and fully verify stable APK
        id: signed
        shell: bash
        run: |
          set -euo pipefail
          set +x
          KS_ALIAS="$(sed -nE 's/^KS_ALIAS=(.*)$/\1/p' /tmp/kun-signing/signing.properties | head -1)"
          KS_PASSWORD="$(sed -nE 's/^KS_PASSWORD=(.*)$/\1/p' /tmp/kun-signing/signing.properties | head -1)"
          test -n "$KS_ALIAS"
          test -n "$KS_PASSWORD"
          export KS_PASSWORD

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          test -n "$AAPT2"

          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          VERSION="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' android/app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          test -n "$VERSION_CODE"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" /tmp/Kun-Online-Mobile-aligned.apk
          "$ZIPALIGN" -c -v 4 /tmp/Kun-Online-Mobile-aligned.apk

          "$APKSIGNER" sign \
            --ks /tmp/kun-signing/kunonline-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASSWORD \
            --key-pass env:KS_PASSWORD \
            --out /tmp/Kun-Online-Mobile.apk \
            /tmp/Kun-Online-Mobile-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs /tmp/Kun-Online-Mobile.apk > /tmp/apk-verify.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apk-verify.txt
          ACTUAL="$(sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-fA-F]+)$/\1/p' /tmp/apk-verify.txt | tr 'A-F' 'a-f' | head -1)"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256"
          "$ZIPALIGN" -c -v 4 /tmp/Kun-Online-Mobile.apk
          unzip -tq /tmp/Kun-Online-Mobile.apk

          "$AAPT2" dump badging /tmp/Kun-Online-Mobile.apk > /tmp/apk-badging.txt
          grep -Eq "package: name='com\.kunonline\.callerid\.stable'.*versionCode='${VERSION_CODE}'.*versionName='${VERSION}'" /tmp/apk-badging.txt

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          sha256sum /tmp/Kun-Online-Mobile.apk | awk '{print "apk_sha256=" $1}' >> "$GITHUB_OUTPUT"
          echo "Stable APK verified: Kun Online Android v$VERSION (code $VERSION_CODE)"

      - name: Publish canonical and compatibility Android APKs
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.signed.outputs.version }}
          APP_CODE: ${{ steps.signed.outputs.version_code }}
        run: |
          set -euo pipefail
          CANONICAL="Kun-Online-Mobile-v${APP_VERSION}-c${APP_CODE}.apk"
          VERSIONED="Kun-Online-Mobile-v${APP_VERSION}.apk"
          STABLE="Kun-Online-Mobile.apk"

          cp /tmp/Kun-Online-Mobile.apk "/tmp/$CANONICAL"
          cp /tmp/Kun-Online-Mobile.apk "/tmp/$VERSIONED"

          gh release upload android-latest "/tmp/$CANONICAL" --clobber
          gh release upload android-latest "/tmp/$VERSIONED" --clobber
          gh release upload android-latest "/tmp/$STABLE" --clobber
          gh release delete-asset android-latest app-debug.apk -y || true
          gh release edit android-latest \
            --target "$GITHUB_SHA" \
            --title "Kun Online Android v$APP_VERSION" \
            --notes "Stable-signed Kun Online Android v$APP_VERSION (code $APP_CODE). Releases use a canonical version-code asset so the production updater can discover new builds automatically."

          gh release view android-latest --json assets --jq '.assets[].name' | grep -Fxq "$CANONICAL"
          gh release view android-latest --json assets --jq '.assets[].name' | grep -Fxq "$VERSIONED"
          gh release view android-latest --json assets --jq '.assets[].name' | grep -Fxq "$STABLE"
          echo "Published $CANONICAL plus compatibility aliases"

      - name: Verify production updater discovers this release
        env:
          APP_VERSION: ${{ steps.signed.outputs.version }}
          APP_CODE: ${{ steps.signed.outputs.version_code }}
          EXPECTED_SHA: ${{ steps.signed.outputs.apk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for i in {1..40}; do
            meta="$(curl -fsS -H 'Cache-Control: no-cache' "https://app.kun-online.com/api/mobile/app-update?verify=${GITHUB_RUN_ID}-${i}" 2>/dev/null || true)"
            if grep -q "\"versionCode\":${APP_CODE}" <<< "$meta" && grep -q "\"versionName\":\"${APP_VERSION}\"" <<< "$meta"; then
              echo "Production feed discovered v$APP_VERSION (code $APP_CODE)."
              matched=1
              break
            fi
            sleep 6
          done
          test "$matched" = 1

          headers="$(mktemp)"
          live_apk="$(mktemp --suffix=.apk)"
          curl -fsS -D "$headers" -o "$live_apk" "https://app.kun-online.com/api/mobile/app-update/apk?verify=${GITHUB_RUN_ID}"
          grep -Eiq "^x-kun-online-android-version: ${APP_CODE}\r?$" "$headers"
          LIVE_SHA="$(sha256sum "$live_apk" | awk '{print $1}')"
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          unzip -tq "$live_apk"
          echo "Live APK matches the signed build: $LIVE_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: kun-online-stable-signed-apk-${{ steps.signed.outputs.version }}
          path: /tmp/Kun-Online-Mobile.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove decrypted signing material
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/kun-signing /tmp/kun-transport-private.pem /tmp/kun-bundle-key.enc /tmp/kun-bundle-pass.txt /tmp/kun-signing-bundle.enc /tmp/kun-signing-bundle.tar.gz /tmp/apk-verify.txt /tmp/apk-badging.txt /tmp/Kun-Online-Mobile-aligned.apk /tmp/Kun-Online-Mobile.apk /tmp/Kun-Online-Mobile-v*.apk
