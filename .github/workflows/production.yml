name: Production deploy (no database migrations)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kunonline-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate Android update hotfix source
        run: |
          node --check src/mobile-app-update.js
          node --check src/index-production-mobile-update.js
      - name: Verify Worker builds without touching Production
        run: npx wrangler deploy --dry-run --config wrangler.production.toml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.kun-online.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Deploy production Worker only — no migrations
        run: npx wrangler deploy --config wrangler.production.toml
      - name: Verify live Android update feed
        run: |
          set -euo pipefail
          for i in {1..10}; do
            meta="$(curl -fsS https://app.kun-online.com/api/mobile/app-update 2>/dev/null || true)"
            if printf '%s' "$meta" | grep -q '"versionCode":107' && printf '%s' "$meta" | grep -q '"versionName":"2.4.0"'; then
              echo "Live Android update feed verified: $meta"
              exit 0
            fi
            sleep 3
          done
          echo "Production update feed did not return the expected v2.4.0 metadata."
          exit 1
      - name: Verify website downloads the APK through Kun Online
        run: |
          set -euo pipefail
          page="$(curl -fsS https://app.kun-online.com/)"
          printf '%s' "$page" | grep -Fq "/api/mobile/app-update/apk"
          if printf '%s' "$page" | grep -Fq "https://github.com/ahmed5330/kunonline/releases/download/android-latest/Kun-Online-Mobile.apk"; then
            echo "Website still exposes the legacy direct GitHub APK URL."
            exit 1
          fi

          headers="$(mktemp)"
          apk="$(mktemp --suffix=.apk)"
          curl -fsS -D "$headers" -o "$apk" https://app.kun-online.com/api/mobile/app-update/apk
          grep -Eiq '^content-type: application/vnd\.android\.package-archive' "$headers"
          grep -Eiq '^content-disposition: attachment; filename="Kun-Online-Mobile\.apk"' "$headers"
          test "$(wc -c < "$apk")" -gt 1000000
          unzip -l "$apk" | grep -Fq 'AndroidManifest.xml'
          echo "Website Android download verified through Kun Online: $(wc -c < "$apk") bytes"
