name: Production deploy (no database migrations)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kunonline-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Admin J&T shipment access and import safety
        run: |
          node --check src/admin-jnt-shipments.js
          node --check public/v2/modules-v154-admin-jnt-shipments.js
          node scripts/admin-jnt-shipments-test.mjs
      - name: Campaign comparison loading and weekday regression
        run: |
          node scripts/campaign-weekday-regression-test.mjs
          node scripts/meta-ads-expert-contract-test.mjs
          node scripts/browser-campaign-weekday-fixture-test.mjs
      - name: Authorized order alert feed and store isolation
        run: node scripts/android-order-notifications-fake-test.mjs
      - name: Validate Android update, Printing/J&T guard and Customer Service sources
        run: |
          node --check src/mobile-app-update.js
          node scripts/mobile-state-sync-test.mjs
          node --check src/production-mobile-order-guard.js
          node --check src/production-customer-service.js
          node --check src/mobile-store-options.js
          node scripts/mobile-store-options-test.mjs
          node --check src/operational-workflow-v105.js
          node scripts/android-customer-service-outcomes-test.mjs
          node --check src/production-caller-jnt-edit.js
          node --check src/production-printing-queue.js
          node --check src/jt-print-workflow-v2.js
          node --check src/inventory-unit-tracking.js
          node --check public/v2/modules-v128-unit-tracking.js
          node scripts/unit-tracking-contract-test.mjs
          node --check src/internal-collaboration-schema.js
          node --check src/index-production-mobile-update.js
          node --check src/index-production-sync.js
          node --check public/v2/modules-v78-jt-shipping-order.js
          node --check public/v2/modules-v79-printing.js
          node --check public/v2/modules-v116-print-routing.js
          node scripts/integration-setup-test.mjs
      - name: Kun Online MCP full authorization-code and revocation contract
        run: node scripts/kun-chatgpt-mcp-full-flow-test.mjs
      - name: Kun Online ChatGPT MCP OAuth and read-only fake tests
        run: node scripts/kun-chatgpt-mcp-fake-test.mjs
      - name: AI provider integration fake tests and secure tenancy
        run: node scripts/ai-integrations-fake-test.mjs
      - name: Historical mobile and web contact-count recovery
        run: node scripts/contact-history-recovery-test.mjs
      - name: Android cancellation outcome field parity
        run: node scripts/android-outcome-reason-contract-test.mjs
      - name: Login, cancellation and order-linked group notes regression
        run: node scripts/login-cancel-group-notes-regression-test.mjs
      - name: Customer Service notes, copy and model-color cards
        run: node scripts/customer-service-notes-product-cards-test.mjs
      - name: Customer Service board, periods and J&T void regression
        run: node scripts/customer-service-board-print-void-test.mjs
      - name: V2 login session gateway regression
        run: |
          node --check public/v2/modules-v142-login-gateway.js
          node --check src/index-production-mobile-update.js
          node scripts/v2-login-gateway-contract-test.mjs
      - name: Payment ledger and access consistency
        run: |
          node --check src/subscription-billing.js
          node --check src/subscription-control.js
          node --check src/wallet-account.js
          node --check src/wallet-topup-admin.js
          node --check public/v2/modules-v127-subscriptions.js
          node scripts/subscriptions-v127-contract-test.mjs
          node scripts/payment-access-v148-test.mjs
      - name: Kun Online primary navigation and current subscription asset contract
        run: |
          node scripts/kun-primary-navigation-contract-test.mjs
          node --check public/v2/kun-design-v143.js
      - name: Safe contextual help browser regression
        run: |
          node --check public/v2/kun-help-safe-v147.js
          node --check public/v2/modules-v135-clarity.js
          node --check public/v2/modules-v136-clarity-growth.js
          node --check public/v2/modules-v66-campaign-hub.js
          node scripts/browser-safe-help-v147.mjs
      - name: Production navigation restore regression
        run: |
          node scripts/kun-primary-navigation-contract-test.mjs
          node --check public/v2/kun-design-v143.js
          node -e "const s=require('fs').readFileSync('public/v2/index.html','utf8');if(s.includes('kun-context-help-v146'))process.exit(1);console.log('v146 invasive help inactive')"
      - name: Serialized warehouse transaction and browser regression
        run: |
          node scripts/warehouse-operations-test.mjs
          node scripts/browser-warehouse-operations-fixture-test.mjs
          node scripts/browser-inventory-workspace-fixture-test.mjs
          node scripts/browser-sidebar-navigation-regression-test.mjs
      - name: Dashboard Easy Orders Preview regression
        run: node scripts/dashboard-sync-guard-test.mjs
      - name: QA catalog, dates, phones and accounting presentation regression
        run: node scripts/qa-production-regression-test.mjs
      - name: Validate Production composition and sync policy
        run: node scripts/verify-production-config.mjs
      - name: Public website reviews API security and moderation
        run: |
          node --check src/public-site-reviews.js
          node scripts/public-site-reviews-test.mjs
      - name: Verify guarded Easy Orders Production release rollback policy
        run: node scripts/easyorders-production-release-flow-test.mjs
      - name: Verify Worker builds without touching Production
        run: npx wrangler deploy --dry-run --config wrangler.production.toml
      - name: Block incompatible Production release until canonical Preview backend is ready
        run: node scripts/production-preview-release-gate.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.kun-online.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Read current Production Worker rollback version without mutation
        id: rollback_base
        run: |
          set -euo pipefail
          current="$(npx wrangler deployments status --config wrangler.production.toml --json | node scripts/cloudflare-full-traffic-version.mjs)"
          test -n "$current"
          echo "version_id=$current" >> "$GITHUB_OUTPUT"
          echo "Captured current Production rollback version $current"
      - name: Deploy production Worker only — no migrations
        id: deploy_worker
        run: |
          set -euo pipefail
          output="$(npx wrangler deploy --config wrangler.production.toml --keep-vars --message "Production candidate $GITHUB_SHA" 2>&1)"
          printf '%s\n' "$output"
          version="$(printf '%s\n' "$output" | sed -nE 's/.*Current Version ID: ([0-9a-f-]{36}).*/\1/p' | tail -1)"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
      - name: Attest newly deployed Production Worker version
        id: deployed_version
        run: |
          set -euo pipefail
          expected="${{ steps.deploy_worker.outputs.version_id }}"
          test -n "$expected"
          for attempt in $(seq 1 12); do
            current="$(npx wrangler deployments status --config wrangler.production.toml --json | node scripts/cloudflare-full-traffic-version.mjs)"
            if [ "$current" = "$expected" ]; then
              echo "version_id=$current" >> "$GITHUB_OUTPUT"
              echo "New Production Worker owns live traffic: $current"
              exit 0
            fi
            sleep 4
          done
          echo 'Production ownership could not be verified; aborting smoke.'
          exit 1
      - name: Verify live branded dashboard and isolated daisyUI design preview
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_SHA}"
          # Cloudflare deployment propagation is not necessarily instantaneous.
          fetch_live() {
            local label="$1" url="$2" outfile="$3" code
            for i in {1..12}; do
              code="$(curl --silent --show-error --location --max-time 12 -H 'Cache-Control: no-cache' -o "$outfile" -w '%{http_code}' "${url}&attempt=${i}" 2>/dev/null || true)"
              echo "${label}: attempt ${i} => HTTP ${code:-network-error}"
              if [ "$code" = 200 ]; then return 0; fi
              sleep 3
            done
            echo "ERROR: ${label} is still unavailable after deployment propagation" >&2
            return 1
          }
          fetch_live "V2 authenticated app shell" "https://app.kun-online.com/v2/index.html?design=${nonce}" /tmp/kun-design-live.html
          fetch_live "V150 dashboard CSS" "https://app.kun-online.com/v2/kun-dashboard-polish-v150.css?v=${nonce}" /tmp/kun-design-live.css
          fetch_live "V150 dashboard JS" "https://app.kun-online.com/v2/kun-dashboard-brand-v150.js?v=${nonce}" /tmp/kun-design-live.js
          fetch_live "Subscriptions admin JS" "https://app.kun-online.com/v2/modules-v127-subscriptions.js?v=${nonce}" /tmp/kun-subscriptions-live.js
          fetch_live "V145 primary nav JS" "https://app.kun-online.com/v2/kun-design-v143.js?v=${nonce}" /tmp/kun-primary-live.js
          fetch_live "Isolated daisyUI demo" "https://app.kun-online.com/v2/design-preview/index.html?v=${nonce}" /tmp/kun-design-live-preview.html
          grep -Fq '/v2/kun-dashboard-polish-v150.css?v=150.0' /tmp/kun-design-live.html
          grep -Fq '/v2/kun-dashboard-brand-v150.js?v=150.0' /tmp/kun-design-live.html
          grep -Fq '/v2/modules-v51-permission-navigation.js?v=51.17' /tmp/kun-design-live.html
          grep -Fq '/v2/modules-v127-subscriptions.js?v=127.22' /tmp/kun-design-live.html
          fetch_live "V51 platform-admin role guard" "https://app.kun-online.com/v2/modules-v51-permission-navigation.js?v=${nonce}" /tmp/kun-permissions-live.js
          grep -Fq "if(view==='subscriptions')return data.role==='admin'" /tmp/kun-permissions-live.js
          grep -Fq '/v2/kun-design-v143.js?v=145.1' /tmp/kun-design-live.html
          grep -Fq 'data-view="subscriptions" hidden' /tmp/kun-design-live.html
          grep -Fq 'الاشتراكات والمدفوعات' /tmp/kun-subscriptions-live.js
          grep -Fq '["subscriptions","الاشتراكات والمدفوعات"' /tmp/kun-primary-live.js
          grep -Fq 'kun150-hero-logo' /tmp/kun-design-live.css
          grep -Fq "logo.src='/logo.png'" /tmp/kun-design-live.js
          grep -Fq 'daisyui@5' /tmp/kun-design-live-preview.html
          grep -Fq 'noindex,nofollow' /tmp/kun-design-live-preview.html
          echo 'PASS: live branded dashboard assets and isolated daisyUI design preview are reachable'
      - name: Verify live Campaign comparison assets
        env:
          CAMPAIGN_LIVE_BASE: https://app.kun-online.com
        run: node scripts/campaign-weekday-live-test.mjs
      - name: Verify live dashboard Easy Orders source and warning
        run: node scripts/dashboard-sync-guard-live-test.mjs --require-current
      - name: Verify live Android update feed
        run: |
          set -euo pipefail
          verified=0
          for i in {1..10}; do
            meta="$(curl -fsS -H 'Cache-Control: no-cache' "https://app.kun-online.com/api/mobile/app-update?deploy=${GITHUB_RUN_ID}-${i}" 2>/dev/null || true)"
            if [ -n "$meta" ]; then
              printf '%s' "$meta" > /tmp/mobile-update.json
              if node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/mobile-update.json','utf8'));
          if(d.ok!==true)process.exit(1);
          if(!Number.isInteger(Number(d.versionCode))||Number(d.versionCode)<116)process.exit(1);
          if(!String(d.versionName||'').trim())process.exit(1);
          const apkUrl=new URL(String(d.apkUrl||''));
          if(apkUrl.origin!=='https://app.kun-online.com'||apkUrl.pathname!=='/api/mobile/app-update/apk')process.exit(1);
          const pinned=apkUrl.searchParams.get('versionCode');
          if(pinned!==null&&Number(pinned)!==Number(d.versionCode))process.exit(1);
          const sha=String(d.sha256||'').trim();
          if(sha&&!/^[0-9a-f]{64}$/i.test(sha))process.exit(1);
          console.log(`Android feed verified: v${d.versionName} (code ${d.versionCode})`);
          NODE
              then
                verified=1
                break
              fi
            fi
            sleep 3
          done
          test "$verified" = 1
      - name: Verify live J&T Egypt address directory
        run: |
          set -euo pipefail
          curl -fsS https://app.kun-online.com/v2/data/jnt-addresses/index.json -o /tmp/jnt-index.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/jnt-index.json','utf8'));
          if (String(data.countryCode) !== '100000') throw new Error('Unexpected J&T Egypt country code');
          if (!Array.isArray(data.provinces) || data.provinces.length !== 27) throw new Error('Expected 27 J&T provinces');
          if (Number(data.rows) !== 6474) throw new Error('Unexpected J&T source row count');
          if (Number(data.selectableAreas) !== 6473) throw new Error('Unexpected J&T selectable area count');
          for (const p of data.provinces) if (!p.name || !p.code || !p.file) throw new Error('Incomplete J&T province entry');
          console.log(`J&T manifest verified: ${data.provinces.length} provinces, ${data.selectableAreas} selectable areas`);
          NODE
          node -e "const d=require('/tmp/jnt-index.json'); for(const p of d.provinces) console.log(p.file)" | while read -r file; do
            curl -fsS "https://app.kun-online.com/v2/data/jnt-addresses/${file}" -o "/tmp/${file}"
            node -e "const d=require('/tmp/${file}'); if(!d.name||!d.code||!Array.isArray(d.cities)) process.exit(1)"
          done
          echo "All J&T province/city/area files are live and readable."
      - name: Verify live Customer Service, Printing and Collaboration API routes
        run: |
          set -euo pipefail
          check_guarded_route() {
            local path="$1" body code
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' "https://app.kun-online.com${path}")"
            if [ "$code" != "401" ]; then echo "Expected protected route to return 401 without a session: ${path}; got HTTP ${code}"; cat "$body"; exit 1; fi
            if grep -Fq 'مسار غير معروف' "$body"; then echo "Route still resolves to the legacy unknown-route handler: ${path}"; cat "$body"; exit 1; fi
            echo "Protected route verified: ${path} -> HTTP 401"
          }
          check_guarded_route '/api/mobile/state-sync'
          check_guarded_route '/api/mobile/board-sync'
          check_guarded_route '/api/customer-service'
          check_guarded_route '/api/printing?clientId=probe'
          check_guarded_route '/api/my-client-context'
          check_guarded_route '/api/catalog/products?clientId=probe'
          check_guarded_route '/api/orders/TEST/details?clientId=probe'
          check_guarded_route '/api/customer-service/orders/TEST/history?clientId=probe'
          check_guarded_route '/api/collaboration/bootstrap?clientId=probe&storeId=probe'
          check_tracking_route() {
            local path="$1" body code
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' "https://app.kun-online.com${path}")"
            if ! grep -Fq '"code":"AUTH_REQUIRED"' "$body"; then echo "Expected unit-tracking route to reject anonymous access: ${path}; got HTTP ${code}"; cat "$body"; exit 1; fi
            if grep -Fq 'مسار تتبع القطع غير معروف' "$body"; then echo "Unit-tracking route is missing: ${path}"; cat "$body"; exit 1; fi
            echo "Protected unit-tracking route verified: ${path} -> HTTP ${code} / AUTH_REQUIRED"
          }
          check_tracking_route '/api/inventory/unit-tracking/summary?clientId=probe'
          check_tracking_route '/api/inventory/unit-tracking/lookup?clientId=probe&code=TEST'
          check_tracking_route '/api/inventory/unit-tracking/barcode?clientId=probe&code=TEST'
          check_tracking_route '/api/inventory/unit-tracking/order-scan/status?clientId=probe&orderId=TEST&context=packing'
          check_tracking_route '/api/inventory/unit-tracking/returns?clientId=probe'
          caller_body="$(mktemp)"
          caller_code="$(curl -sS -X PATCH -H 'Content-Type: application/json' -d '{}' -o "$caller_body" -w '%{http_code}' 'https://app.kun-online.com/api/caller-jnt/orders/TEST')"
          if [ "$caller_code" != "401" ]; then echo "Expected protected caller J&T edit route to return 401 without a session; got HTTP ${caller_code}"; cat "$caller_body"; exit 1; fi
          echo "Caller J&T edit route verified: /api/caller-jnt/orders/TEST -> HTTP 401"
      - name: Verify live Printing UI and Android download
        run: |
          set -euo pipefail
          ui_verified=0
          for i in {1..10}; do
            nonce="${GITHUB_RUN_ID}-${i}"
            page="$(curl -fsSL -H 'Cache-Control: no-cache' "https://app.kun-online.com/v2/index.html?deploy=${nonce}" 2>/dev/null || true)"
            printing="$(curl -fsS -H 'Cache-Control: no-cache' "https://app.kun-online.com/v2/modules-v79-printing.js?v=79.11&deploy=${nonce}" 2>/dev/null || true)"
            routing="$(curl -fsS -H 'Cache-Control: no-cache' "https://app.kun-online.com/v2/modules-v116-print-routing.js?v=116.1&deploy=${nonce}" 2>/dev/null || true)"
            units="$(curl -fsS -H 'Cache-Control: no-cache' "https://app.kun-online.com/v2/modules-v128-unit-tracking.js?v=128.4&deploy=${nonce}" 2>/dev/null || true)"
            if [ -n "$page" ] \
              && grep -Fq '/v2/modules-v51-permission-navigation.js?v=51.17' <<< "$page" \
              && grep -Fq '/v2/modules-v78-jt-shipping-order.js?v=78.5' <<< "$page" \
              && grep -Fq '/v2/modules-v79-printing.js?v=79.11' <<< "$page" \
              && grep -Fq '/v2/modules-v116-print-routing.js?v=116.1' <<< "$page" \
              && grep -Fq '/v2/modules-v128-unit-tracking.js?v=128.4' <<< "$page" \
              && grep -Fq 'code_128' <<< "$units" \
              && grep -Fq '/api/inventory/unit-tracking/barcode' <<< "$units" \
              && grep -Fq 'طباعة باركود كل القطع الموجودة بالمخزن' <<< "$units" \
              && grep -Fq "version:'128.4'" <<< "$units" \
              && grep -Fq 'إرسال إلى J&T وطباعة البوليصة' <<< "$printing" \
              && grep -Fq "'kun:printing-ready'" <<< "$routing" \
              && grep -Fq "new Set(['confirmed','preparing'])" <<< "$routing"; then ui_verified=1; break; fi
            sleep 3
          done
          test "$ui_verified" = 1
          if grep -Fq "https://github.com/ahmed5330/kunonline/releases/download/android-latest/Kun-Online-Mobile.apk" <<< "$page"; then echo "Website still exposes the legacy direct GitHub APK URL."; exit 1; fi
          expected_code="$(node -e "const d=require('/tmp/mobile-update.json'); process.stdout.write(String(d.versionCode))")"
          expected_version="$(node -e "const d=require('/tmp/mobile-update.json'); process.stdout.write(String(d.versionName))")"
          expected_sha="$(node -e "const d=require('/tmp/mobile-update.json'); process.stdout.write(String(d.sha256||''))")"
          headers="$(mktemp)"; apk="$(mktemp --suffix=.apk)"; listing="$(mktemp)"
          curl -fsS -D "$headers" -o "$apk" "https://app.kun-online.com/api/mobile/app-update/apk?versionCode=${expected_code}&versionName=${expected_version}&deploy=${GITHUB_RUN_ID}"
          clean_headers="$(tr -d '\r' < "$headers")"
          grep -Eiq '^content-type: application/vnd\.android\.package-archive([;]|$)' <<< "$clean_headers"
          grep -Eiq '^content-disposition: attachment' <<< "$clean_headers"
          grep -Fiq "Kun-Online-Mobile-v${expected_version}.apk" <<< "$clean_headers"
          grep -Eiq "^x-kun-online-android-version: ${expected_code}$" <<< "$clean_headers"
          test "$(wc -c < "$apk")" -gt 1000000
          unzip -tq "$apk"
          unzip -l "$apk" > "$listing"
          grep -Fq 'AndroidManifest.xml' "$listing"
          if [ -n "$expected_sha" ]; then actual_sha="$(sha256sum "$apk" | awk '{print $1}')"; test "$actual_sha" = "$expected_sha"; fi
          echo "Printing UI and Android download verified through Kun Online: $(wc -c < "$apk") bytes"
      - name: Verify live AI integration assets and protected routes
        run: |
          set -euo pipefail
          verified=0
          for i in {1..10}; do
            nonce="${GITHUB_RUN_ID}-${i}"
            page="$(curl -fsSL -H 'Cache-Control: no-cache' "https://app.kun-online.com/v2/index.html?ai_smoke=${nonce}" 2>/dev/null || true)"
            js="$(curl -fsSL -H 'Cache-Control: no-cache' "https://app.kun-online.com/v2/modules-v160-ai-integrations.js?v=160.0&ai_smoke=${nonce}" 2>/dev/null || true)"
            css="$(curl -fsSL -H 'Cache-Control: no-cache' "https://app.kun-online.com/v2/kun-ai-integrations-v160.css?v=160.0&ai_smoke=${nonce}" 2>/dev/null || true)"
            if grep -Fq 'modules-v160-ai-integrations.js?v=160.0' <<< "$page" \
              && grep -Fq 'kun-ai-integrations-v160.css?v=160.0' <<< "$page" \
              && grep -Fq 'KunAiIntegrationsV160' <<< "$js" \
              && grep -Fq '/api/integrations/ai/connect' <<< "$js" \
              && grep -Fq '.ai-provider-card' <<< "$css"; then
              verified=1; break
            fi
            sleep 3
          done
          if [ "$verified" != 1 ]; then
            echo "AI integrations interface or assets missing from live production." >&2
            exit 1
          fi
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' 'https://app.kun-online.com/api/integrations/ai?clientId=probe')"
          if [ "$status" != 401 ] || ! grep -Fq '"code":"AUTH_REQUIRED"' "$body"; then
            echo "AI integrations API must reject anonymous reads (received HTTP $status)." >&2
            cat "$body"; exit 1
          fi
          status="$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"clientId":"probe","storeId":"probe","provider":"ai_openai","apiKey":"NOT_A_REAL_KEY"}' \
            'https://app.kun-online.com/api/integrations/ai/connect')"
          if [ "$status" != 401 ] || ! grep -Fq '"code":"AUTH_REQUIRED"' "$body"; then
            echo "AI integrations API must reject anonymous credential writes (received HTTP $status)." >&2
            cat "$body"; exit 1
          fi
          echo 'PASS live: AI interface/CSS/JS served, anonymous reads/writes rejected, no provider API used.'
      - name: Verify live ChatGPT MCP discovery and unauthorized access protection
        run: |
          set -euo pipefail
          base="https://app.kun-online.com"
          resource="$(curl -fsS "$base/.well-known/oauth-protected-resource")"
          metadata="$(curl -fsS "$base/.well-known/oauth-authorization-server")"
          node -e 'const r=JSON.parse(process.argv[1]),a=JSON.parse(process.argv[2]);if(r.resource!=="https://app.kun-online.com/mcp"||!r.authorization_servers.includes("https://app.kun-online.com")||a.issuer!=="https://app.kun-online.com"||!a.code_challenge_methods_supported.includes("S256"))process.exit(1);' "$resource" "$metadata"
          body="$(mktemp)" headers="$(mktemp)"
          status="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$base/mcp")"
          test "$status" = 401
          grep -Fiq 'www-authenticate: Bearer resource_metadata=' "$headers"
          status="$(curl -sS -o "$body" -w '%{http_code}' "$base/api/integrations/chatgpt")"
          test "$status" = 401
          page="$(curl -fsSL "$base/v2/index.html")"
          script="$(curl -fsSL "$base/v2/modules-v161-chatgpt-mcp.js?v=161.0")"
          grep -Fq 'modules-v161-chatgpt-mcp.js?v=161.0' <<< "$page"
          grep -Fq '/api/integrations/chatgpt' <<< "$script"
          echo "PASS: OAuth PKCE discovery, protected MCP, integrations access gate and dashboard asset published"
      - name: Verify live V2 login gateway and session endpoints
        run: |
          set -euo pipefail
          node scripts/live-production-login-route-probe.mjs
          verified=0
          for i in {1..8}; do
            nonce="${GITHUB_RUN_ID}-${i}"
            page="$(curl -fsSL -H 'Cache-Control: no-cache' "https://app.kun-online.com/v2/?login_gateway=${nonce}" 2>/dev/null || true)"
            auth="$(curl -fsSL -H 'Cache-Control: no-cache' "https://app.kun-online.com/v2/modules-v142-login-gateway.js?v=142.1&check=${nonce}" 2>/dev/null || true)"
            if grep -Fq '/v2/modules-v142-login-gateway.js?v=142.1' <<< "$page" \
              && grep -Fq "fetch('/api/login'" <<< "$auth" \
              && grep -Fq "fetch('/api/me'" <<< "$auth"; then verified=1; break; fi
            sleep 3
          done
          if [ "$verified" != 1 ]; then echo 'V2 login entry or its JavaScript asset is missing from production'; exit 1; fi
          echo 'V2 login gateway and public authentication routes are reachable on production'
      - name: Restore prior Production Worker after failed smoke only if owned
        if: failure() && steps.deploy_worker.outputs.version_id != ''
        run: |
          set -euo pipefail
          previous="${{ steps.rollback_base.outputs.version_id }}"
          deployed="${{ steps.deploy_worker.outputs.version_id }}"
          test -n "$previous" && test -n "$deployed"
          current="$(npx wrangler deployments status --config wrangler.production.toml --json | node scripts/cloudflare-full-traffic-version.mjs)"
          if [ "$current" != "$deployed" ]; then
            echo "Production Worker changed after this deploy; safe rollback suppressed."
            exit 1
          fi
          npx wrangler versions deploy "$previous@100%" --yes --config wrangler.production.toml --message "Restore prior Production Worker after Easy Orders hotfix smoke failure"
          for attempt in $(seq 1 12); do
            restored="$(npx wrangler deployments status --config wrangler.production.toml --json | node scripts/cloudflare-full-traffic-version.mjs)"
            if [ "$restored" = "$previous" ]; then break; fi
            sleep 3
          done
          test "$restored" = "$previous"
          curl -fsS --max-time 20 -o /dev/null https://app.kun-online.com/healthz
          echo "Restored previous Production Worker version $previous and verified its traffic/health"
