name: Production deploy (no database migrations)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kunonline-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate Android update, J&T guard and Customer Service sources
        run: |
          node --check src/mobile-app-update.js
          node --check src/production-mobile-order-guard.js
          node --check src/production-customer-service.js
          node --check src/index-production-mobile-update.js
      - name: Verify Worker builds without touching Production
        run: npx wrangler deploy --dry-run --config wrangler.production.toml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.kun-online.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Deploy production Worker only — no migrations
        run: npx wrangler deploy --config wrangler.production.toml
      - name: Verify live Android update feed
        run: |
          set -euo pipefail
          for i in {1..10}; do
            meta="$(curl -fsS https://app.kun-online.com/api/mobile/app-update 2>/dev/null || true)"
            if grep -q '"versionCode":110' <<< "$meta" && grep -q '"versionName":"2.6.0"' <<< "$meta"; then
              echo "Live Android update feed verified: $meta"
              break
            fi
            if [ "$i" = 10 ]; then
              echo "Production update feed did not return the expected v2.6.0 metadata."
              exit 1
            fi
            sleep 3
          done
      - name: Verify live J&T Egypt address directory
        run: |
          set -euo pipefail
          curl -fsS https://app.kun-online.com/v2/data/jnt-addresses/index.json -o /tmp/jnt-index.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/jnt-index.json','utf8'));
          if (String(data.countryCode) !== '100000') throw new Error('Unexpected J&T Egypt country code');
          if (!Array.isArray(data.provinces) || data.provinces.length !== 27) throw new Error('Expected 27 J&T provinces');
          if (Number(data.rows) !== 6474) throw new Error('Unexpected J&T source row count');
          if (Number(data.selectableAreas) !== 6473) throw new Error('Unexpected J&T selectable area count');
          for (const p of data.provinces) {
            if (!p.name || !p.code || !p.file) throw new Error('Incomplete J&T province entry');
          }
          console.log(`J&T manifest verified: ${data.provinces.length} provinces, ${data.selectableAreas} selectable areas`);
          NODE
          node -e "const d=require('/tmp/jnt-index.json'); for(const p of d.provinces) console.log(p.file)" | while read -r file; do
            curl -fsS "https://app.kun-online.com/v2/data/jnt-addresses/${file}" -o "/tmp/${file}"
            node -e "const d=require('/tmp/${file}'); if(!d.name||!d.code||!Array.isArray(d.cities)) process.exit(1)"
          done
          echo "All J&T province/city/area files are live and readable."
      - name: Verify live Customer Service API routes
        run: |
          set -euo pipefail
          check_guarded_route() {
            local path="$1"
            local body code
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' "https://app.kun-online.com${path}")"
            if [ "$code" != "401" ]; then
              echo "Expected protected Customer Service route to return 401 without a session: ${path}; got HTTP ${code}"
              cat "$body"
              exit 1
            fi
            if grep -Fq 'مسار غير معروف' "$body"; then
              echo "Customer Service route still resolves to the legacy unknown-route handler: ${path}"
              cat "$body"
              exit 1
            fi
            echo "Customer Service route verified: ${path} -> HTTP 401"
          }
          check_guarded_route '/api/customer-service'
          check_guarded_route '/api/my-client-context'
          check_guarded_route '/api/catalog/products?clientId=probe'
          check_guarded_route '/api/orders/TEST/details?clientId=probe'
          check_guarded_route '/api/customer-service/orders/TEST/history?clientId=probe'
      - name: Verify website downloads the APK through Kun Online
        run: |
          set -euo pipefail
          page="$(curl -fsS https://app.kun-online.com/)"
          grep -Fq "/api/mobile/app-update/apk" <<< "$page"
          if grep -Fq "https://github.com/ahmed5330/kunonline/releases/download/android-latest/Kun-Online-Mobile.apk" <<< "$page"; then
            echo "Website still exposes the legacy direct GitHub APK URL."
            exit 1
          fi

          headers="$(mktemp)"
          apk="$(mktemp --suffix=.apk)"
          listing="$(mktemp)"
          curl -fsS -D "$headers" -o "$apk" https://app.kun-online.com/api/mobile/app-update/apk
          grep -Eiq '^content-type: application/vnd\.android\.package-archive' "$headers"
          grep -Eiq '^content-disposition: attachment; filename="Kun-Online-Mobile-v2\.6\.0\.apk"' "$headers"
          grep -Eiq '^x-kun-online-android-version: 110' "$headers"
          test "$(wc -c < "$apk")" -gt 1000000
          unzip -l "$apk" > "$listing"
          grep -Fq 'AndroidManifest.xml' "$listing"
          echo "Website Android download verified through Kun Online: $(wc -c < "$apk") bytes"
