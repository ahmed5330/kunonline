name: Cloudflare Production runtime config read-only
on:
  push:
    branches:
      - develop/ux-system-upgrade
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: List Production Worker secret names only
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.production.toml | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{
              const p=JSON.parse(raw);const a=Array.isArray(p)?p:(p.result||[]);
              console.log("Production Worker secret names:");
              for(const x of a) console.log(x.name||x.key||String(x));
            });'
      - name: Count Preview integration connections by provider/status only
        run: |
          npx wrangler d1 execute kunonline-preview --remote --config wrangler.preview.toml --command "SELECT provider,status,COUNT(*) AS connections FROM store_connections GROUP BY provider,status ORDER BY provider,status;"
      - name: Inspect Preview D1 migration ledger schema and names only
        run: |
          npx wrangler d1 execute kunonline-preview --remote --config wrangler.preview.toml --command "PRAGMA table_info(d1_migrations); SELECT id,name,applied_at FROM d1_migrations ORDER BY id;"
