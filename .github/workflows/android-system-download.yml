name: Publish Android APK to system

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-system-download.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kunonline-android-system-download
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and test latest Android APK
        working-directory: android
        run: gradle test assembleDebug

      - name: Read Android version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -1)"
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing Kun Online Android v$version"

      - name: Replace stable Android release asset
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.name }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/Kun-Online-Mobile.apk
          gh release upload android-latest /tmp/Kun-Online-Mobile.apk --clobber
          gh release delete-asset android-latest app-debug.apk -y || true
          gh release edit android-latest \
            --target "$GITHUB_SHA" \
            --title "Kun Online Android v$APP_VERSION" \
            --notes "Latest Kun Online Android Caller ID v$APP_VERSION. The stable system download URL always points to this APK."

      - name: Verify stable APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view android-latest --json assets --jq '.assets[].name' | grep -Fxq 'Kun-Online-Mobile.apk'
