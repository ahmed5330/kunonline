name: Clarity isolated validation
on:
  push:
    branches: [feature/clarity-preview-20261009]
permissions:
  contents: read
jobs:
  clarity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run test:clarity
      - run: npm test
      - run: npm run check:preview-config
      - run: npm run check:production-config
