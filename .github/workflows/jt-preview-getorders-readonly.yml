name: J&T Preview getOrders read-only diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jt-preview-getorders-readonly.yml
permissions:
  contents: read
concurrency:
  group: kunonline-jt-preview-getorders-readonly
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://kunonline-preview.mr-a-mnaa.workers.dev/v2/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SHA: 10db76bdbf491b92e5de6ac809034caa895c6652
      BASE_URL: https://kunonline-preview.mr-a-mnaa.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate diagnostic wrapper cannot create or print a valid shipment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node --check src/index-preview-jt-getorders-diagnostic.js
          grep -F 'createdNoOrders:true' src/index-preview-jt-getorders-diagnostic.js
          grep -F 'printedNoLabels:true' src/index-preview-jt-getorders-diagnostic.js
          grep -F 'invalidProbeCannotCreate:true' src/index-preview-jt-getorders-diagnostic.js
          grep -F "txlogisticId:''" src/index-preview-jt-getorders-diagnostic.js
          grep -F "orderType:'INVALID'" src/index-preview-jt-getorders-diagnostic.js
          grep -F 'operateType:999' src/index-preview-jt-getorders-diagnostic.js
          ! grep -nE 'UPDATE orders|INSERT INTO orders|DELETE FROM orders|printOrder|buildJtCreatePayload|createJtShipment' src/index-preview-jt-getorders-diagnostic.js
      - name: Capture exact current Preview Worker version
        id: previous
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.preview.toml --json)"
          version="$(printf '%s' "$status" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{
              const root=JSON.parse(raw),hits=[];
              const walk=x=>{if(Array.isArray(x)){for(const v of x)walk(v);return;}if(!x||typeof x!=="object")return;
                const id=x.version_id||x.versionId,pct=x.percentage??x.traffic_percentage??x.trafficPercentage;
                if(id)hits.push({id:String(id),pct:pct==null?null:Number(pct)});for(const v of Object.values(x))walk(v);};
              walk(root);const unique=[...new Map(hits.map(x=>[x.id,x])).values()];
              const full=unique.find(x=>x.pct===100||x.pct===1)||(unique.length===1?unique[0]:null);
              if(!full)process.exit(2);process.stdout.write(full.id);
            });')"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
          echo "Captured Preview version: $version"
      - name: Build ephemeral diagnostic config with masked runtime token
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "JT_DIAG_TOKEN=$token" >> "$GITHUB_ENV"
          cp wrangler.preview-jt-getorders-diagnostic.toml wrangler.preview-jt-getorders-diagnostic.runtime.toml
          TOKEN="$token" node -e "const fs=require('fs');const p='wrangler.preview-jt-getorders-diagnostic.runtime.toml';let s=fs.readFileSync(p,'utf8');s=s.replace(/\n\[observability\]/, '\nJT_DIAGNOSTIC_TOKEN = '+JSON.stringify(process.env.TOKEN)+'\n\n[observability]');fs.writeFileSync(p,s);"
          grep -F 'JT_DIAGNOSTIC_TOKEN = ' wrangler.preview-jt-getorders-diagnostic.runtime.toml >/dev/null
      - name: Deploy diagnostic wrapper
        run: npx wrangler deploy --config wrangler.preview-jt-getorders-diagnostic.runtime.toml --message "Temporary J&T endpoint diagnostic"
      - name: Read J&T evidence and invalid endpoint probes
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 20); do
            code="$(curl --silent --show-error -o /tmp/getorders.json -w '%{http_code}' -X POST -H "X-Kun-Diagnostic-Token: $JT_DIAG_TOKEN" "$BASE_URL/__internal/jt/getorders-diagnostic" || true)"
            if [ "$code" = "200" ] && node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/getorders.json','utf8'));process.exit(x.ok&&x.readOnly&&x.createdNoOrders&&x.printedNoLabels&&x.invalidProbeCannotCreate?0:1)"; then ready=1; break; fi
            echo "Waiting for diagnostic wrapper: HTTP $code attempt=$attempt/20"
            sleep 2
          done
          test "$ready" -eq 1
          echo '----- SANITIZED LIVE J&T EVIDENCE -----'
          cat /tmp/getorders.json
          echo
          echo '----- END EVIDENCE -----'
      - name: Restore exact prior Preview Worker version
        if: always()
        run: |
          set -euo pipefail
          prev='${{ steps.previous.outputs.version_id }}'
          test -n "$prev"
          npx wrangler versions deploy "$prev@100%" --yes --config wrangler.preview.toml --message "Restore exact Preview after J&T diagnostic"
      - name: Verify Preview restored and diagnostic closed
        if: always()
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error -o /tmp/health -w '%{http_code}' "$BASE_URL/healthz" || true)"
          closed="$(curl --silent --show-error -o /tmp/closed -w '%{http_code}' -X POST "$BASE_URL/__internal/jt/getorders-diagnostic" || true)"
          status="$(npx wrangler deployments status --config wrangler.preview.toml --json)"
          current="$(printf '%s' "$status" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{
              const root=JSON.parse(raw),hits=[];const walk=x=>{if(Array.isArray(x)){for(const v of x)walk(v);return;}if(!x||typeof x!=="object")return;const id=x.version_id||x.versionId,pct=x.percentage??x.traffic_percentage??x.trafficPercentage;if(id)hits.push({id:String(id),pct:pct==null?null:Number(pct)});for(const v of Object.values(x))walk(v);};walk(root);const unique=[...new Map(hits.map(x=>[x.id,x])).values()];const full=unique.find(x=>x.pct===100||x.pct===1)||(unique.length===1?unique[0]:null);if(!full)process.exit(2);process.stdout.write(full.id);});')"
          test "$health" = "200"
          test "$closed" = "404"
          test "$current" = '${{ steps.previous.outputs.version_id }}'
          echo "Preview restored exactly and diagnostic closed: version=$current health=$health diagnostic=$closed"
