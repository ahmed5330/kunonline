name: Easy Orders selective replay fake QA (NO DEPLOY)
on:
  pull_request:
    branches:
      - audit/easyorders-store-gap-scan-20261024
    paths:
      - 'src/easyorders-explicit-gap-replay.js'
      - 'src/commerce-order-sync.js'
      - 'scripts/easyorders-sync-concurrency-sqlite-test.mjs'
      - 'src/index-commerce-v34.js'
      - 'src/easyorders-cron-priority.js'
      - 'src/easyorders-order-reconciliation.js'
      - 'src/easyorders-connection-config.js'
      - 'scripts/easyorders-cron-priority-test.mjs'
      - 'scripts/easyorders-scheduler-outcome-test.mjs'
      - 'scripts/easyorders-explicit-gap-replay-test.mjs'
      - '.github/workflows/easyorders-selective-replay-fake-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse and run isolated synthetic replay
        run: |
          node --check src/easyorders-explicit-gap-replay.js
          node --check src/index-commerce-v34.js
          node --check scripts/easyorders-explicit-gap-replay-test.mjs
          node scripts/easyorders-explicit-gap-replay-test.mjs
          node scripts/easyorders-store-gap-audit-test.mjs
          node scripts/easyorders-sync-concurrency-sqlite-test.mjs
          node scripts/easyorders-cron-priority-test.mjs
          node scripts/easyorders-scheduler-outcome-test.mjs
          node scripts/easyorders-recovered-fee-guard-test.mjs
      - name: Assert runtime replay flag is disabled unless explicitly set
        run: |
          node -e "const fs=require('fs'),s=fs.readFileSync('src/easyorders-explicit-gap-replay.js','utf8');if(!s.includes(\"EASYORDERS_TARGETED_RECOVERY_ENABLED!=='true'\")) process.exit(1)"
