name: Production J&T fix and guarded 439 shipment
on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: [.github/workflows/production-jt-fix-create-439.yml]
concurrency:
  group: kunonline-production-20260910
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_REF: release/commerce-v38-production-20260910
      EXPECTED_RELEASE_SHA: 54f43ddeb3880862bad520238c7cbcd0a5f507c8
      PROD_CUSTOM: https://app.kun-online.com
      PROD_WORKERS: https://kunonline.mr-a-mnaa.workers.dev
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Verify exact release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          grep -q "import app from './index-commerce-v38.js';" src/index-production-sync.js
          node --check src/index-production-sync.js
          node --check src/index-commerce-v38.js
          node --check src/jt-express-eg-api.js
          npm run check:production-config
      - name: Safely map late legacy orders to their only store
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS ambiguous FROM orders o WHERE o.client_id IS NOT NULL AND trim(o.client_id)<>'' AND o.store_id IS NULL AND (SELECT COUNT(*) FROM stores s WHERE s.client_id=o.client_id)<>1; SELECT COUNT(*) AS unmapped_before FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL;" --json)"
          printf '%s' "$result" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const p=JSON.parse(raw),rows=[];const walk=x=>{if(Array.isArray(x))return x.forEach(walk);if(x&&typeof x==="object"){if(Array.isArray(x.results))rows.push(...x.results);Object.values(x).forEach(walk)}};walk(p);const a=Number(rows.find(x=>x.ambiguous!=null)?.ambiguous||0),u=Number(rows.find(x=>x.unmapped_before!=null)?.unmapped_before||0);if(a!==0)throw new Error(`Ambiguous unmapped orders=${a}; refusing to guess store mapping`);console.log(`Safe late-order mapping preflight passed; unmapped=${u}.`);});'
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "UPDATE orders SET store_id=(SELECT s.id FROM stores s WHERE s.client_id=orders.client_id LIMIT 1) WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL AND (SELECT COUNT(*) FROM stores s WHERE s.client_id=orders.client_id)=1;" >/tmp/map-result.txt
          rm -f /tmp/map-result.txt
      - name: Verify Production D1 readiness
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS migration_count FROM d1_migrations; SELECT name AS last_migration FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS unmapped_orders FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL;" --json)"
          printf '%s' "$result" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const p=JSON.parse(raw),rows=[];const walk=x=>{if(Array.isArray(x))return x.forEach(walk);if(x&&typeof x==="object"){if(Array.isArray(x.results))rows.push(...x.results);Object.values(x).forEach(walk)}};walk(p);const get=k=>rows.find(x=>x[k]!=null)?.[k];if(Number(get("migration_count"))!==23)throw new Error(`migration_count=${get("migration_count")}`);if(get("last_migration")!=="0022_order_duplicate_links.sql")throw new Error(`last_migration=${get("last_migration")}`);if(Number(get("unmapped_orders"))!==0)throw new Error(`unmapped_orders=${get("unmapped_orders")}`);console.log("Production D1 readiness passed.");});'
      - name: Verify required Worker secrets by name only
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.production.toml >/tmp/prod-secrets.json
          node - <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('/tmp/prod-secrets.json','utf8')),a=Array.isArray(p)?p:(p.result||[]),names=new Set(a.map(x=>x.name||x.key));
          for(const k of ['SESSION_SECRET','TOKEN_ENC_KEY','INTEGRATION_ENCRYPTION_KEY'])if(!names.has(k))throw new Error(`Missing ${k}`);
          console.log('Required Worker secret names present.');
          NODE
          rm -f /tmp/prod-secrets.json
      - name: Capture exact current Production Worker version
        id: before
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.production.toml --json)"
          version="$(printf '%s' "$status" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const root=JSON.parse(raw),hits=[];const walk=x=>{if(Array.isArray(x)){x.forEach(walk);return}if(!x||typeof x!=="object")return;const id=x.version_id||x.versionId,p=x.percentage??x.traffic_percentage??x.trafficPercentage;if(id)hits.push({id:String(id),p:p==null?null:Number(p)});Object.values(x).forEach(walk)};walk(root);const u=[...new Map(hits.map(x=>[x.id,x])).values()];const full=u.find(x=>x.p===100||x.p===1)||(u.length===1?u[0]:null);if(!full)process.exit(2);process.stdout.write(full.id)});')"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
      - name: Dry-run exact Production bundle
        run: npx wrangler deploy --dry-run --config wrangler.production.toml >/tmp/prod-dry-run.log 2>&1
      - name: Deploy v38 J&T fix
        id: deploy
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --config wrangler.production.toml
      - name: Wait for propagation and health on both Production hosts
        run: |
          set -euo pipefail
          for base in "$PROD_WORKERS" "$PROD_CUSTOM"; do
            ok=0
            for i in $(seq 1 24); do
              h="$(curl -sS -o /tmp/health -w '%{http_code}' "$base/health" || true)"
              e="$(curl -sS -o /tmp/easy -w '%{http_code}' "$base/health/easyorders-sync" || true)"
              if [ "$h" = "200" ] && [ "$e" = "200" ] && node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/easy","utf8"));if(p.ok!==true||p.service!=="easyorders-production-sync"||p.build!=="production-commerce-v38-free-tier-safe-2026-09-10")process.exit(1)' >/dev/null 2>&1; then ok=1;break;fi
              sleep 4
            done
            test "$ok" = "1"
          done
      - name: Verify J&T auth gate without creating shipment
        run: |
          set -euo pipefail
          for base in "$PROD_WORKERS" "$PROD_CUSTOM"; do
            code="$(curl -sS -o /tmp/jt -w '%{http_code}' -X POST -H 'Content-Type: application/json' "$base/api/jt/shipments/KUN-SMOKE-NO-ORDER" --data '{}' || true)"
            route="$(node -e 'const fs=require("fs");try{const p=JSON.parse(fs.readFileSync("/tmp/jt","utf8"));process.stdout.write(p.code==="AUTH_REQUIRED"?"yes":"no")}catch{process.stdout.write("no")}' || true)"
            test "$code" = "401" && test "$route" = "yes"
          done
      - name: Verify v2 application and Cron ownership
        run: |
          set -euo pipefail
          for base in "$PROD_WORKERS" "$PROD_CUSTOM"; do
            code="$(curl -sS -o /tmp/v2 -w '%{http_code}' "$base/v2/" || true)";test "$code" = "200";grep -qi '<html\|<!DOCTYPE html' /tmp/v2
          done
          schedules="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kunonline/schedules")"
          printf '%s' "$schedules" | node -e 'let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const p=JSON.parse(raw);if(p.success===false)throw new Error("Cloudflare schedules failed");const got=(p.result||[]).map(x=>x.cron).sort(),want=["*/5 * * * *","0 */2 * * *"].sort();if(JSON.stringify(got)!==JSON.stringify(want))throw new Error(`Cron mismatch ${JSON.stringify(got)}`);console.log("Cron integrity passed.")})'
      - name: Roll back exact prior Worker on deploy validation failure
        if: failure() && steps.deploy.outputs.attempted == 'true'
        run: |
          npx wrangler rollback "${{ steps.before.outputs.version_id }}" --config wrangler.production.toml --message "Automatic rollback - J&T Production fix validation failed"
      - name: Clean deployment temp files
        if: always()
        run: rm -f /tmp/prod-secrets.json /tmp/prod-dry-run.log /tmp/health /tmp/easy /tmp/jt /tmp/v2 /tmp/map-result.txt

  create-shipment:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_BASE: https://app.kun-online.com
      RESULT_PATH: /tmp/jt-result.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Create exactly one guarded J&T shipment for the failed 439 order
        run: node scripts/production-jt-create-439-once.mjs
      - name: Upload one-day shipment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-jt-create-439-result
          path: /tmp/jt-result.json
          if-no-files-found: ignore
          retention-days: 1
