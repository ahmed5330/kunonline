name: Production Esraa reset transport hotfix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-esraa-reset-transport-hotfix-once.yml
permissions:
  contents: read
concurrency:
  group: kunonline-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 18b44bc3c4a3db6769babd7342f2bebc88c51117
      HOTFIX_SHA: 21e440deb6351c6850fa51314ce2d62d3d219e86
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HOTFIX_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Verify exact isolated hotfix diff
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOTFIX_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HOTFIX_SHA" | sort)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "public/v2/index.html"
          test "${changed[1]}" = "public/v2/modules-v90-admin-reset-direct.js"
          grep -Fq '/v2/modules-v90-admin-reset-direct.js?v=90.0' public/v2/index.html
          grep -Fq 'new XMLHttpRequest()' public/v2/modules-v90-admin-reset-direct.js
          grep -Fq '/reset-owner-password' public/v2/modules-v90-admin-reset-direct.js
          grep -Fq 'مسح محاولات الدخول' public/v2/modules-v90-admin-reset-direct.js
          node --check public/v2/modules-v90-admin-reset-direct.js
      - run: npm test
      - run: npm run check:deploy
      - run: npm run check:production-config

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: production
      url: https://app.kun-online.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_SHA: 18b44bc3c4a3db6769babd7342f2bebc88c51117
      HOTFIX_SHA: 21e440deb6351c6850fa51314ce2d62d3d219e86
      BASE_URL: https://app.kun-online.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HOTFIX_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Capture current Production Worker version
        id: previous
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.production.toml --json)"
          version="$(printf '%s' "$status" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{
              const root=JSON.parse(raw),hits=[];
              const walk=x=>{if(Array.isArray(x)){for(const v of x)walk(v);return;}if(!x||typeof x!=="object")return;
                const id=x.version_id||x.versionId,pct=x.percentage??x.traffic_percentage??x.trafficPercentage;
                if(id)hits.push({id:String(id),pct:pct==null?null:Number(pct)});for(const v of Object.values(x))walk(v);};
              walk(root);const unique=[...new Map(hits.map(x=>[x.id,x])).values()];
              const full=unique.find(x=>x.pct===100||x.pct===1)||(unique.length===1?unique[0]:null);
              if(!full)process.exit(2);process.stdout.write(full.id);
            });')"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
          echo "Captured prior Production Worker version: $version"
      - name: Revalidate isolated hotfix before deploy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOTFIX_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HOTFIX_SHA" | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "public/v2/index.html"
          test "${changed[1]}" = "public/v2/modules-v90-admin-reset-direct.js"
          npm run check:production-config
          node --check public/v2/modules-v90-admin-reset-direct.js
      - name: Deploy Production Worker and assets only
        id: deploy_worker
        run: |
          set -euo pipefail
          output="$(npx wrangler deploy --config wrangler.production.toml --message "Isolated admin reset transport hotfix $HOTFIX_SHA" 2>&1)"
          printf '%s\n' "$output"
          version="$(printf '%s\n' "$output" | sed -nE 's/.*Current Version ID: ([0-9a-f-]{36}).*/\1/p' | tail -1)"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
      - name: Verify Production hotfix acceptance
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 50); do
            health="$(curl --silent --show-error -o /tmp/health -w '%{http_code}' "$BASE_URL/healthz" || true)"
            page="$(curl --silent --show-error -o /tmp/v2.html -w '%{http_code}' "$BASE_URL/v2/?hotfix=esraa-v90" || true)"
            asset="$(curl --silent --show-error -o /tmp/v90.js -w '%{http_code}' "$BASE_URL/v2/modules-v90-admin-reset-direct.js?v=90.0" || true)"
            if [ "$health" = "200" ] && [ "$page" = "200" ] && [ "$asset" = "200" ] && \
               grep -Fq '/v2/modules-v90-admin-reset-direct.js?v=90.0' /tmp/v2.html && \
               grep -Fq 'new XMLHttpRequest()' /tmp/v90.js && \
               grep -Fq '/reset-owner-password' /tmp/v90.js && \
               grep -Fq 'مسح محاولات الدخول' /tmp/v90.js; then
              ready=1
              echo "Direct reset hotfix is live on Production (attempt $attempt/50)."
              break
            fi
            echo "Waiting for Production propagation: health=$health page=$page asset=$asset attempt=$attempt/50"
            sleep 2
          done
          test "$ready" -eq 1
          protected="$(curl --silent --show-error -o /tmp/reset-protected.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE_URL/api/admin/clients/KUN-AUTH-PROBE/reset-owner-password" || true)"
          test "$protected" = "401" -o "$protected" = "403"
          echo "Reset endpoint remains protected: HTTP $protected"
      - name: Roll back prior Worker version if acceptance fails
        if: failure() && steps.deploy_worker.outputs.version_id != '' && steps.previous.outputs.version_id != ''
        run: |
          set -euo pipefail
          echo "Acceptance failed; restoring ${{ steps.previous.outputs.version_id }}"
          npx wrangler versions deploy "${{ steps.previous.outputs.version_id }}@100%" --yes --config wrangler.production.toml --message "Automatic rollback after failed admin reset transport hotfix"
          restored=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error -o /tmp/rollback-health -w '%{http_code}' "$BASE_URL/healthz" || true)"
            if [ "$code" = "200" ]; then restored=1; break; fi
            sleep 2
          done
          test "$restored" -eq 1
