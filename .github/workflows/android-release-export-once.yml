name: Android release export once

on:
  push:
    branches:
      - tmp/android-release-export-20260916
    paths:
      - '.github/workflows/android-release-export-once.yml'
      - 'android/**'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release
        working-directory: android
        run: gradle test assembleRelease
      - name: Collect apksigner
        run: |
          set -euo pipefail
          TOOL="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$TOOL"
          DIR="$(dirname "$TOOL")"
          mkdir -p signer/lib export
          cp "$TOOL" signer/apksigner
          cp "$DIR/lib/apksigner.jar" signer/lib/apksigner.jar
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk export/Kun-Online-Mobile-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kun-online-release-export
          path: |
            export/Kun-Online-Mobile-unsigned.apk
            signer/apksigner
            signer/lib/apksigner.jar
          if-no-files-found: error
