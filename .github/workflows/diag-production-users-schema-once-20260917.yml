name: Diagnose Production users schema once

on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: ['.github/workflows/diag-production-users-schema-once-20260917.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/commerce-v38-production-20260910
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Read users schema only
        run: |
          set -euo pipefail
          echo '--- users table info ---'
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "PRAGMA table_info(users);" --json
          echo '--- users count ---'
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS users_total FROM users;" --json
          echo '--- login attempts schema ---'
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "PRAGMA table_info(login_attempts);" --json
          echo '--- required auth columns check ---'
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS users_with_password FROM users WHERE password IS NOT NULL AND password <> ''; SELECT COUNT(*) AS users_with_null_last_login FROM users WHERE last_login IS NULL;" --json
