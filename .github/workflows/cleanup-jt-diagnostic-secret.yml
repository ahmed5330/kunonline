name: Cleanup J&T diagnostic secret
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-jt-diagnostic-secret.yml
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Remove temporary diagnostic secret if present
        run: |
          set -euo pipefail
          before="$(npx wrangler secret list --name kunonline 2>&1 || true)"
          if printf '%s' "$before" | grep -Fq 'JT_DIAGNOSTIC_TOKEN'; then
            printf 'y\n' | npx wrangler secret delete JT_DIAGNOSTIC_TOKEN --name kunonline
          fi
          after="$(npx wrangler secret list --name kunonline 2>&1 || true)"
          if printf '%s' "$after" | grep -Fq 'JT_DIAGNOSTIC_TOKEN'; then
            echo 'Temporary J&T diagnostic secret still exists.'
            exit 1
          fi
          echo 'Temporary J&T diagnostic secret is absent.'
