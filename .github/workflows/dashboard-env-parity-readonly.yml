name: Dashboard environment parity read-only audit

on:
  workflow_run:
    workflows: ["Production deploy (no database migrations)"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_EMAIL: esraanabilismail@gmail.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Compare dashboard source data without writes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {execFileSync}=require('child_process');
          const email=String(process.env.TARGET_EMAIL||'').trim().toLowerCase();
          if(!email||!/^[^']+@[^']+$/.test(email))throw new Error('Invalid audit email');
          const configs={production:{db:'kunonline',config:'wrangler.production.toml'},preview:{db:'kunonline-preview',config:'wrangler.preview.toml'}};
          const lit=v=>`'${String(v).replaceAll("'","''")}'`;
          function query(envName,sql){
            const cfg=configs[envName];
            let raw='';
            try{
              raw=execFileSync('npx',['wrangler','d1','execute',cfg.db,'--remote','--config',cfg.config,'--command',sql,'--json'],{encoding:'utf8',stdio:['ignore','pipe','pipe'],env:process.env,maxBuffer:20*1024*1024});
            }catch(error){
              const detail=String(error?.stderr||error?.stdout||error?.message||error).slice(0,2000);
              throw new Error(`${envName} D1 read-only query failed: ${detail}`);
            }
            const parsed=JSON.parse(raw);return parsed?.[0]?.results||[];
          }
          const cairoDay=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          function snapshot(envName){
            const user=query(envName,`SELECT id,client_id,role,status FROM users WHERE lower(trim(email))=${lit(email)} ORDER BY CASE role WHEN 'client' THEN 0 ELSE 1 END,created_at LIMIT 1`)[0];
            if(!user)return {label:envName,userFound:false,cairoDay};
            const clientId=String(user.client_id||''), cid=lit(clientId);
            const stores=query(envName,`SELECT id,name,code,status,is_default FROM stores WHERE client_id=${cid} ORDER BY is_default DESC,name`);
            const summary=query(envName,`SELECT COUNT(*) total_orders, SUM(CASE WHEN NOT EXISTS (SELECT 1 FROM order_duplicate_links d WHERE d.duplicate_order_id=o.id) THEN 1 ELSE 0 END) canonical_orders, SUM(CASE WHEN date(COALESCE(o.date,o.created_at))=${lit(cairoDay)} AND NOT EXISTS (SELECT 1 FROM order_duplicate_links d WHERE d.duplicate_order_id=o.id) THEN 1 ELSE 0 END) today_canonical, MIN(date(COALESCE(o.date,o.created_at))) first_order_day, MAX(date(COALESCE(o.date,o.created_at))) last_order_day, MAX(o.created_at) latest_created_at FROM orders o WHERE o.client_id=${cid}`)[0]||{};
            const states=query(envName,`SELECT COALESCE(o.state,'pending') state,COUNT(*) n FROM orders o WHERE o.client_id=${cid} AND NOT EXISTS (SELECT 1 FROM order_duplicate_links d WHERE d.duplicate_order_id=o.id) GROUP BY COALESCE(o.state,'pending') ORDER BY n DESC`);
            const sources=query(envName,`SELECT COALESCE(o.source,'') source,COUNT(*) n,MAX(o.created_at) latest_created_at FROM orders o WHERE o.client_id=${cid} AND NOT EXISTS (SELECT 1 FROM order_duplicate_links d WHERE d.duplicate_order_id=o.id) GROUP BY COALESCE(o.source,'') ORDER BY n DESC`);
            const orders=query(envName,`SELECT o.id,o.store_id,date(COALESCE(o.date,o.created_at)) order_day,o.created_at,COALESCE(o.state,'pending') state,COALESCE(o.source,'') source FROM orders o WHERE o.client_id=${cid} AND NOT EXISTS (SELECT 1 FROM order_duplicate_links d WHERE d.duplicate_order_id=o.id) ORDER BY COALESCE(o.date,o.created_at),o.created_at`);
            let syncState={};try{syncState=query(envName,"SELECT updated_at,json_extract(json,'$.easyOrdersRecovery.lastRunAt') recovery_last_run,json_extract(json,'$.easyOrdersRecovery.status') recovery_status,json_extract(json,'$.easyOrdersRecovery.connectedClients') recovery_clients,json_extract(json,'$.easyOrdersRecovery.requests') recovery_requests,json_extract(json,'$.easyOrdersRecovery.recovered') recovery_recovered,json_extract(json,'$.easyOrdersRecovery.updated') recovery_updated,json_array_length(json_extract(json,'$.clients')) configured_clients FROM state WHERE id=1")[0]||{};}catch(error){syncState={auditError:String(error.message||error)}}
            return {label:envName,userFound:true,clientId,role:user.role,status:user.status,cairoDay,stores,summary,states,sources,orders,syncState};
          }
          const production=snapshot('production'),preview=snapshot('preview');
          const prodOrders=production.orders||[],prevOrders=preview.orders||[],prodMap=new Map(prodOrders.map(x=>[String(x.id),x])),prevMap=new Map(prevOrders.map(x=>[String(x.id),x]));
          const missingInProduction=prevOrders.filter(x=>!prodMap.has(String(x.id))),missingInPreview=prodOrders.filter(x=>!prevMap.has(String(x.id))),common=[...prodMap.keys()].filter(id=>prevMap.has(id));
          const stateDiffs=common.map(id=>({id,production:prodMap.get(id),preview:prevMap.get(id)})).filter(x=>String(x.production.state)!==String(x.preview.state)||String(x.production.store_id||'')!==String(x.preview.store_id||'')||String(x.production.order_day||'')!==String(x.preview.order_day||''));
          const output={cairoDay,production:{userFound:production.userFound,clientId:production.clientId,role:production.role,status:production.status,stores:production.stores,summary:production.summary,states:production.states,sources:production.sources,syncState:production.syncState},preview:{userFound:preview.userFound,clientId:preview.clientId,role:preview.role,status:preview.status,stores:preview.stores,summary:preview.summary,states:preview.states,sources:preview.sources,syncState:preview.syncState},parity:{commonOrders:common.length,missingInProduction:missingInProduction.length,missingInPreview:missingInPreview.length,stateOrScopeDifferences:stateDiffs.length,missingInProductionSample:missingInProduction.slice(-15),missingInPreviewSample:missingInPreview.slice(-15),stateDifferenceSample:stateDiffs.slice(-15)}};
          console.log('DASHBOARD_ENV_PARITY_READONLY');console.log(JSON.stringify(output,null,2));
          NODE
