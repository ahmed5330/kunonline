name: Protected Production synthetic runtime parity
on:
  push:
    branches: [codex/serialized-warehouse-operations]
    paths: ['.github/workflows/protected-production-synthetic-runtime-20261025.yml']
permissions:
  contents: read
jobs:
  production-runtime-qa:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: 5150a520704424039948df8e71727bc56a1df371
          path: qa-backend
      - uses: actions/checkout@v5
        with:
          ref: 36a027afd7a54abb53eaf375716d6d828c0fc047
          path: qa-production
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm install --ignore-scripts
        working-directory: qa-backend
      - run: npm audit --audit-level=high
      - name: Prove schema and wallet safety with serialized inventory activation deferred
        working-directory: qa-backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/existing-inventory-schema-check.mjs
          node scripts/preview-release-schema-contract.mjs
          node scripts/preview-wallet-finance-invariants.mjs
          node ../scripts/general-release-invariant-diagnostics.mjs
          node scripts/preview-inventory-deferral-proof.mjs
      - name: Provision schema-only synthetic canonical backend
        id: provision
        working-directory: qa-backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/provision-isolated-preview-qa.mjs
      - name: Verify fresh isolated public API routing before synthetic writes
        run: node scripts/wait-isolated-qa-api-ready.mjs
      - name: Seed and verify synthetic provider orders on isolated backend
        working-directory: qa-backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/live-preview-easyorders-test.mjs "$KUN_PREVIEW_QA_BASE_URL"
      - name: Verify real isolated browser after partial dashboard fix
        working-directory: qa-backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/browser-preview-breakdown-controls-test.mjs "$KUN_PREVIEW_QA_BASE_URL"
      - name: Verify all isolated mobile views and J&T setup at360px and390px
        working-directory: qa-backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/browser-preview-mobile-qa.mjs "$KUN_PREVIEW_QA_BASE_URL"
      - name: Verify isolated backend release capabilities
        working-directory: qa-backend
        run: node scripts/production-preview-release-gate.mjs --isolated-qa "$KUN_PREVIEW_QA_BASE_URL"
      - name: Test actual Production front with two isolated DBs and private backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/verify-production-synthetic-runtime.mjs
      - name: Remove QA Production front after success failure or cancellation
        if: always() && steps.provision.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-production-synthetic-runtime.mjs --cleanup
# Source exports are schema-only. Actual customer Workers and DB rows are never
# deployed/changed. All auth, wallet and order fixtures belong to new QA DBs.

# Read-only provenance classification requires independent order/store fixture evidence.
