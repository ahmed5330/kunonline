name: Production J&T fix deploy v2
on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: [.github/run-production-jt-fix-deploy-v2-20260910.txt]
concurrency:
  group: kunonline-production-20260910
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_REF: dcfe77e96a92968077aa371f7a6b734f96819263
      EXPECTED_RELEASE_SHA: dcfe77e96a92968077aa371f7a6b734f96819263
      PROD_CUSTOM: https://app.kun-online.com
      PROD_WORKERS: https://kunonline.mr-a-mnaa.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate exact release and Production readiness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          node scripts/jt-live-shipping-test.mjs
          grep -q "import app from './index-commerce-v38.js';" src/index-production-sync.js
          npm run check:production-config
          result="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS migration_count FROM d1_migrations; SELECT name AS last_migration FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS unmapped_orders FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL;" --json)"
          printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s),a=[];const w=x=>{if(Array.isArray(x))return x.forEach(w);if(x&&typeof x==="object"){if(Array.isArray(x.results))a.push(...x.results);Object.values(x).forEach(w)}};w(p);const g=k=>a.find(x=>x[k]!=null)?.[k];if(Number(g("migration_count"))!==23||g("last_migration")!=="0022_order_duplicate_links.sql"||Number(g("unmapped_orders"))!==0)throw new Error("Production D1 readiness failed");console.log("Production D1 readiness passed")})'
      - name: Capture current Production Worker version
        id: before
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.production.toml --json)"
          version="$(printf '%s' "$status" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s),a=[];const w=x=>{if(Array.isArray(x)){x.forEach(w);return}if(!x||typeof x!=="object")return;const id=x.version_id||x.versionId,q=x.percentage??x.traffic_percentage??x.trafficPercentage;if(id)a.push({id:String(id),q:q==null?null:Number(q)});Object.values(x).forEach(w)};w(p);const u=[...new Map(a.map(x=>[x.id,x])).values()],f=u.find(x=>x.q===100||x.q===1)||(u.length===1?u[0]:null);if(!f)process.exit(2);process.stdout.write(f.id)})')"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
      - name: Dry-run Production bundle
        run: npx wrangler deploy --dry-run --config wrangler.production.toml >/dev/null
      - name: Deploy fixed v38 Worker
        id: deploy
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --config wrangler.production.toml
      - name: Wait for API and J&T propagation
        run: |
          set -euo pipefail
          for base in "$PROD_WORKERS" "$PROD_CUSTOM"; do
            api_ready=0
            for i in $(seq 1 24); do
              h="$(curl -sS -o /tmp/h -w '%{http_code}' "$base/health" || true)"
              e="$(curl -sS -o /tmp/e -w '%{http_code}' "$base/health/easyorders-sync" || true)"
              build="$(node -e 'try{const p=JSON.parse(require("fs").readFileSync("/tmp/e","utf8"));process.stdout.write(String(p.build||""))}catch{}' 2>/dev/null || true)"
              if [ "$h" = 200 ] && [ "$e" = 200 ] && [ "$build" = "production-commerce-v38-free-tier-safe-2026-09-10" ]; then api_ready=1; break; fi
              sleep 4
            done
            test "$api_ready" = 1
            auth_ready=0
            for i in $(seq 1 15); do
              jc="$(curl -sS -o /tmp/j -w '%{http_code}' -X POST -H 'Content-Type: application/json' "$base/api/jt/shipments/KUN-SMOKE-NO-ORDER" --data '{}' || true)"
              jcode="$(node -e 'try{const p=JSON.parse(require("fs").readFileSync("/tmp/j","utf8"));process.stdout.write(String(p.code||""))}catch{}' 2>/dev/null || true)"
              if [ "$jc" = 401 ] && [ "$jcode" = AUTH_REQUIRED ]; then auth_ready=1; break; fi
              sleep 4
            done
            test "$auth_ready" = 1
          done
      - name: Wait for v2 assets and verify Cron
        run: |
          set -euo pipefail
          for base in "$PROD_WORKERS" "$PROD_CUSTOM"; do
            v2_ready=0
            for i in $(seq 1 30); do
              vc="$(curl -sS -o /tmp/v -w '%{http_code}' "$base/v2/" || true)"
              if [ "$vc" = 200 ] && grep -Eqi '<html|<!doctype' /tmp/v; then
                echo "v2 ready on $base at attempt $i"
                v2_ready=1
                break
              fi
              sleep 4
            done
            test "$v2_ready" = 1
          done
          schedules="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kunonline/schedules")"
          printf '%s' "$schedules" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s),crons=[];const w=x=>{if(Array.isArray(x)){x.forEach(w);return}if(!x||typeof x!=="object")return;if(typeof x.cron==="string")crons.push(x.cron);Object.values(x).forEach(w)};w(p);const got=[...new Set(crons)].sort(),want=["*/5 * * * *","0 */2 * * *"].sort();if(p.success===false||JSON.stringify(got)!==JSON.stringify(want))throw new Error(`Cron mismatch ${JSON.stringify(got)}`);console.log("Production API, v2 and Cron validation passed")})'
          rm -f /tmp/h /tmp/e /tmp/j /tmp/v
      - name: Roll back exact prior Worker on failure
        if: failure() && steps.deploy.outputs.attempted == 'true'
        run: |
          npx wrangler rollback "${{ steps.before.outputs.version_id }}" --config wrangler.production.toml --message "Automatic rollback after Production J&T validation failure"
