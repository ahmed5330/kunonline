name: Production J&T fix deploy v2
on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: [.github/run-production-jt-fix-deploy-v2-20260910.txt]
concurrency:
  group: kunonline-production-20260910
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_REF: release/commerce-v38-production-20260910
      EXPECTED_RELEASE_SHA: 1d5653238151197c1d3952aab077cc891d0c1353
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate exact release and Production readiness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          node scripts/jt-live-shipping-test.mjs
          npm run check:production-config
          test "$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) n FROM d1_migrations" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s),a=[];const w=x=>{if(Array.isArray(x))return x.forEach(w);if(x&&typeof x==="object"){if(Array.isArray(x.results))a.push(...x.results);Object.values(x).forEach(w)}};w(p);process.stdout.write(String(a.find(x=>x.n!=null)?.n||0))})')" = 23
      - name: Backfill transition orders with retry
        run: |
          set -euo pipefail
          sql="UPDATE orders SET store_id=(SELECT id FROM stores s WHERE s.client_id=orders.client_id AND s.status='active' ORDER BY s.is_default DESC,s.created_at LIMIT 1) WHERE store_id IS NULL AND client_id IS NOT NULL AND trim(client_id)<>'';"
          ok=0
          for i in 1 2 3 4; do if npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "$sql" >/dev/null 2>&1; then ok=1; break; fi; sleep $((i*2)); done
          test "$ok" = 1
          n="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) n FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s),a=[];const w=x=>{if(Array.isArray(x))return x.forEach(w);if(x&&typeof x==="object"){if(Array.isArray(x.results))a.push(...x.results);Object.values(x).forEach(w)}};w(p);process.stdout.write(String(a.find(x=>x.n!=null)?.n??-1))})')"
          echo "unmapped_orders=$n"
          test "$n" = 0
      - name: Capture current Worker version
        id: before
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.production.toml --json)"
          version="$(printf '%s' "$status" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s),a=[];const w=x=>{if(Array.isArray(x)){x.forEach(w);return}if(!x||typeof x!=="object")return;const id=x.version_id||x.versionId,q=x.percentage??x.traffic_percentage??x.trafficPercentage;if(id)a.push({id:String(id),q:q==null?null:Number(q)});Object.values(x).forEach(w)};w(p);const u=[...new Map(a.map(x=>[x.id,x])).values()],f=u.find(x=>x.q===100||x.q===1)||(u.length===1?u[0]:null);if(!f)process.exit(2);process.stdout.write(f.id)})')"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
      - run: npx wrangler deploy --dry-run --config wrangler.production.toml >/dev/null
      - name: Deploy v38 J&T fix
        id: deploy
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --config wrangler.production.toml
      - name: Verify propagated v38 on workers.dev and custom domain
        run: |
          set -euo pipefail
          for base in https://kunonline.mr-a-mnaa.workers.dev https://app.kun-online.com; do
            echo "Checking $base"
            new=0
            for i in $(seq 1 20); do
              hc="$(curl -sS -o /tmp/h -w '%{http_code}' "$base/health" || true)"
              ec="$(curl -sS -o /tmp/e -w '%{http_code}' "$base/health/easyorders-sync" || true)"
              build="$(node -e 'try{const p=JSON.parse(require("fs").readFileSync("/tmp/e","utf8"));process.stdout.write(String(p.build||""))}catch{}' 2>/dev/null || true)"
              echo "propagation[$i] health=$hc easy=$ec build=$build"
              if [ "$hc" = 200 ] && [ "$ec" = 200 ] && [ "$build" = "production-commerce-v38-free-tier-safe-2026-09-10" ]; then new=1; break; fi
              sleep 4
            done
            test "$new" = 1
            sleep 5
            auth=0
            for i in $(seq 1 15); do
              jc="$(curl -sS -o /tmp/j -w '%{http_code}' -X POST -H 'Content-Type: application/json' "$base/api/jt/shipments/KUN-SMOKE-NO-ORDER" --data '{}' || true)"
              jcode="$(node -e 'try{const p=JSON.parse(require("fs").readFileSync("/tmp/j","utf8"));process.stdout.write(String(p.code||""))}catch{}' 2>/dev/null || true)"
              echo "jt[$i] http=$jc code=$jcode"
              if [ "$jc" = 401 ] && [ "$jcode" = AUTH_REQUIRED ]; then auth=1; break; fi
              sleep 4
            done
            test "$auth" = 1
            vc="$(curl -sS -o /tmp/v -w '%{http_code}' "$base/v2/" || true)"
            echo "v2 http=$vc"
            test "$vc" = 200
          done
          schedules="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kunonline/schedules")"
          printf '%s' "$schedules" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.success===false)throw new Error(JSON.stringify(p.errors));const got=(p.result||[]).map(x=>x.cron).sort(),want=["*/5 * * * *","0 */2 * * *"].sort();if(JSON.stringify(got)!==JSON.stringify(want))throw new Error(JSON.stringify(got));console.log("cron passed")})'
      - name: Final transition-order invariant
        run: |
          set -euo pipefail
          sql="UPDATE orders SET store_id=(SELECT id FROM stores s WHERE s.client_id=orders.client_id AND s.status='active' ORDER BY s.is_default DESC,s.created_at LIMIT 1) WHERE store_id IS NULL AND client_id IS NOT NULL AND trim(client_id)<>'';"
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "$sql" >/dev/null || true
          n="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) n FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s),a=[];const w=x=>{if(Array.isArray(x))return x.forEach(w);if(x&&typeof x==="object"){if(Array.isArray(x.results))a.push(...x.results);Object.values(x).forEach(w)}};w(p);process.stdout.write(String(a.find(x=>x.n!=null)?.n??-1))})')"
          test "$n" = 0
      - name: Roll back exact prior Worker on failure
        if: failure() && steps.deploy.outputs.attempted == 'true'
        run: npx wrangler rollback "${{ steps.before.outputs.version_id }}" --config wrangler.production.toml --message "Automatic rollback after Production J&T fix v2 validation failure"
