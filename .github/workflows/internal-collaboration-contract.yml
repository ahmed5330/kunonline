name: Internal Collaboration Contract

on:
  push:
    branches:
      - feature/internal-collaboration-v117
    paths:
      - 'src/internal-collaboration.js'
      - 'src/internal-collaboration-schema.js'
      - 'src/internal-collaboration-order-search.js'
      - 'public/v2/modules-v117-team-collaboration.js'
      - 'public/v2/modules-v118-collaboration-order-picker.js'
      - 'src/index-production-mobile-update.js'
      - 'migrations/0091_internal_collaboration.sql'
      - 'scripts/internal-collaboration-contract-test.mjs'
      - '.github/workflows/internal-collaboration-contract.yml'
  pull_request:
    paths:
      - 'src/internal-collaboration.js'
      - 'src/internal-collaboration-schema.js'
      - 'src/internal-collaboration-order-search.js'
      - 'public/v2/modules-v117-team-collaboration.js'
      - 'public/v2/modules-v118-collaboration-order-picker.js'
      - 'src/index-production-mobile-update.js'
      - 'migrations/0091_internal_collaboration.sql'
      - 'scripts/internal-collaboration-contract-test.mjs'
      - '.github/workflows/internal-collaboration-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/internal-collaboration.js
          node --check src/internal-collaboration-schema.js
          node --check src/internal-collaboration-order-search.js
          node --check public/v2/modules-v117-team-collaboration.js
          node --check public/v2/modules-v118-collaboration-order-picker.js
          node --check scripts/internal-collaboration-contract-test.mjs
      - name: Collaboration isolation contract
        run: node scripts/internal-collaboration-contract-test.mjs
