name: Admin current read-only inspect once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-readonly-inspect-current-once.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_SHA: cb37efcff677bf7fd424380528b1963a0a9ec56e
      INSPECT_URL: https://kunonline-admin-readonly-inspect-20260915.mr-a-mnaa.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate read-only inspector
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --check ops/admin-readonly-inspect-worker.js
          ! grep -Eq 'UPDATE|DELETE|INSERT|REPLACE' ops/admin-readonly-inspect-worker.js
      - name: Deploy read-only inspector
        run: npx wrangler deploy --config wrangler.admin-readonly-inspect.toml --message "Current read-only admin inspection"
      - name: Read masked admin state
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error -o /tmp/status.json -w '%{http_code}' "$INSPECT_URL/status?ts=$(date +%s%N)" || true)"
            if [ "$code" = "200" ] && grep -Fq '"activeAdminCount"' /tmp/status.json; then ready=1; break; fi
            sleep 2
          done
          cat /tmp/status.json || true
          test "$ready" -eq 1
