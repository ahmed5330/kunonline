name: J&T Preview Auth Probe
on:
  push:
    branches: [develop/ux-system-upgrade]
    paths:
      - '.github/workflows/jt-preview-auth-probe.yml'
      - 'scripts/live-preview-jt-auth-probe.mjs'
permissions:
  contents: read
jobs:
  probe:
    if: github.event.head_commit.message == 'Run one-time J&T credential probe'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Probe actual J&T credentials against Get Orders
        run: node scripts/live-preview-jt-auth-probe.mjs https://kunonline-preview.mr-a-mnaa.workers.dev
