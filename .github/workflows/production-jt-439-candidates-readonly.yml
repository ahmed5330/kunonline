name: Production J&T 439 candidates read-only
on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: [.github/run-production-jt-439-candidates-readonly-20260910.txt]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Write non-PII candidate references only
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=fs.readFileSync('wrangler.production.toml','utf8');
          const db=c.match(/database_id\s*=\s*"([^"]+)"/)?.[1];
          if(!db)throw new Error('database id missing');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          async function q(sql,params=[]){const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});const p=await r.json();if(!r.ok||p.success===false)throw new Error('D1 query failed');return p.result?.[0]?.results||[]}
          (async()=>{
            const rows=await q("SELECT o.id,o.ref,o.created_at,o.date,o.product,o.source,o.history,(SELECT sc.status FROM store_connections sc WHERE sc.client_id=o.client_id AND sc.provider='jt' ORDER BY sc.updated_at DESC LIMIT 1) AS jt_status FROM orders o WHERE o.state='confirmed' AND (o.awb IS NULL OR trim(o.awb)='') AND abs(CAST(o.total AS REAL)-439.0)<0.001 AND EXISTS (SELECT 1 FROM store_connections sc WHERE sc.client_id=o.client_id AND sc.provider='jt') ORDER BY COALESCE(o.created_at,o.date) DESC LIMIT 10");
            function lastActivity(history,created){let latest=Date.parse(created||'')||0;try{for(const e of JSON.parse(history||'[]')){const t=Date.parse(e?.at||e?.createdAt||e?.created_at||'');if(Number.isFinite(t)&&t>latest)latest=t}}catch{}return latest?new Date(latest).toISOString():null}
            const safe=rows.map((r,i)=>({candidate:i+1,orderId:r.id,reference:r.ref||null,createdAt:r.created_at||r.date||null,lastActivityAt:lastActivity(r.history,r.created_at||r.date),product:r.product||null,source:r.source||null,jtStatus:r.jt_status||null}));
            fs.writeFileSync('/tmp/candidates.json',JSON.stringify({count:safe.length,candidates:safe},null,2));
            console.log(`Candidate diagnostic completed: count=${safe.length}; no customer PII printed.`);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: production-jt-439-candidates
          path: /tmp/candidates.json
          retention-days: 1
