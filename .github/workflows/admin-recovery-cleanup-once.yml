name: Admin recovery cleanup once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-recovery-cleanup-once.yml
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Delete temporary Workers through Cloudflare API
        run: |
          set -euo pipefail
          for name in kunonline-admin-recovery-20260915 kunonline-admin-readonly-inspect-20260915; do
            code="$(curl --silent --show-error -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              -o /tmp/delete.json -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name")"
            cat /tmp/delete.json
            if [ "$code" != "200" ]; then echo "Delete $name failed HTTP $code"; exit 1; fi
            grep -Fq '"success":true' /tmp/delete.json
          done
      - name: Verify temporary endpoints are gone
        run: |
          set -euo pipefail
          for url in \
            https://kunonline-admin-recovery-20260915.mr-a-mnaa.workers.dev/health \
            https://kunonline-admin-readonly-inspect-20260915.mr-a-mnaa.workers.dev/status; do
            gone=0
            for attempt in $(seq 1 20); do
              code="$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$url?ts=$(date +%s%N)" || true)"
              echo "$url -> $code"
              if [ "$code" != "200" ]; then gone=1; break; fi
              sleep 2
            done
            test "$gone" -eq 1
          done
