name: Admin recovery cleanup once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-recovery-cleanup-once.yml
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 21e440deb6351c6850fa51314ce2d62d3d219e86
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Disable temporary Workers
        run: |
          set -euo pipefail
          cat > /tmp/recovery.toml <<'EOF'
          name = "kunonline-admin-recovery-20260915"
          compatibility_date = "2026-08-23"
          EOF
          cat > /tmp/inspect.toml <<'EOF'
          name = "kunonline-admin-readonly-inspect-20260915"
          compatibility_date = "2026-08-23"
          EOF
          set +e
          npx wrangler delete --config /tmp/recovery.toml --force
          recovery_rc=$?
          npx wrangler delete --config /tmp/inspect.toml --force
          inspect_rc=$?
          set -e
          echo "delete_rc recovery=$recovery_rc inspect=$inspect_rc"
      - name: Verify temporary endpoints are unavailable
        run: |
          set -euo pipefail
          for url in \
            https://kunonline-admin-recovery-20260915.mr-a-mnaa.workers.dev/health \
            https://kunonline-admin-readonly-inspect-20260915.mr-a-mnaa.workers.dev/status; do
            unavailable=0
            for attempt in $(seq 1 20); do
              code="$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$url?ts=$(date +%s%N)" || true)"
              echo "$url -> $code"
              if [ "$code" != "200" ]; then unavailable=1; break; fi
              sleep 2
            done
            test "$unavailable" -eq 1
          done
