name: Production collaboration migration 0091 — approved once
on:
  push:
    branches: [ops/prod-collab-migration-0091]
    paths: [.github/workflows/prod-collab-migration-0091-once.yml]
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Safety-check exact migration file
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='migrations/0091_internal_collaboration.sql';
          const raw=fs.readFileSync(path,'utf8');
          const sql=raw.replace(/--.*$/gm,'').trim();
          const forbidden=/\b(DROP|DELETE|UPDATE|INSERT|ALTER|TRUNCATE|REPLACE|VACUUM|ATTACH|DETACH)\b/i;
          if(forbidden.test(sql)) throw new Error(`Forbidden mutating statement in ${path}: ${sql.match(forbidden)?.[0]}`);
          const statements=sql.split(';').map(x=>x.trim()).filter(Boolean);
          if(!statements.length) throw new Error('Migration is empty');
          for(const stmt of statements){
            if(!/^CREATE\s+(TABLE|(?:UNIQUE\s+)?INDEX)\s+IF\s+NOT\s+EXISTS\b/i.test(stmt)){
              throw new Error(`Unexpected statement type: ${stmt.slice(0,100)}`);
            }
          }
          console.log(`Safety check passed: ${statements.length} additive CREATE statements only.`);
          NODE
      - name: Preflight production D1 collaboration schema
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          const db=fs.readFileSync('wrangler.production.toml','utf8').match(/database_id\s*=\s*"([^"]+)"/)?.[1];
          if(!account||!token||!db) throw new Error('Cloudflare/D1 production config missing');
          async function q(sql){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({sql})});
            const p=await r.json().catch(()=>({}));
            if(!r.ok||p.success===false||p.result?.[0]?.success===false) throw new Error(`D1 preflight failed: ${r.status}`);
            return p.result?.[0]?.results||[];
          }
          (async()=>{
            const existing=await q("SELECT type,name FROM sqlite_master WHERE name LIKE 'collab_%' ORDER BY type,name");
            console.log(JSON.stringify({existingCollaborationObjects:existing},null,2));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Apply ONLY migration 0091 to Production D1
        run: |
          set -euo pipefail
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --file=migrations/0091_internal_collaboration.sql
      - name: Verify production collaboration tables and indexes
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          const db=fs.readFileSync('wrangler.production.toml','utf8').match(/database_id\s*=\s*"([^"]+)"/)?.[1];
          if(!account||!token||!db) throw new Error('Cloudflare/D1 production config missing');
          async function q(sql){
            for(let i=1;i<=5;i++){
              const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({sql})});
              const p=await r.json().catch(()=>({}));
              if(r.ok&&p.success!==false&&p.result?.[0]?.success!==false) return p.result?.[0]?.results||[];
              if(i===5) throw new Error(`D1 verification failed after retries: ${r.status}`);
              await new Promise(res=>setTimeout(res,i*1200));
            }
          }
          const tables=['collab_conversations','collab_members','collab_messages','collab_message_mentions','collab_reads','collab_tasks','collab_order_assignments'];
          const indexes=['idx_collab_conversations_store','idx_collab_direct_unique','idx_collab_members_user','idx_collab_messages_conversation','idx_collab_messages_order','idx_collab_mentions_user','idx_collab_tasks_store','idx_collab_tasks_assignee','idx_collab_tasks_order','idx_collab_order_assignments_order','idx_collab_order_assignments_user'];
          (async()=>{
            const objects=await q("SELECT type,name FROM sqlite_master WHERE name LIKE 'collab_%' OR name LIKE 'idx_collab_%' ORDER BY type,name");
            const names=new Set(objects.map(x=>x.name));
            const missing=[...tables,...indexes].filter(x=>!names.has(x));
            if(missing.length) throw new Error(`Missing collaboration schema objects: ${missing.join(', ')}`);
            const counts={};
            for(const table of tables){
              const rows=await q(`SELECT COUNT(*) AS n FROM ${table}`);
              counts[table]=Number(rows[0]?.n||0);
            }
            console.log(JSON.stringify({verified:true,tables:tables.length,indexes:indexes.length,rowCounts:counts},null,2));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
