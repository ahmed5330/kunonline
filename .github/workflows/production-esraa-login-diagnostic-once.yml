name: Production Esraa login diagnostic once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-esraa-login-diagnostic-once.yml
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Inspect Esraa account state read-only
        run: |
          set -euo pipefail
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT u.id, substr(u.email,1,3)||'***@'||substr(u.email,instr(u.email,'@')+1) AS email_mask, u.role, u.status, u.client_id, CASE WHEN u.password LIKE 'pbkdf2$%' THEN 'pbkdf2' ELSE 'other' END AS password_format, COALESCE(l.fails,0) AS failed_attempts, COALESCE(l.locked_until,'') AS locked_until, COALESCE(u.last_login,'') AS last_login FROM users u LEFT JOIN login_attempts l ON lower(l.email)=lower(u.email) WHERE lower(u.email)=lower('esraanabilismail@gmail.com');"
      - name: Inspect latest reset audit read-only
        run: |
          set -euo pipefail
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT action, created_at FROM audit_log WHERE entity_id IN (SELECT id FROM users WHERE lower(email)=lower('esraanabilismail@gmail.com')) ORDER BY created_at DESC LIMIT 10;"
