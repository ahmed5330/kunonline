name: Production schema compatibility audit

on:
  workflow_run:
    workflows:
      - Production deploy (no database migrations)
    types:
      - completed
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts

      - name: core-orders-stores
        continue-on-error: true
        run: |
          set -euo pipefail
          out="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command \"SELECT name FROM sqlite_master WHERE type='table' AND name IN ('orders','stores','users','state');\" --json)"
          node -e "const d=JSON.parse(process.argv[1]);const s=new Set((d[0]?.results||[]).map(x=>x.name));process.exit(['orders','stores','users','state'].every(x=>s.has(x))?0:1)" "$out"

      - name: store-scope-schema
        continue-on-error: true
        run: |
          set -euo pipefail
          out="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command \"SELECT 'table:'||name item FROM sqlite_master WHERE type='table' AND name='user_store_access' UNION ALL SELECT 'stores:'||name FROM pragma_table_info('stores');\" --json)"
          node -e "const d=JSON.parse(process.argv[1]);const s=new Set((d[0]?.results||[]).map(x=>x.item));const e=['table:user_store_access','stores:id','stores:client_id','stores:name','stores:code','stores:is_default','stores:status','stores:currency'];process.exit(e.every(x=>s.has(x))?0:1)" "$out"

      - name: dashboard-support-schema
        continue-on-error: true
        run: |
          set -euo pipefail
          out="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command \"SELECT name FROM sqlite_master WHERE type='table' AND name IN ('order_duplicate_links','transactions','order_billing','products','campaign_daily_metrics','ai_insight_snapshots');\" --json)"
          node -e "const d=JSON.parse(process.argv[1]);const s=new Set((d[0]?.results||[]).map(x=>x.name));const e=['order_duplicate_links','transactions','order_billing','products','campaign_daily_metrics','ai_insight_snapshots'];process.exit(e.every(x=>s.has(x))?0:1)" "$out"

      - name: dashboard-order-columns
        continue-on-error: true
        run: |
          set -euo pipefail
          out="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command \"SELECT name FROM pragma_table_info('orders');\" --json)"
          node -e "const d=JSON.parse(process.argv[1]);const s=new Set((d[0]?.results||[]).map(x=>x.name));const e=['id','client_id','store_id','date','created_at','state','total','product_cost','shipping_cost','other_cost','gov','source','customer_id','product_id','qty'];process.exit(e.every(x=>s.has(x))?0:1)" "$out"

      - name: post-shipping-columns
        continue-on-error: true
        run: |
          set -euo pipefail
          out="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command \"SELECT name FROM pragma_table_info('orders');\" --json)"
          node -e "const d=JSON.parse(process.argv[1]);const s=new Set((d[0]?.results||[]).map(x=>x.name));const e=['store_id','awb','checkpoint','signed_at','collected_at','collected_amount','history','restocked'];process.exit(e.every(x=>s.has(x))?0:1)" "$out"

      - name: shipping-inventory-schema
        continue-on-error: true
        run: |
          set -euo pipefail
          out="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command \"SELECT name FROM sqlite_master WHERE type='table' AND name IN ('order_items','order_item_stock_allocations','order_stock_allocations');\" --json)"
          node -e "const d=JSON.parse(process.argv[1]);const s=new Set((d[0]?.results||[]).map(x=>x.name));const e=['order_items','order_item_stock_allocations','order_stock_allocations'];process.exit(e.every(x=>s.has(x))?0:1)" "$out"

      - name: meta-campaign-schema
        continue-on-error: true
        run: |
          set -euo pipefail
          out="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command \"SELECT name FROM sqlite_master WHERE type='table' AND name IN ('campaign_daily_metrics','meta_ad_entities','meta_ad_daily_metrics','store_connections');\" --json)"
          node -e "const d=JSON.parse(process.argv[1]);const s=new Set((d[0]?.results||[]).map(x=>x.name));const e=['campaign_daily_metrics','meta_ad_entities','meta_ad_daily_metrics','store_connections'];process.exit(e.every(x=>s.has(x))?0:1)" "$out"

      - name: collaboration-schema
        continue-on-error: true
        run: |
          set -euo pipefail
          out="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command \"SELECT name FROM sqlite_master WHERE type='table' AND name IN ('collab_conversations','collab_members','collab_messages','collab_message_mentions','collab_reads','collab_tasks','collab_order_assignments');\" --json)"
          node -e "const d=JSON.parse(process.argv[1]);const s=new Set((d[0]?.results||[]).map(x=>x.name));const e=['collab_conversations','collab_members','collab_messages','collab_message_mentions','collab_reads','collab_tasks','collab_order_assignments'];process.exit(e.every(x=>s.has(x))?0:1)" "$out"
