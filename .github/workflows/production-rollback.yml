name: Production rollback (manual approval)
on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Cloudflare Worker version ID to restore
        required: true
        type: string
      reason:
        description: Reason for rollback
        required: true
        type: string
concurrency:
  group: kunonline-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.kun-online.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Verify production isolation
        run: npm run check:production-config
      - name: Roll back Worker code only
        run: |
          npx wrangler rollback "${{ inputs.version_id }}" --config wrangler.production.toml --message "GitHub approved rollback: ${{ inputs.reason }}"
