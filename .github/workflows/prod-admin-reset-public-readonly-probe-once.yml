name: Live Production admin reset public read-only probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-admin-reset-public-readonly-probe-once.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live index loads v90 reset transport
        run: |
          set -euo pipefail
          ts="$(date +%s%N)"
          curl --silent --show-error --fail "https://app.kun-online.com/v2/?probe=$ts" -o /tmp/index.html
          grep -F 'modules-v90-admin-reset-direct.js?v=90.0' /tmp/index.html
      - name: Verify live v90 module content
        run: |
          set -euo pipefail
          ts="$(date +%s%N)"
          curl --silent --show-error --fail "https://app.kun-online.com/v2/modules-v90-admin-reset-direct.js?v=90.0&probe=$ts" -o /tmp/v90.js
          grep -F 'XMLHttpRequest' /tmp/v90.js
          grep -F 'reset-owner-password' /tmp/v90.js
          grep -F 'stopImmediatePropagation' /tmp/v90.js
      - name: Verify backend route exists without authenticating or mutating
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/route.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data '{"password":"diagnostic-only-not-applied"}' \
            "https://app.kun-online.com/api/admin/clients/nonexistent-diagnostic-client/reset-owner-password?probe=$(date +%s%N)")"
          echo "HTTP $code"
          cat /tmp/route.json
          test "$code" = "401" -o "$code" = "403"
