name: One-time Actions storage cleanup

on:
  push:
    branches:
      - maintenance/actions-storage-cleanup-20261007
    paths:
      - '.github/workflows/actions-storage-cleanup.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete Actions artifacts older than 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '24 hours ago' +%s)"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > /tmp/artifacts.json

          deleted=0
          kept=0
          freed=0

          while IFS=$'\t' read -r id created size name; do
            created_ts="$(date -u -d "$created" +%s)"
            if [ "$created_ts" -lt "$cutoff" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
              deleted=$((deleted + 1))
              freed=$((freed + size))
              echo "Deleted: $name ($id) $size bytes"
            else
              kept=$((kept + 1))
            fi
          done < <(jq -r '[.[] | .artifacts[]] | .[] | [.id, .created_at, .size_in_bytes, .name] | @tsv' /tmp/artifacts.json)

          echo "Deleted artifacts: $deleted"
          echo "Kept artifacts (last 24h): $kept"
          echo "Freed bytes: $freed"
          awk -v b="$freed" 'BEGIN { printf "Freed approx: %.2f MiB\n", b/1024/1024 }'
