name: FAOS Preview D1 Read-Only Preflight
on:
  push:
    branches: [feature/accounting-faos-ledger-qa-20261018]
    paths:
      - '.github/workflows/faos-preview-readonly.yml'
      - 'migrations/0098_financial_ledger_v1.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Verify fixed Preview target and credentials presence
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "feature/accounting-faos-ledger-qa-20261018"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('wrangler.preview.toml','utf8'); if(!s.includes('name = \"kunonline-preview\"')||!s.includes('database_name = \"kunonline-preview\"')||!s.includes('APP_ENV = \"preview\"'))process.exit(1);"
      - name: Inspect Preview D1 schema only (NO WRITE)
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute kunonline-preview --remote --config wrangler.preview.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('faos_journals','faos_journal_lines','faos_periods','orders','transactions','order_management_fees','order_duplicate_links') ORDER BY name;" --json > /tmp/faos-preview-schema.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('/tmp/faos-preview-schema.json','utf8'));
          const rows=[];
          const walk=x=>{
            if(Array.isArray(x)){for(const z of x)walk(z);return;}
            if(!x||typeof x!=='object')return;
            if(Array.isArray(x.results)){for(const y of x.results)if(y&&typeof y==='object'&&typeof y.name==='string')rows.push(y.name);}
            for(const [k,v] of Object.entries(x)){if(k!=='results')walk(v);}
          };walk(raw);
          const present=new Set(rows);
          for(const t of ['faos_journals','faos_journal_lines','faos_periods','orders','transactions','order_management_fees','order_duplicate_links']){
            console.log(t+': '+(present.has(t)?'PRESENT':'NOT_PRESENT'));
          }
          console.log('This audit queried Preview D1 schema ONLY; NO merchant rows, writes, or production resources.');
          if(!present.has('orders'))process.exitCode=2;
          NODE
          rm -f /tmp/faos-preview-schema.json
