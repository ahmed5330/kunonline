name: Resume approved Production Commerce v38 release
on:
  push:
    branches:
      - develop/ux-system-upgrade
    paths:
      - .github/release-production-v38-resume-approved-20260910.txt
concurrency:
  group: kunonline-production-20260910
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_REF: release/commerce-v38-production-20260910
    steps:
      - name: Checkout approved release candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts

      - name: Revalidate unchanged release candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "964286d3eddb8c7302b038f002024e883acaf946"
          grep -q "import app from './index-commerce-v38.js';" src/index-production-sync.js
          node --check src/index-production-sync.js
          npm run check:production-config
          npx wrangler deploy --dry-run --config wrangler.production.toml >/tmp/prod-dry-run.log 2>&1
          rm -f /tmp/prod-dry-run.log
          echo 'Approved release candidate unchanged and valid.'

      - name: Capture exact current Production Worker version
        id: before_worker
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.production.toml --json)"
          version="$(printf '%s' "$status" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{
              const root=JSON.parse(raw),hits=[];
              const walk=x=>{if(Array.isArray(x)){for(const v of x)walk(v);return;}if(!x||typeof x!=="object")return;
                const id=x.version_id||x.versionId,pct=x.percentage??x.traffic_percentage??x.trafficPercentage;
                if(id)hits.push({id:String(id),pct:pct==null?null:Number(pct)});for(const v of Object.values(x))walk(v);};walk(root);
              const unique=[...new Map(hits.map(x=>[x.id,x])).values()],full=unique.find(x=>x.pct===100||x.pct===1)||(unique.length===1?unique[0]:null);
              if(!full)process.exit(2);process.stdout.write(full.id);
            });')"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
          echo "Captured current Production Worker version: $version"

      - name: Verify resume point and capture current Production baseline
        run: |
          set -euo pipefail
          rm -f /tmp/prod-before.sql /tmp/prod-before.db /tmp/export-before.log
          if ! npx wrangler d1 export kunonline --remote --config wrangler.production.toml --output=/tmp/prod-before.sql >/tmp/export-before.log 2>&1; then
            echo 'Production resume snapshot failed; output suppressed.'
            exit 1
          fi
          sqlite3 /tmp/prod-before.db < /tmp/prod-before.sql
          rm -f /tmp/prod-before.sql /tmp/export-before.log
          test "12" = "$(sqlite3 /tmp/prod-before.db 'SELECT COUNT(*) FROM d1_migrations;')"
          test "0011_multistore_ai.sql" = "$(sqlite3 /tmp/prod-before.db 'SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1;')"
          test "1" = "$(sqlite3 /tmp/prod-before.db "SELECT COUNT(*) FROM pragma_table_info('chat_messages') WHERE name='client_id';")"
          before_orders="$(sqlite3 /tmp/prod-before.db 'SELECT COUNT(*) FROM orders;')"
          before_users="$(sqlite3 /tmp/prod-before.db 'SELECT COUNT(*) FROM users;')"
          before_customers="$(sqlite3 /tmp/prod-before.db 'SELECT COUNT(*) FROM customers;')"
          before_products="$(sqlite3 /tmp/prod-before.db 'SELECT COUNT(*) FROM products;')"
          test "$before_orders" -ge 270
          test "$before_users" -ge 8
          test "$before_customers" -ge 97
          test "$before_products" -ge 11
          echo "BEFORE_ORDERS=$before_orders" >> "$GITHUB_ENV"
          echo "BEFORE_USERS=$before_users" >> "$GITHUB_ENV"
          echo "BEFORE_CUSTOMERS=$before_customers" >> "$GITHUB_ENV"
          echo "BEFORE_PRODUCTS=$before_products" >> "$GITHUB_ENV"
          clients="$(sqlite3 /tmp/prod-before.db "SELECT COUNT(*) FROM (SELECT client_id FROM users WHERE client_id IS NOT NULL AND trim(client_id)<>'' UNION SELECT client_id FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' UNION SELECT client_id FROM customers WHERE client_id IS NOT NULL AND trim(client_id)<>'' UNION SELECT client_id FROM products WHERE client_id IS NOT NULL AND trim(client_id)<>'');")"
          test "$clients" -ge 5
          echo "BEFORE_CLIENTS=$clients" >> "$GITHUB_ENV"
          echo "Resume point valid: ledger=12 through 0011; orders=$before_orders users=$before_users customers=$before_customers products=$before_products clients=$clients"

      - name: Seed deterministic default stores without TEMP tables
        run: |
          set -euo pipefail
          store_sql="WITH legacy_clients(client_id) AS (SELECT client_id FROM users WHERE client_id IS NOT NULL AND trim(client_id)<>'' UNION SELECT client_id FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' UNION SELECT client_id FROM customers WHERE client_id IS NOT NULL AND trim(client_id)<>'' UNION SELECT client_id FROM products WHERE client_id IS NOT NULL AND trim(client_id)<>'') INSERT OR IGNORE INTO stores (id,client_id,name,code,currency,timezone,status,is_default,created_at,updated_at) SELECT 'STR-LEGACY-'||client_id,client_id,'Main Store','MAIN','EGP','Africa/Cairo','active',1,datetime('now'),datetime('now') FROM legacy_clients;"
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "$store_sql" >/tmp/store-seed.log 2>&1
          access_sql="INSERT OR IGNORE INTO user_store_access (id,client_id,user_id,store_id,role,created_at) SELECT 'USA-LEGACY-'||u.id,u.client_id,u.id,s.id,CASE WHEN u.role='client' THEN 'owner' ELSE 'member' END,datetime('now') FROM users u JOIN stores s ON s.client_id=u.client_id AND s.is_default=1 AND s.status='active' WHERE u.client_id IS NOT NULL AND trim(u.client_id)<>'';"
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "$access_sql" >>/tmp/store-seed.log 2>&1
          rm -f /tmp/store-seed.log
          echo 'Legacy default stores and user access seed commands completed.'

      - name: Validate seed from a fresh read-only snapshot
        run: |
          set -euo pipefail
          rm -f /tmp/prod-seed.sql /tmp/prod-seed.db /tmp/export-seed.log
          if ! npx wrangler d1 export kunonline --remote --config wrangler.production.toml --output=/tmp/prod-seed.sql >/tmp/export-seed.log 2>&1; then
            echo 'Seed validation snapshot failed; output suppressed.'
            exit 1
          fi
          sqlite3 /tmp/prod-seed.db < /tmp/prod-seed.sql
          rm -f /tmp/prod-seed.sql /tmp/export-seed.log
          default_clients="$(sqlite3 /tmp/prod-seed.db "SELECT COUNT(*) FROM (SELECT client_id FROM stores WHERE status='active' AND is_default=1 GROUP BY client_id);")"
          unmapped_users="$(sqlite3 /tmp/prod-seed.db "SELECT COUNT(*) FROM users u WHERE u.client_id IS NOT NULL AND trim(u.client_id)<>'' AND u.role<>'admin' AND NOT EXISTS (SELECT 1 FROM user_store_access a WHERE a.user_id=u.id AND a.client_id=u.client_id);")"
          test "$default_clients" -ge "$BEFORE_CLIENTS"
          test "$unmapped_users" = "0"
          echo "Seed validation passed: default clients=$default_clients; unmapped users=0"

      - name: Apply migrations 0012 through 0022 with Wrangler ledger
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply kunonline --remote --config wrangler.production.toml
          echo 'Remaining Production migrations completed.'

      - name: Build and run pre-deploy store backfill
        run: |
          set -euo pipefail
          : > /tmp/store-backfill.sql
          for table in orders customers coupons products product_variants transactions whatsapp_outbox stock_log suppliers wallet_log chat_messages purchase_orders goods_receipts workflows workflow_runs audit_log marketing_touchpoints cod_reconciliations cod_reconciliation_items approval_requests ai_action_requests execution_jobs notifications conversations channel_messages marketing_campaigns campaign_daily_metrics pos_sessions pos_sales supplier_invoices supplier_payments purchase_returns; do
            printf "UPDATE %s SET store_id=(SELECT id FROM stores s WHERE s.client_id=%s.client_id AND s.status='active' ORDER BY s.is_default DESC,s.created_at LIMIT 1) WHERE store_id IS NULL;\n" "$table" "$table" >> /tmp/store-backfill.sql
          done
          echo "UPDATE pos_sale_items SET store_id=(SELECT s.store_id FROM pos_sales s WHERE s.id=pos_sale_items.sale_id) WHERE store_id IS NULL;" >> /tmp/store-backfill.sql
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --file=/tmp/store-backfill.sql >/tmp/store-backfill.log 2>&1
          rm -f /tmp/store-backfill.log
          echo 'Pre-deploy store backfill completed.'

      - name: Validate fully migrated Production data before Worker deploy
        run: |
          set -euo pipefail
          rm -f /tmp/prod-after.sql /tmp/prod-after.db /tmp/export-after.log
          if ! npx wrangler d1 export kunonline --remote --config wrangler.production.toml --output=/tmp/prod-after.sql >/tmp/export-after.log 2>&1; then
            echo 'Production post-migration export failed; output suppressed.'
            exit 1
          fi
          sqlite3 /tmp/prod-after.db < /tmp/prod-after.sql
          rm -f /tmp/prod-after.sql /tmp/export-after.log
          after_orders="$(sqlite3 /tmp/prod-after.db 'SELECT COUNT(*) FROM orders;')"
          after_users="$(sqlite3 /tmp/prod-after.db 'SELECT COUNT(*) FROM users;')"
          after_customers="$(sqlite3 /tmp/prod-after.db 'SELECT COUNT(*) FROM customers;')"
          after_products="$(sqlite3 /tmp/prod-after.db 'SELECT COUNT(*) FROM products;')"
          test "$after_orders" -ge "$BEFORE_ORDERS"
          test "$after_users" -ge "$BEFORE_USERS"
          test "$after_customers" -ge "$BEFORE_CUSTOMERS"
          test "$after_products" -ge "$BEFORE_PRODUCTS"
          test "$BEFORE_CLIENTS" -le "$(sqlite3 /tmp/prod-after.db "SELECT COUNT(*) FROM (SELECT client_id FROM stores WHERE status='active' AND is_default=1 GROUP BY client_id);")"
          test "0" = "$(sqlite3 /tmp/prod-after.db "SELECT COUNT(*) FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL;")"
          test "0" = "$(sqlite3 /tmp/prod-after.db "SELECT COUNT(*) FROM customers WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL;")"
          test "0" = "$(sqlite3 /tmp/prod-after.db "SELECT COUNT(*) FROM products WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL;")"
          test "0" = "$(sqlite3 /tmp/prod-after.db "SELECT COUNT(*) FROM users u WHERE u.client_id IS NOT NULL AND trim(u.client_id)<>'' AND u.role<>'admin' AND NOT EXISTS (SELECT 1 FROM user_store_access a WHERE a.user_id=u.id AND a.client_id=u.client_id);")"
          test "23" = "$(sqlite3 /tmp/prod-after.db 'SELECT COUNT(*) FROM d1_migrations;')"
          test "0022_order_duplicate_links.sql" = "$(sqlite3 /tmp/prod-after.db 'SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1;')"
          for table in stores user_store_access store_connections integration_secrets order_events inventory_batches order_duplicate_links wallet_accounts; do
            test "1" = "$(sqlite3 /tmp/prod-after.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='$table';")"
          done
          echo "Production DB validation passed through 0022: orders=$after_orders users=$after_users customers=$after_customers products=$after_products"

      - name: Ensure Production integration encryption key exists
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.production.toml >/tmp/prod-secret-list.json
          if node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/prod-secret-list.json","utf8"));const a=Array.isArray(p)?p:(p.result||[]);process.exit(a.some(x=>(x.name||x.key)==="INTEGRATION_ENCRYPTION_KEY")?0:1)'; then
            echo 'Production integration encryption key already exists.'
          else
            key="$(openssl rand -base64 32 | tr -d '\n')"
            printf '%s' "$key" | npx wrangler secret put INTEGRATION_ENCRYPTION_KEY --config wrangler.production.toml >/tmp/secret-put.log 2>&1
            unset key
            rm -f /tmp/secret-put.log
            echo 'Created Production integration encryption key securely.'
          fi
          rm -f /tmp/prod-secret-list.json

      - name: Deploy Production Commerce v38 Worker
        id: deploy
        run: |
          set -euo pipefail
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "deploy_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --config wrangler.production.toml

      - name: Catch any last legacy writes after v38 takes traffic
        run: |
          set -euo pipefail
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --file=/tmp/store-backfill.sql >/tmp/post-deploy-backfill.log 2>&1
          rm -f /tmp/post-deploy-backfill.log
          echo 'Post-deploy legacy-write backfill completed.'

      - name: Verify Production health, J&T v38 route, Easy Orders and Cron
        run: |
          set -euo pipefail
          curl -fsS https://app.kun-online.com/health >/dev/null
          code="$(curl -sS -o /tmp/jt-smoke.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' https://app.kun-online.com/api/jt/shipments/KUN-SMOKE-NO-ORDER --data '{}')"
          test "$code" = "401"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/jt-smoke.json","utf8"));if(p.code!=="AUTH_REQUIRED")throw new Error(`Unexpected J&T smoke payload: ${JSON.stringify(p)}`);console.log("Production J&T v38 route smoke passed without creating a shipment.");'
          rm -f /tmp/jt-smoke.json
          curl -fsS https://app.kun-online.com/health/easyorders-sync >/tmp/easy-health.json
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/easy-health.json","utf8"));if(p.ok!==true||p.service!=="easyorders-production-sync")throw new Error("Easy Orders production wrapper health failed");console.log(`Easy Orders wrapper live: status=${p.status} build=${p.build}`);'
          rm -f /tmp/easy-health.json
          schedules="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kunonline/schedules")"
          printf '%s' "$schedules" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const p=JSON.parse(raw);if(p.success===false)throw new Error(JSON.stringify(p.errors));const got=(p.result||[]).map(x=>x.cron).sort();const want=["*/5 * * * *","0 */2 * * *"].sort();if(JSON.stringify(got)!==JSON.stringify(want))throw new Error(`Cron mismatch: ${JSON.stringify(got)}`);console.log(`Production Cron integrity passed: ${got.join(" | ")}`);});'

      - name: Confirm a real scheduled Easy Orders recovery run
        run: |
          set -euo pipefail
          deploy_epoch="${{ steps.deploy.outputs.deploy_epoch }}"
          for i in $(seq 1 42); do
            payload="$(curl -fsS https://app.kun-online.com/health/easyorders-sync || true)"
            if [ -n "$payload" ]; then
              ok="$(printf '%s' "$payload" | node -e '
                let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{try{const p=JSON.parse(raw),t=Date.parse(p.lastRunAt||"");const deploy=Number(process.argv[1])*1000;if(Number.isFinite(t)&&t>=deploy&&!["error","not_run"].includes(p.status)){console.log("yes");console.error(`Recovery live: status=${p.status} clients=${p.connectedClients} requests=${p.requests} recovered=${p.recovered} updated=${p.updated} lastRunAt=${p.lastRunAt}`)}}catch{}});' "$deploy_epoch")"
              if [ "$ok" = "yes" ]; then exit 0; fi
            fi
            sleep 10
          done
          echo 'No healthy Easy Orders scheduled run was observed after Production v38 deployment.'
          exit 1

      - name: Roll back exact Production Worker version on post-deploy validation failure
        if: failure() && steps.deploy.outputs.deployed == 'true'
        run: |
          set -euo pipefail
          npx wrangler rollback "${{ steps.before_worker.outputs.version_id }}" --config wrangler.production.toml --message "Automatic rollback: Production Commerce v38 resume validation failed"
          curl -fsS https://app.kun-online.com/health >/dev/null
          echo 'Production Worker rolled back to exact pre-resume version; additive DB migrations remain.'

      - name: Remove ephemeral snapshots and logs
        if: always()
        run: rm -f /tmp/prod-before.sql /tmp/prod-before.db /tmp/prod-seed.sql /tmp/prod-seed.db /tmp/prod-after.sql /tmp/prod-after.db /tmp/export-before.log /tmp/export-seed.log /tmp/export-after.log /tmp/prod-dry-run.log /tmp/store-seed.log /tmp/store-backfill.sql /tmp/store-backfill.log /tmp/post-deploy-backfill.log /tmp/secret-put.log /tmp/prod-secret-list.json /tmp/jt-smoke.json /tmp/easy-health.json
