name: Validate Esraa reset guard once
on:
  push:
    branches: [hotfix/esraa-reset-verified-20260915]
    paths:
      - .github/workflows/validate-esraa-reset-guard-once.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/esraa-reset-verified-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Full regression
        run: npm test
      - name: Production isolation
        run: npm run check:production-config
      - name: Verify exact guard scope and behavior
        run: |
          set -euo pipefail
          base=18b44bc3c4a3db6769babd7342f2bebc88c51117
          git fetch origin "$base" --depth=1
          files="$(git diff --name-only "$base" HEAD | grep -v '^.github/workflows/validate-esraa-reset-guard-once.yml$' || true)"
          expected=$'public/v2/index.html\npublic/v2/modules-v90-admin-reset-verified.js'
          test "$files" = "$expected"
          node --check public/v2/modules-v90-admin-reset-verified.js
          grep -Fq 'new URL(`/api/admin/clients/${encodeURIComponent(clientId)}/reset-owner-password`,location.origin).href' public/v2/modules-v90-admin-reset-verified.js
          grep -Fq "data?.ok!==true||!data?.email" public/v2/modules-v90-admin-reset-verified.js
          grep -Fq "event.stopImmediatePropagation()" public/v2/modules-v90-admin-reset-verified.js
          grep -Fq 'modules-v90-admin-reset-verified.js?v=90.0' public/v2/index.html
          test "$(git diff --name-only "$base" HEAD | grep -Ec '^(src/|migrations/|wrangler)' || true)" = 0
