name: Safe storage cleanup (maintenance only)
on:
  push:
    branches: [maintenance/storage-cleanup-20261013]
    paths: ['.github/workflows/storage-cleanup-20261013.yml']
permissions:
  contents: read
  actions: write
jobs:
  prune-redundant-caches:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Keep latest Gradle cache per family and latest caller-id debug build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, re, urllib.request, urllib.error, datetime, collections
          repo = os.environ["GITHUB_REPOSITORY"]
          assert repo == "ahmed5330/kunonline", "Unexpected repository"
          assert os.environ["GITHUB_REF"] == "refs/heads/maintenance/storage-cleanup-20261013", "Unexpected branch"
          token = os.environ["GH_TOKEN"]
          base = "https://api.github.com/repos/" + repo + "/"
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "safe-actions-housekeeping"}
          def api(method, endpoint):
              request = urllib.request.Request(base + endpoint, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          def all_pages(endpoint, name):
              first = api("GET", endpoint + "?per_page=100&page=1")
              rows = list(first[name])
              count = first["total_count"]
              if count > 1000: raise RuntimeError("Unexpectedly large inventory; stopping")
              for page in range(2, (count + 99) // 100 + 1):
                  rows += api("GET", endpoint + "?per_page=100&page=" + str(page))[name]
              if len(rows) != count: raise RuntimeError("Inventory changed while scanning")
              return rows
          caches = all_pages("actions/caches", "actions_caches")
          artifacts = all_pages("actions/artifacts", "artifacts")
          now = datetime.datetime.now(datetime.timezone.utc)
          def age_hours(raw):
              return (now - datetime.datetime.fromisoformat(raw.replace("Z", "+00:00"))).total_seconds() / 3600
          by_family = collections.defaultdict(list)
          for item in caches:
              family = re.sub(r"-v[0-9]+(?:\\||-).*$", "-v*", item["key"])
              by_family[(item["ref"],family)].append(item)
          cache_delete = []
          for (_, family), entries in by_family.items():
              entries.sort(key=lambda x: (x.get("last_accessed_at") or x["created_at"], x["created_at"]), reverse=True)
              cache_delete += [x for x in entries[1:] if age_hours(x.get("last_accessed_at") or x["created_at"]) > 24]
          artifact_groups = collections.defaultdict(list)
          for item in artifacts:
              artifact_groups[item["name"]].append(item)
          artifact_delete = []
          for name, entries in artifact_groups.items():
              if name != "kun-online-caller-id-debug-apk": continue
              entries.sort(key=lambda x: x["created_at"], reverse=True)
              artifact_delete += [x for x in entries[1:] if age_hours(x["created_at"]) > 48]
          assert len(cache_delete) <= 50 and len(artifact_delete) <= 20
          before_cache = sum(x["size_in_bytes"] for x in caches)
          before_art = sum(x["size_in_bytes"] for x in artifacts)
          estimate = sum(x["size_in_bytes"] for x in cache_delete + artifact_delete)
          print("BEFORE", json.dumps({"cache_count":len(caches),"cache_bytes":before_cache,"artifact_count":len(artifacts),"artifact_bytes":before_art}),flush=True)
          print("SAFETY", json.dumps({"families":len(by_family),"caches_to_remove":len(cache_delete),"duplicate_debug_artifacts_to_remove":len(artifact_delete),"estimated_reclaim_bytes":estimate}),flush=True)
          deleted_caches, deleted_artifacts, errors = [], [], []
          for item in cache_delete:
              try:
                  api("DELETE", "actions/caches/" + str(item["id"]))
                  deleted_caches.append(item)
              except Exception as ex:
                  errors.append({"kind":"cache","id":item["id"],"error":str(ex)})
          for item in artifact_delete:
              try:
                  api("DELETE", "actions/artifacts/" + str(item["id"]))
                  deleted_artifacts.append(item)
              except Exception as ex:
                  errors.append({"kind":"artifact","id":item["id"],"error":str(ex)})
          print("DELETED", json.dumps({"cache_count":len(deleted_caches),"cache_bytes":sum(x["size_in_bytes"] for x in deleted_caches),"artifact_count":len(deleted_artifacts),"artifact_bytes":sum(x["size_in_bytes"] for x in deleted_artifacts),"errors":errors}), flush=True)
          updated_caches = all_pages("actions/caches","actions_caches")
          updated_artifacts = all_pages("actions/artifacts","artifacts")
          print("AFTER",json.dumps({"cache_count":len(updated_caches),"cache_bytes":sum(x["size_in_bytes"] for x in updated_caches),"artifact_count":len(updated_artifacts),"artifact_bytes":sum(x["size_in_bytes"] for x in updated_artifacts)}),flush=True)
          if errors: raise RuntimeError("Some deletions failed; see report")
          PY
