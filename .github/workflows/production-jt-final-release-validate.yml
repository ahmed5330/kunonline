name: Production J&T final release validation
on:
  push:
    branches: [release/commerce-v38-production-20260910]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Run full regression suite
        run: npm test
      - name: Validate J&T create and carrier-authoritative printing
        run: node scripts/jt-live-shipping-test.mjs
      - name: Validate Production release entry and syntax
        run: |
          set -euo pipefail
          node --check src/index-commerce-v38.js
          node --check src/index-production-sync.js
          node --check src/jt-express-eg-api.js
          node --check public/v2/modules-v79-printing.js
          grep -F "import app from './index-commerce-v38.js';" src/index-production-sync.js
          grep -F 'name = "kunonline"' wrangler.production.toml
          grep -F 'main = "src/index-production-sync.js"' wrangler.production.toml
          grep -F 'database_name = "kunonline"' wrangler.production.toml
          grep -F 'database_id = "c426601d-182f-486e-a5c1-bb1bca0ecb0b"' wrangler.production.toml
          grep -F '/v2/modules-v79-printing.js?v=79.6' public/v2/index.html
          grep -F '/v2/modules-v81-jt-live-setup.js?v=81.2' public/v2/index.html
          grep -F '/v2/modules-v84-jt-create-setup.js?v=84.2' public/v2/index.html
          grep -F "orderType:'1',serviceType:'01'" src/jt-express-eg-api.js
          grep -F "PRINT_ORDER_PATH='/webopenplatformapi/api/order/printOrder'" src/index-commerce-v38.js
          grep -F "printSize:'2',printCode:1" src/index-commerce-v38.js
          grep -F 'JT_OFFICIAL_PRINT_REQUIRED' src/index-commerce-v38.js
          grep -F 'طباعة ونقل إلى تمت الطباعة' public/v2/modules-v79-printing.js
          if grep -F 'window.print' public/v2/modules-v79-printing.js; then
            echo 'Local browser print command detected; J&T printing must be carrier-authoritative.'
            exit 1
          fi
          if grep -F 'data-print79-confirm' public/v2/modules-v79-printing.js; then
            echo 'Manual Printed confirmation detected; official printOrder must own the transition.'
            exit 1
          fi
          if grep -F 'requireCreateBusinessCredentials' src/index-commerce-v38.js; then
            echo 'Create Order must not be blocked by print-only Business credential requirements.'
            exit 1
          fi
      - name: Enforce migration-free release validation
        run: |
          set -euo pipefail
          workflow='.github/workflows/production-jt-final-release-validate.yml'
          if grep -nE '^[[:space:]]+(npx[[:space:]]+)?wrangler[[:space:]]+d1[[:space:]]+(migrations[[:space:]]+apply|execute)|^[[:space:]]+npm[[:space:]]+run[[:space:]]+db:migrate:production' "$workflow"; then
            echo 'Production database command detected in J&T validation workflow.'
            exit 1
          fi
          echo 'Validation is Production-D1-mutation-free.'