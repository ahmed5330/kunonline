name: One-time auth D1 schema-only audit (NO MUTATIONS)

# The workflow is branch-scoped, never runs on main, and is not a deploy step.
# One-time manual-purpose push trigger. Remove only by a separate reviewed PR.
on:
  push:
    branches: [audit/readonly-auth-d1-20261024]
    paths:
      - '.github/workflows/one-time-auth-d1-readonly-20261024.yml'

permissions:
  contents: read

concurrency:
  group: kunonline-auth-d1-readonly-20261024
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify offline SQL allowlist and malformed-schema blockers before any remote query
        run: |
          node scripts/session-revocation-live-schema-inventory-test.mjs
          node scripts/session-revocation-bridge-activation-guard.mjs
      - name: Read ONLY Cloudflare D1 metadata, aggregate counts and migration filenames
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/session-revocation-live-schema-inventory.mjs --read-only
      - name: Keep live migration and deployment strictly disabled
        run: |
          echo 'Audit finished: no database/Worker state changed. Release remains BLOCKED.'
# This workflow contains NO install script, wrangler remote migration, D1 write,
# Worker deployment, publish, live login, or external provider calls.
