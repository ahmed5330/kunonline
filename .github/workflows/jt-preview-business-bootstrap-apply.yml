name: J&T Preview encrypted business bootstrap apply
on:
  push:
    branches: [ops/jt-preview-business-bootstrap-20260913]
    paths: [.github/run-jt-preview-business-bootstrap-apply.txt]
permissions:
  contents: read
jobs:
  seed-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_BASE: https://kunonline-preview.mr-a-mnaa.workers.dev
    steps:
      - uses: actions/checkout@v5
      - name: Decrypt in memory and store J&T Business Info through Kun Online encrypted secret API
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const {webcrypto,randomBytes,createHash}=crypto;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,base=process.env.PREVIEW_BASE;
          if(!account||!token||!base)throw new Error('Preview runtime credentials unavailable');
          const cfg=fs.readFileSync('wrangler.preview.toml','utf8'),db=cfg.match(/database_id\s*=\s*"([^"]+)"/)?.[1];
          if(!db)throw new Error('Preview database unavailable');
          const b64url=s=>Buffer.from(String(s||''),'base64url');
          const opaque=fs.readFileSync('.github/run-jt-preview-business-bootstrap-apply.txt','utf8').trim();
          let transport;try{transport=JSON.parse(Buffer.from(opaque,'base64url').toString('utf8'));}catch{throw new Error('Encrypted bootstrap payload is invalid');}
          if(transport?.v!==1||!transport.wrappedPrivateB64||!transport.wrapIvB64||!transport.encryptedPayloadB64)throw new Error('Encrypted bootstrap payload is incomplete');
          async function q(sql,params=[]){for(let i=1;i<=5;i++){const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});const p=await r.json().catch(()=>({}));if(r.ok&&p.success!==false&&p.result?.[0]?.success!==false)return p.result?.[0]?.results||[];if(i===5)throw new Error('Preview D1 query failed');await new Promise(x=>setTimeout(x,800*i));}}
          async function hashPassword(value){const salt=randomBytes(16),key=await webcrypto.subtle.importKey('raw',new TextEncoder().encode(value),'PBKDF2',false,['deriveBits']);const bits=await webcrypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},key,256);return `pbkdf2$100000$${salt.toString('base64')}$${Buffer.from(bits).toString('base64')}`;}
          (async()=>{
            const wrapRaw=createHash('sha256').update(`kun-jt-preview-bootstrap-v1:${token}`).digest();
            const wrapKey=await webcrypto.subtle.importKey('raw',wrapRaw,{name:'AES-GCM'},false,['decrypt']);
            let privatePkcs8;try{privatePkcs8=await webcrypto.subtle.decrypt({name:'AES-GCM',iv:b64url(transport.wrapIvB64)},wrapKey,b64url(transport.wrappedPrivateB64));}catch{throw new Error('Encrypted bootstrap private key could not be opened');}
            const privateKey=await webcrypto.subtle.importKey('pkcs8',privatePkcs8,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);
            let plain;try{plain=await webcrypto.subtle.decrypt({name:'RSA-OAEP'},privateKey,b64url(transport.encryptedPayloadB64));}catch{throw new Error('Encrypted J&T Business Info could not be opened');}
            let business;try{business=JSON.parse(Buffer.from(plain).toString('utf8'));}catch{throw new Error('J&T Business Info payload is invalid');}
            const customerCode=String(business.customerCode||'').trim(),customerPassword=String(business.customerPassword||'');
            if(!/^J\d{10}$/i.test(customerCode)||customerPassword.length<4)throw new Error('J&T Business Info payload failed validation');
            const cons=await q("SELECT id,client_id FROM store_connections WHERE provider='jt' ORDER BY updated_at DESC");
            if(cons.length!==1)throw new Error(`Expected exactly one Preview J&T connection; got ${cons.length}`);
            const connectionId=String(cons[0].id),clientId=String(cons[0].client_id||'').trim();if(!connectionId||!clientId)throw new Error('Preview J&T connection scope is incomplete');
            const nonce=randomBytes(6).toString('hex'),id=`QA-JT-SEED-${nonce}`,email=`qa-jt-seed-${nonce}@example.test`,adminPassword=`JtSeed!${randomBytes(12).toString('hex')}Aa1`,hash=await hashPassword(adminPassword),ts=new Date().toISOString();
            try{
              await q('DELETE FROM login_attempts WHERE email=?',[email]).catch(()=>{});await q('DELETE FROM users WHERE email=?',[email]).catch(()=>{});
              await q('INSERT INTO users (id,email,name,password,role,client_id,status,created_at,last_login) VALUES (?,?,?,?,?,NULL,?,?,NULL)',[id,email,'CI J&T Business Bootstrap Admin',hash,'admin','active',ts]);
              const login=await fetch(`${base}/api/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:adminPassword}),signal:AbortSignal.timeout(20000)});
              if(!login.ok)throw new Error(`Preview admin login failed ${login.status}`);
              const cookie=(login.headers.get('set-cookie')||'').split(';')[0];if(!cookie)throw new Error('Preview admin session cookie missing');
              async function putSecret(name,value){const r=await fetch(`${base}/api/integration-secrets/${encodeURIComponent(connectionId)}/${encodeURIComponent(name)}`,{method:'PUT',headers:{Cookie:cookie,'Content-Type':'application/json'},body:JSON.stringify({clientId,value}),signal:AbortSignal.timeout(20000)});const p=await r.json().catch(()=>({}));if(!r.ok||p?.stored!==true)throw new Error(`Kun Online rejected encrypted J&T secret ${name} (${r.status})`);}
              await putSecret('customer_code',customerCode);
              await putSecret('customer_password',customerPassword);
              const list=await fetch(`${base}/api/integration-secrets/${encodeURIComponent(connectionId)}?clientId=${encodeURIComponent(clientId)}`,{headers:{Cookie:cookie},signal:AbortSignal.timeout(20000)});
              const names=(await list.json().catch(()=>[])).map(x=>String(x.secret_name||''));
              if(!list.ok||!names.includes('customer_code')||!names.includes('customer_password'))throw new Error('J&T Business Info storage verification failed');
              console.log('JT_BUSINESS_BOOTSTRAP_STORED=true');
              console.log('JT_BUSINESS_BOOTSTRAP_CONNECTION='+connectionId);
            } finally {
              await q('DELETE FROM login_attempts WHERE email=?',[email]).catch(()=>{});await q('DELETE FROM users WHERE email=?',[email]).catch(()=>{});
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Create one real Preview J&T QA shipment and verify AWB linkage
        run: node scripts/live-preview-jt-create-order-qa-once.mjs "$PREVIEW_BASE"
      - name: Verify Sorting Code, system linkage, and live tracking endpoint
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const {webcrypto,randomBytes}=crypto;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,base=process.env.PREVIEW_BASE;
          const cfg=fs.readFileSync('wrangler.preview.toml','utf8'),db=cfg.match(/database_id\s*=\s*"([^"]+)"/)?.[1];
          async function q(sql,params=[]){const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});const p=await r.json().catch(()=>({}));if(!r.ok||p.success===false||p.result?.[0]?.success===false)throw new Error('Preview D1 verification query failed');return p.result?.[0]?.results||[];}
          async function hashPassword(value){const salt=randomBytes(16),key=await webcrypto.subtle.importKey('raw',new TextEncoder().encode(value),'PBKDF2',false,['deriveBits']);const bits=await webcrypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},key,256);return `pbkdf2$100000$${salt.toString('base64')}$${Buffer.from(bits).toString('base64')}`;}
          (async()=>{
            const rows=await q("SELECT id,client_id,store_id,state,awb,history FROM orders WHERE source='qa_jt_live' AND awb IS NOT NULL AND TRIM(awb)<>'' ORDER BY created_at DESC LIMIT 1");
            if(!rows.length)throw new Error('No linked Preview J&T QA AWB was found');
            const row=rows[0],history=(()=>{try{return JSON.parse(row.history||'[]')}catch{return []}})(),created=[...history].reverse().find(x=>x?.type==='jt_shipment_created')||{};
            if(!String(created.awb||row.awb||'').trim())throw new Error('J&T shipment-created event is missing AWB');
            console.log('JT_LINKED_ORDER_ID='+row.id);console.log('JT_LINKED_AWB='+row.awb);console.log('JT_LINKED_STATE='+row.state);console.log('JT_LINKED_SORTING_CODE='+String(created.sortingCode||''));console.log('JT_LINKED_TXLOGISTIC_ID='+String(created.txlogisticId||''));
            const nonce=randomBytes(6).toString('hex'),id=`QA-JT-TRACK-${nonce}`,email=`qa-jt-track-${nonce}@example.test`,password=`JtTrack!${randomBytes(12).toString('hex')}Aa1`,hash=await hashPassword(password),ts=new Date().toISOString();
            try{
              await q('INSERT INTO users (id,email,name,password,role,client_id,status,created_at,last_login) VALUES (?,?,?,?,?,NULL,?,?,NULL)',[id,email,'CI J&T Tracking Admin',hash,'admin','active',ts]);
              const login=await fetch(`${base}/api/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password}),signal:AbortSignal.timeout(20000)});if(!login.ok)throw new Error(`Preview tracking admin login failed ${login.status}`);const cookie=(login.headers.get('set-cookie')||'').split(';')[0];if(!cookie)throw new Error('Preview tracking session missing');
              const tr=await fetch(`${base}/api/jt/shipments/${encodeURIComponent(row.id)}/track`,{method:'POST',headers:{Cookie:cookie,'Content-Type':'application/json'},body:JSON.stringify({clientId:row.client_id,...(row.store_id?{storeId:row.store_id}:{})}),signal:AbortSignal.timeout(60000)});const p=await tr.json().catch(()=>({}));
              console.log('JT_TRACK_HTTP='+tr.status);console.log('JT_TRACK_OK='+(p?.ok===true));console.log('JT_TRACK_STATUS='+String(p?.tracking?.status||''));console.log('JT_TRACK_CHECKPOINT='+String(p?.checkpoint||''));
              if(!tr.ok||p?.ok!==true)throw new Error(`J&T live tracking endpoint failed (${tr.status})`);
              const get=await fetch(`${base}/api/jt/shipments/${encodeURIComponent(row.id)}?clientId=${encodeURIComponent(row.client_id)}`,{headers:{Cookie:cookie},signal:AbortSignal.timeout(20000)});const g=await get.json().catch(()=>({}));if(!get.ok||g?.awb!==row.awb)throw new Error('J&T linked shipment readback failed');
              console.log('JT_READBACK_SORTING_CODE='+String(g.sortingCode||''));console.log('JT_READBACK_LINK_OK=true');
            } finally {await q('DELETE FROM login_attempts WHERE email=?',[email]).catch(()=>{});await q('DELETE FROM users WHERE email=?',[email]).catch(()=>{});}
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE