name: Android mobile redesign verification

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/index.js'
      - 'src/session-revocation.js'
      - 'src/index-production-mobile-update.js'
      - 'src/mobile-*.js'
      - 'public/v2/modules-v26-auth.js'
      - 'scripts/android-*.mjs'
      - 'scripts/admin-client-password-reset-ui-test.mjs'
      - 'scripts/pr209-main-reconciliation-guard.mjs'
      - '.github/workflows/android-mobile-redesign-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check exact official Android launcher icon
        run: node scripts/android-launcher-icon-test.mjs
      - name: Customer service J&T Android UI regression
        run: |
          node scripts/android-customer-service-jnt-ux-test.mjs
          node scripts/android-customer-service-outcomes-test.mjs
      - name: Chat legacy SQLite and Android UX regression
        run: node scripts/android-chat-schema-ux-test.mjs
      - name: Reviewed Android design regression
        run: node scripts/android-v3-ui-contract-test.mjs
      - name: Fake accounting data and Android API contract
        run: node scripts/android-accounting-fake-test.mjs
      - name: Fake per-store new-order notifications and security
        run: node scripts/android-order-notifications-fake-test.mjs
      - name: Check reconciled owner password and session schema (offline only)
        run: |
          node scripts/admin-client-password-reset-ui-test.mjs
          node scripts/session-revocation-schema-contract.mjs
          node scripts/session-revocation-schema-contract-test.mjs
          node scripts/pr209-main-reconciliation-guard.mjs
      - name: Run unit tests and build debug APK
        run: gradle -p android test assembleDebug --stacktrace
      - name: Keep isolated debug APK for manual device QA
        uses: actions/upload-artifact@v4
        with:
          name: kunonline-audit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
