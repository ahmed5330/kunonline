name: Android mobile redesign verification

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/index-production-mobile-update.js'
      - 'src/production-customer-service.js'
      - 'src/jt-shipping-claim.js'
      - 'src/jt-print-workflow-v2.js'
      - 'public/v2/modules-v79-printing.js'
      - 'public/v2/modules-v155-customer-service-board.js'
      - 'public/v2/modules-v54-order-workflow-controls.js'
      - 'scripts/confirmed-shipping-handoff-contract-test.mjs'
      - 'scripts/jt-shipping-claim-sqlite-test.mjs'
      - '.github/workflows/android-mobile-redesign-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check exact official Android launcher icon
        run: node scripts/android-launcher-icon-test.mjs
      - name: Confirmed-to-shipping J&T contract and mock API regression (no live calls)
        run: |
          node scripts/confirmed-shipping-handoff-contract-test.mjs
          node scripts/jt-shipping-claim-sqlite-test.mjs
      - name: Customer service J&T Android UI regression
        run: |
          node scripts/android-customer-service-jnt-ux-test.mjs
          node scripts/android-customer-service-outcomes-test.mjs
      - name: Chat legacy SQLite and Android UX regression
        run: node scripts/android-chat-schema-ux-test.mjs
      - name: Reviewed Android design regression
        run: node scripts/android-v3-ui-contract-test.mjs
      - name: Fake accounting data and Android API contract
        run: node scripts/android-accounting-fake-test.mjs
      - name: Fake per-store new-order notifications and security
        run: node scripts/android-order-notifications-fake-test.mjs
      - name: Run unit tests and build debug APK
        run: gradle -p android test assembleDebug --stacktrace
