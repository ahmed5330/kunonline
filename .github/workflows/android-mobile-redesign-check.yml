name: Android mobile redesign verification

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-mobile-redesign-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check exact official Android launcher icon
        run: node scripts/android-launcher-icon-test.mjs
      - name: Customer service J&T Android UI regression
        run: |
          node scripts/android-customer-service-jnt-ux-test.mjs
          node scripts/android-customer-service-outcomes-test.mjs
      - name: Run unit tests and build debug APK
        run: gradle -p android test assembleDebug --stacktrace
