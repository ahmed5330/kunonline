name: J&T mobile panel diagnostic once
on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: [.github/workflows/jt-mobile-panel-diagnostic-once.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Inject temporary J&T DOM diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/browser-preview-mobile-qa.mjs')
          s=p.read_text()
          old="const jtStable=await evalJs(`(()=>{const panel=document.getElementById('intSetupPanel');return {senderCount:panel?.querySelectorAll('[data-jt84-sender]').length||0,timerResponsive:Boolean(window.__kunJtSetupTimer)};})()`);"
          new="const jtStable=await evalJs(`(()=>{const panel=document.getElementById('intSetupPanel'),grid=panel?.querySelector('.form-grid'),active=document.querySelector('.nav button.active[data-view]')?.dataset.view||'',row=[...document.querySelectorAll('#intGroups tbody tr')].find(r=>(r.querySelector('.meta')?.textContent||'').trim()==='jt'||(r.innerText||'').includes('J&T Express Egypt'));return {senderCount:panel?.querySelectorAll('[data-jt84-sender]').length||0,timerResponsive:Boolean(window.__kunJtSetupTimer),panelExists:Boolean(panel),gridExists:Boolean(grid),panelText:(panel?.innerText||'').slice(0,500),activeView:active,jtRowExists:Boolean(row),setupButtons:document.querySelectorAll('.intSetup').length,rootText:(document.getElementById('root')?.innerText||'').slice(0,300)};})()`);"
          if old not in s: raise SystemExit('diagnostic target not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Run isolated Preview mobile QA diagnostic
        run: node scripts/browser-preview-mobile-qa.mjs https://kunonline-preview.mr-a-mnaa.workers.dev
