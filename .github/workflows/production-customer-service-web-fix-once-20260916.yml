name: Deploy Production Customer Service web fix once

on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: ['.github/workflows/production-customer-service-web-fix-once-20260916.yml']

permissions:
  contents: read

concurrency:
  group: kunonline-production-customer-service-web-fix-20260916
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_REF: release/commerce-v38-production-20260910
      EXPECTED_RELEASE_SHA: 667774c76de0328a369a107ba0141ba40c6da5e5
      PROD_CUSTOM: https://app.kun-online.com
      PROD_WORKERS: https://kunonline.mr-a-mnaa.workers.dev
      EXPECTED_BUILD: production-commerce-v38-free-tier-safe-2026-09-10
    steps:
      - name: Checkout exact validated Production release
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm install --ignore-scripts

      - name: Validate exact release and Customer Service fix locally
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          node --check public/v2/modules-v77-customer-service-no-reload.js
          grep -Fq "customerServiceNavV77" public/v2/modules-v77-customer-service-no-reload.js
          grep -Fq "version:'77.2'" public/v2/modules-v77-customer-service-no-reload.js
          grep -Fq "const BUILD='$EXPECTED_BUILD';" src/index-production-sync.js
          npm run check:production-config

      - name: Verify Production D1 remains healthy read-only
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS orders_total FROM orders; SELECT COUNT(*) AS cs_orders FROM orders WHERE state IN ('pending','no_answer','confirmed','preparing','shipped','deferred'); SELECT COUNT(*) AS missing_store_cs FROM orders WHERE state IN ('pending','no_answer','confirmed','preparing','shipped','deferred') AND store_id IS NULL;" --json)"
          printf '%s' "$result" | node -e 'let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const p=JSON.parse(raw),rows=[];const walk=x=>{if(Array.isArray(x))return x.forEach(walk);if(x&&typeof x==="object"){if(Array.isArray(x.results))rows.push(...x.results);Object.values(x).forEach(walk)}};walk(p);const get=k=>Number(rows.find(x=>x[k]!=null)?.[k]);const total=get("orders_total"),cs=get("cs_orders"),missing=get("missing_store_cs");if(!Number.isFinite(total)||total<1)throw new Error(`orders_total=${total}`);if(!Number.isFinite(cs)||cs<1)throw new Error(`cs_orders=${cs}`);if(missing!==0)throw new Error(`missing_store_cs=${missing}`);console.log(`Production D1 read-only check passed: orders=${total}, cs=${cs}, missing_store_cs=${missing}`);});'

      - name: Capture current Production Worker version
        id: before
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.production.toml --json)"
          version="$(printf '%s' "$status" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const root=JSON.parse(raw),hits=[];const walk=x=>{if(Array.isArray(x)){x.forEach(walk);return}if(!x||typeof x!=="object")return;const id=x.version_id||x.versionId,p=x.percentage??x.traffic_percentage??x.trafficPercentage;if(id)hits.push({id:String(id),p:p==null?null:Number(p)});Object.values(x).forEach(walk)};walk(root);const u=[...new Map(hits.map(x=>[x.id,x])).values()];const full=u.find(x=>x.p===100||x.p===1)||(u.length===1?u[0]:null);if(!full)process.exit(2);process.stdout.write(full.id)});')"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
          echo 'Captured current Production Worker version for rollback.'

      - name: Dry-run exact Production bundle
        run: npx wrangler deploy --dry-run --config wrangler.production.toml

      - name: Deploy Worker and assets only
        id: deploy
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --config wrangler.production.toml

      - name: Validate Production Customer Service assets and runtime
        run: |
          set -euo pipefail
          for base in "$PROD_WORKERS" "$PROD_CUSTOM"; do
            ready=0
            for i in $(seq 1 30); do
              health="$(curl -sS -o /tmp/health -w '%{http_code}' "$base/health/easyorders-sync" || true)"
              v2="$(curl -sS -o /tmp/v2 -w '%{http_code}' "$base/v2/" || true)"
              cs="$(curl -sS -o /tmp/cs -w '%{http_code}' "$base/v2/modules-v77-customer-service-no-reload.js?v=77.2&deploy=$GITHUB_RUN_ID" || true)"
              auth="$(curl -sS -o /tmp/api -w '%{http_code}' "$base/api/customer-service" || true)"
              build_ok=0
              if [ "$health" = "200" ] && EXPECTED_BUILD="$EXPECTED_BUILD" node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/health","utf8"));process.exit(p.ok===true&&p.build===process.env.EXPECTED_BUILD?0:1)' >/dev/null 2>&1; then build_ok=1; fi
              if [ "$build_ok" = "1" ] && [ "$v2" = "200" ] && [ "$cs" = "200" ] && [ "$auth" = "401" ] && grep -Fq "customerServiceNavV77" /tmp/cs && grep -Fq "version:'77.2'" /tmp/cs && node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/api","utf8"));process.exit(p.code==="AUTH_REQUIRED"?0:1)' >/dev/null 2>&1; then
                ready=1
                echo "Customer Service web fix verified on $base at attempt $i."
                break
              fi
              sleep 2
            done
            test "$ready" = "1"
          done

      - name: Inspect cache policy for Customer Service asset
        run: |
          set -euo pipefail
          curl -sSI "$PROD_CUSTOM/v2/modules-v77-customer-service-no-reload.js?v=77.1" | grep -Ei '^(cache-control|etag|cf-cache-status|age|last-modified):' || true

      - name: Roll back exact prior Worker if validation fails
        if: failure() && steps.deploy.outputs.attempted == 'true' && steps.before.outputs.version_id != ''
        run: |
          set -euo pipefail
          npx wrangler versions deploy "${{ steps.before.outputs.version_id }}@100%" --yes --config wrangler.production.toml --message "Automatic rollback after failed Customer Service web fix"
          echo 'Previous Production Worker restored.'

      - name: Clean temporary files
        if: always()
        run: rm -f /tmp/health /tmp/v2 /tmp/cs /tmp/api
