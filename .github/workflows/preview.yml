name: Preview CI/CD
# Preview-only automation; production resources are forbidden.
on:
  push:
    branches: [develop/ux-system-upgrade]
  workflow_dispatch:
concurrency:
  group: kunonline-preview
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: https://kunonline-preview.mr-a-mnaa.workers.dev/v2/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run check:deploy
      - name: Verify Production remains migration-free
        run: npm run check:production-config
      - name: Apply preview migrations only
        run: npm run db:migrate:preview
      - name: Deploy preview Worker
        run: npm run deploy:preview
      - name: Smoke test deployed preview
        id: smoke
        continue-on-error: true
        run: npm run smoke:preview
      - name: Roll back Preview code after failed smoke test
        if: steps.smoke.outcome == 'failure'
        run: npm run rollback:preview
      - name: Verify restored Preview
        if: steps.smoke.outcome == 'failure'
        run: npm run smoke:preview
      - name: Mark failed deployment
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "The new Preview failed smoke tests and was rolled back."
          exit 1
