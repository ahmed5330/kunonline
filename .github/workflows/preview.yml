name: Preview CI/CD
# Preview-only automation; production resources are forbidden.
on:
  push:
    branches: [develop/ux-system-upgrade]
  workflow_dispatch:
concurrency:
  group: kunonline-preview
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: https://kunonline-preview.mr-a-mnaa.workers.dev/v2/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run check:deploy
      - name: Verify Production remains migration-free
        run: npm run check:production-config
      - name: Set isolated Preview session secret
        run: |
          node -e 'console.log(JSON.stringify({SESSION_SECRET: require("node:crypto").randomBytes(32).toString("hex")}))' | npx wrangler secret bulk --config wrangler.preview.toml
      - name: Apply preview migrations only
        run: npm run db:migrate:preview
      - name: Deploy preview Worker
        run: npm run deploy:preview
      - name: Smoke test deployed preview
        run: npm run smoke:preview
