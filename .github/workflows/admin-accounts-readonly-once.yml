name: Admin accounts read-only once
on:
  push:
    branches: [develop/ux-system-upgrade]
    paths:
      - .github/workflows/admin-accounts-readonly-once.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/commerce-v38-production-20260910
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Inspect active admin accounts read-only
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          const prod=fs.readFileSync('wrangler.production.toml','utf8').match(/database_id\s*=\s*"([^"]+)"/)?.[1];
          if(!account||!token||!prod) throw new Error('Cloudflare/D1 config missing');
          async function q(sql){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${prod}/query`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({sql})});
            const p=await r.json().catch(()=>({}));
            if(!r.ok||p.success===false||p.result?.[0]?.success===false) throw new Error('D1 read-only query failed');
            return p.result?.[0]?.results||[];
          }
          function mask(email=''){const [l='',d='']=String(email).toLowerCase().split('@'); return `${l.slice(0,2)}***@${d}`;}
          (async()=>{
            const rows=await q(`SELECT u.email,u.created_at,u.last_login,COALESCE(l.fails,0) fails,l.locked_until FROM users u LEFT JOIN login_attempts l ON lower(l.email)=lower(u.email) WHERE u.role='admin' AND u.status='active' ORDER BY u.created_at,u.id`);
            console.log(JSON.stringify({count:rows.length,admins:rows.map(r=>({maskedEmail:mask(r.email),createdAt:r.created_at||null,lastLoginAt:r.last_login||null,failedAttempts:Number(r.fails||0),locked:Boolean(r.locked_until)}))},null,2));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
