name: Esraa production read-only diagnostic once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/esraa-prod-readonly-diagnostic-once.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SHA: 21e440deb6351c6850fa51314ce2d62d3d219e86
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Verify exact production release source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          grep -F 'database_id = "c426601d-182f-486e-a5c1-bb1bca0ecb0b"' wrangler.production.toml
      - name: Read Esraa account state only
        run: |
          set -euo pipefail
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT substr(email,1,2)||'***@'||substr(email,instr(email,'@')+1) AS masked_email,role,status,client_id,last_login FROM users WHERE lower(email)=lower('esraanabilismail@gmail.com') LIMIT 1;"
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COALESCE((SELECT fails FROM login_attempts WHERE lower(email)=lower('esraanabilismail@gmail.com') LIMIT 1),0) AS failed_attempts,(SELECT locked_until FROM login_attempts WHERE lower(email)=lower('esraanabilismail@gmail.com') LIMIT 1) AS locked_until;"
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS client_role_count FROM users WHERE client_id=(SELECT client_id FROM users WHERE lower(email)=lower('esraanabilismail@gmail.com') LIMIT 1) AND role='client';"
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS reset_count,MAX(created_at) AS latest_reset_at FROM audit_log WHERE action='platform.client.password_reset' AND client_id=(SELECT client_id FROM users WHERE lower(email)=lower('esraanabilismail@gmail.com') LIMIT 1);"
