name: One-time admin recovery helper
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-recovery-helper-once.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HELPER_SHA: 1a7605ad93e9f23654ae1543990a304643def960
      HELPER_URL: https://kunonline-admin-recovery-20260915.mr-a-mnaa.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HELPER_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate isolated helper
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HELPER_SHA"
          node --check ops/admin-recovery-worker.js
          grep -F 'kunonline-admin-recovery-20260915' wrangler.admin-recovery.toml
          grep -F 'c426601d-182f-486e-a5c1-bb1bca0ecb0b' wrangler.admin-recovery.toml
          ! grep -F '12345678910' ops/admin-recovery-worker.js
      - name: Pin runtime recovery to oldest active admin
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='ops/admin-recovery-worker.js';
          let s=fs.readFileSync(p,'utf8');
          const selector='const targets = await activeAdmins(env);';
          if(!s.includes(selector)) throw new Error('Expected recovery selector not found');
          s=s.replace(selector,'const targets = (await activeAdmins(env)).slice(0,1);');
          if(!s.includes("helper: 'admin-recovery-v2'")) throw new Error('Expected health marker not found');
          s=s.replace("helper: 'admin-recovery-v2'","helper: 'admin-recovery-pinned-oldest-v1'");
          fs.writeFileSync(p,s);
          NODE
          grep -F 'slice(0,1)' ops/admin-recovery-worker.js
          grep -F 'admin-recovery-pinned-oldest-v1' ops/admin-recovery-worker.js
          node --check ops/admin-recovery-worker.js
      - name: Deploy isolated recovery helper
        run: npx wrangler deploy --config wrangler.admin-recovery.toml --message "One-time admin recovery helper pinned to verified oldest admin v1"
      - name: Wait for exact pinned Worker version
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 45); do
            code="$(curl --silent --show-error -o /tmp/health.json -w '%{http_code}' "$HELPER_URL/health?attempt=$attempt&ts=$(date +%s%N)" || true)"
            if [ "$code" = "200" ] && grep -Fq 'admin-recovery-pinned-oldest-v1' /tmp/health.json; then ready=1; break; fi
            sleep 2
          done
          cat /tmp/health.json || true
          test "$ready" -eq 1
      - name: Confirm two admins before targeted recovery
        run: |
          set -euo pipefail
          curl --silent --show-error "$HELPER_URL/status?ts=$(date +%s%N)" | tee /tmp/status.json
          grep -Fq '"activeAdminCount":2' /tmp/status.json
      - name: Apply recovery once
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -X POST -o /tmp/apply.json -w '%{http_code}' "$HELPER_URL/apply?ts=$(date +%s%N)")"
          cat /tmp/apply.json
          if [ "$code" = "200" ]; then
            grep -Fq '"ok":true' /tmp/apply.json
          elif [ "$code" = "410" ]; then
            grep -Fq 'recovery_already_applied' /tmp/apply.json
          else
            echo "Recovery apply failed with HTTP $code"
            exit 1
          fi
      - name: Verify only oldest admin recovery state
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            curl --silent --show-error "$HELPER_URL/status?verify=$attempt&ts=$(date +%s%N)" > /tmp/status-after.json || true
            if node -e "const s=require('/tmp/status-after.json'); if(!(s.activeAdminCount===2&&s.recoveryApplied===true&&s.candidates?.[0]?.presetHashMatches===true&&s.candidates?.[0]?.failedAttempts===0&&!s.candidates?.[0]?.locked&&s.candidates?.[1]?.presetHashMatches===false)) process.exit(1)"; then ok=1; break; fi
            sleep 2
          done
          cat /tmp/status-after.json
          test "$ok" -eq 1
