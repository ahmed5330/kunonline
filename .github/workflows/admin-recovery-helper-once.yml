name: One-time admin recovery helper
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-recovery-helper-once.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HELPER_SHA: 1a7605ad93e9f23654ae1543990a304643def960
      HELPER_URL: https://kunonline-admin-recovery-20260915.mr-a-mnaa.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HELPER_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate isolated helper
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HELPER_SHA"
          node --check ops/admin-recovery-worker.js
          grep -F 'kunonline-admin-recovery-20260915' wrangler.admin-recovery.toml
          grep -F 'c426601d-182f-486e-a5c1-bb1bca0ecb0b' wrangler.admin-recovery.toml
          ! grep -F '12345678910' ops/admin-recovery-worker.js
      - name: Deploy isolated recovery helper
        run: npx wrangler deploy --config wrangler.admin-recovery.toml --message "One-time admin recovery helper v3"
      - name: Wait for helper status endpoint
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error -o /tmp/status.json -w '%{http_code}' "$HELPER_URL/status" || true)"
            if [ "$code" = "200" ] && grep -Fq '"activeAdminCount"' /tmp/status.json; then
              ready=1
              break
            fi
            sleep 2
          done
          cat /tmp/status.json || true
          test "$ready" -eq 1
          grep -Fq '"activeAdminCount":1' /tmp/status.json
      - name: Apply recovery once
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -X POST -o /tmp/apply.json -w '%{http_code}' "$HELPER_URL/apply")"
          cat /tmp/apply.json
          if [ "$code" = "200" ]; then
            grep -Fq '"ok":true' /tmp/apply.json
          elif [ "$code" = "410" ]; then
            grep -Fq 'recovery_already_applied' /tmp/apply.json
          else
            echo "Recovery apply failed with HTTP $code"
            exit 1
          fi
      - name: Verify recovery state
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            curl --silent --show-error "$HELPER_URL/status" > /tmp/status-after.json || true
            if grep -Fq '"presetHashMatches":true' /tmp/status-after.json && grep -Fq '"failedAttempts":0' /tmp/status-after.json && grep -Fq '"recoveryApplied":true' /tmp/status-after.json; then
              ok=1
              break
            fi
            sleep 2
          done
          cat /tmp/status-after.json
          test "$ok" -eq 1
