name: J&T Production credential presence read-only
on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: [.github/run-jt-production-credential-presence-20260910.txt]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Check names only, never secret values
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cfg=fs.readFileSync('wrangler.production.toml','utf8');
          const db=cfg.match(/database_id\s*=\s*"([^"]+)"/)?.[1];
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          async function q(sql,params=[]){const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});const p=await r.json();if(!r.ok||p.success===false)throw new Error('D1 query failed');return p.result?.[0]?.results||[]}
          (async()=>{
            const rows=await q("SELECT sc.id AS connection_id, sc.status, MAX(CASE WHEN s.secret_name='api_account' THEN 1 ELSE 0 END) has_api_account, MAX(CASE WHEN s.secret_name='private_key' THEN 1 ELSE 0 END) has_private_key, MAX(CASE WHEN s.secret_name='source_code' THEN 1 ELSE 0 END) has_source_code, MAX(CASE WHEN s.secret_name='customer_code' THEN 1 ELSE 0 END) has_customer_code, MAX(CASE WHEN s.secret_name='customer_password' THEN 1 ELSE 0 END) has_customer_password FROM store_connections sc LEFT JOIN integration_secrets s ON s.connection_id=sc.id AND s.client_id=sc.client_id WHERE sc.provider='jt' GROUP BY sc.id,sc.status ORDER BY sc.updated_at DESC LIMIT 10");
            fs.writeFileSync('/tmp/jt-presence.json',JSON.stringify(rows,null,2));
            console.log(`Checked ${rows.length} J&T connection(s); secret values were never selected.`);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: jt-production-credential-presence
          path: /tmp/jt-presence.json
          retention-days: 1
