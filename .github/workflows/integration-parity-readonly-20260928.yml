name: Integration parity read-only 2026-09-28
on:
  push:
    branches: [main]
    paths: [.github/workflows/integration-parity-readonly-20260928.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
      - name: Read live Production vs Preview parity without secret values
        run: |
          set -euo pipefail
          url="https://app.kun-online.com/health/preview-parity?audit=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS -H 'Cache-Control: no-cache' "$url" -o /tmp/parity.json
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/parity.json','utf8'));
          if(d.ok!==true) throw new Error(`Parity endpoint failed: ${JSON.stringify(d)}`);
          const shape=s=>({
            counts:s?.counts||{},
            integrations:s?.integrations||{},
            targetTenant:s?.targetTenant||{},
            tenantInventory:s?.tenantInventory||[]
          });
          const out={
            mode:d.mode,
            keyCompatibility:d.keyCompatibility,
            production:shape(d.production),
            preview:shape(d.preview),
            generatedAt:d.generatedAt
          };
          console.log(JSON.stringify(out,null,2));
          NODE
