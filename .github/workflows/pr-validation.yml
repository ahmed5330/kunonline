name: PR validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kunonline-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Admin J&T shipment access and import safety
        run: |
          node --check src/admin-jnt-shipments.js
          node --check public/v2/modules-v154-admin-jnt-shipments.js
          node scripts/admin-jnt-shipments-test.mjs
      - name: Customer Service call continuity and Android overlay contract
        run: |
          node --check src/operational-workflow-v105.js
          node --check src/production-customer-service.js
          node --check public/v2/modules-v109-operational-date-contact.js
          node --check public/v2/modules-v31-customer-service.js
          node scripts/customer-service-call-continuity-test.mjs
          node scripts/android-customer-service-outcomes-test.mjs
      - name: Validate universal Android order search scope
        run: |
          node --check src/mobile-global-order-search.js
          node --check src/index-production-mobile-update.js
          node scripts/mobile-global-order-search-test.mjs
          node --check src/mobile-store-options.js
          node scripts/mobile-store-options-test.mjs
      - name: Kun Online MCP full authorization-code and revocation contract
        run: node scripts/kun-chatgpt-mcp-full-flow-test.mjs
      - name: Kun Online ChatGPT MCP OAuth and read-only fake tests
        run: node scripts/kun-chatgpt-mcp-fake-test.mjs
      - name: AI provider integration fake tests and secure tenancy
        run: node scripts/ai-integrations-fake-test.mjs
      - name: Historical mobile and web contact-count recovery
        run: node scripts/contact-history-recovery-test.mjs
      - name: Android cancellation outcome field parity
        run: node scripts/android-outcome-reason-contract-test.mjs
      - name: Login, cancellation and order-linked group notes regression
        run: node scripts/login-cancel-group-notes-regression-test.mjs
      - name: Customer Service notes, copy and model-color cards
        run: node scripts/customer-service-notes-product-cards-test.mjs
      - name: Customer Service board, periods and J&T void regression
        run: node scripts/customer-service-board-print-void-test.mjs
      - name: Read-only customer document browser fixture
        run: node scripts/browser-order-document-preview-test.mjs
      - name: Multi-store order alerts and accounting regression
        run: |
          node scripts/android-order-notifications-fake-test.mjs
          node scripts/android-accounting-fake-test.mjs
      - name: Run full contract and unit suite
        run: npm test
      - name: Inventory workspace UX browser regression
        run: node scripts/browser-inventory-workspace-fixture-test.mjs
      - name: Sidebar cross-group navigation browser regression
        run: node scripts/browser-sidebar-navigation-regression-test.mjs
      - name: Growth planner real Chromium interaction regression
        run: node scripts/browser-growth-planner-fixture-test.mjs
      - name: Verify Preview isolation
        run: npm run check:preview-config
      - name: Verify Production remains migration-free
        run: npm run check:production-config
      - name: Verify coordinated Production/Preview release gate contracts
        run: node scripts/production-preview-release-gate-test.mjs
      - name: Verify Preview Worker bundle without deploying
        run: |
          npx wrangler deploy --dry-run --config wrangler.preview.toml
      - name: Boot branch Preview Worker locally and assert growth API authentication
        run: node scripts/growth-local-worker-smoke.mjs
      - name: Read-only production login health probe
        run: node scripts/live-production-login-route-probe.mjs
      - name: Build reviewable Kun Online ChatGPT plugin draft
        run: node scripts/build-kun-chatgpt-plugin.mjs
      - name: Attach ChatGPT plugin draft package
        uses: actions/upload-artifact@v4
        with:
          name: kun-online-chatgpt-plugin-draft
          path: dist/kun-online-chatgpt-plugin-draft.zip
          if-no-files-found: error
      - name: Validate V2 login gateway and browser asset references
        run: |
          node --check public/v2/modules-v142-login-gateway.js
          node scripts/v2-login-gateway-contract-test.mjs
