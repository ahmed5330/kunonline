name: One-time Easy Orders Worker scheduler metadata audit (GET only)

# Branch-scoped metadata audit on an already environment-approved branch.
# Trigger only when this file changes. No workflow_dispatch, cron, Production/Preview deploy or D1 access.
on:
  push:
    branches:
      - codex/serialized-warehouse-operations
    paths:
      - '.github/workflows/easyorders-protected-readonly-inventory-20261025.yml'

permissions:
  contents: read

concurrency:
  group: kunonline-protected-worker-metadata-20261025
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment:
      name: preview
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify inspector is GET-only with fake Cloudflare responses
        run: |
          node --check scripts/easyorders-cloudflare-worker-readonly-inventory.mjs
          node scripts/easyorders-cloudflare-worker-readonly-inventory-test.mjs
      - name: Read metadata of actual scheduler, Preview and Production Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/easyorders-cloudflare-worker-readonly-inventory.mjs
      - name: Verify D1 metadata inspector offline
        run: node scripts/cloudflare-d1-binding-readonly-inventory-test.mjs
      - name: Verify actual D1 binding identity and recovery bookmark (GET only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-d1-binding-readonly-inventory.mjs
# The script makes exactly 9 Cloudflare API GET requests (3 workers x:
# schedules, settings and deployments), displays ONLY binding type/name and
# service target plus cron/version IDs. No customer queries or raw API bodies.
