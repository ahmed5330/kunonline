name: Production customer service interactions redeploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-customer-service-interactions-redeploy.yml

permissions:
  contents: read

concurrency:
  group: kunonline-production-customer-service-20260913
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://app.kun-online.com
    env:
      RELEASE_SHA: ad9a49d1a8805d5c402bb512838e0e62db5f4c72
      RELEASE_BUILD: production-commerce-v38-free-tier-safe-2026-09-10
      BASE_URL: https://app.kun-online.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm install --ignore-scripts

      - name: Validate customer-service call and contact release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node --check src/customer-service.js
          node --check public/v2/modules-v75-customer-service-interactions.js
          grep -Fq "intent:isCall?'call':'contact'" public/v2/modules-v75-customer-service-interactions.js
          grep -Fq "تم تسجيل المكالمة في سجل الأوردر" public/v2/modules-v75-customer-service-interactions.js
          grep -Fq 'contact_${channel}' src/customer-service.js
          grep -Fq "إجراء مكالمة — تم الضغط على زر الاتصال" src/customer-service.js
          grep -Fq '/v2/modules-v75-customer-service-interactions.js?v=75.2' public/v2/index.html
          node scripts/customer-service-interactions-test.mjs
          npm run check:production-config

      - name: Capture current Production Worker version
        id: previous
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.production.toml --json)"
          version="$(printf '%s' "$status" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{
              const root=JSON.parse(raw),hits=[];
              const walk=x=>{if(Array.isArray(x)){for(const v of x)walk(v);return;}if(!x||typeof x!=="object")return;
                const id=x.version_id||x.versionId,pct=x.percentage??x.traffic_percentage??x.trafficPercentage;
                if(id)hits.push({id:String(id),pct:pct==null?null:Number(pct)});for(const v of Object.values(x))walk(v);};
              walk(root);const unique=[...new Map(hits.map(x=>[x.id,x])).values()];
              const full=unique.find(x=>x.pct===100||x.pct===1)||(unique.length===1?unique[0]:null);
              if(!full)process.exit(2);process.stdout.write(full.id);
            });')"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy validated customer-service release
        id: deploy_worker
        run: |
          set -euo pipefail
          output="$(npx wrangler deploy --config wrangler.production.toml --message "Customer service call/contact verified release $RELEASE_SHA" 2>&1)"
          printf '%s\n' "$output"
          version="$(printf '%s\n' "$output" | sed -nE 's/.*Current Version ID: ([0-9a-f-]{36}).*/\1/p' | tail -1)"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"

      - name: Verify Production call and contact assets
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 40); do
            health_code="$(curl --silent --show-error -o /tmp/health.json -w '%{http_code}' "$BASE_URL/health/easyorders-sync" || true)"
            page_code="$(curl --silent --show-error -o /tmp/v2.html -w '%{http_code}' "$BASE_URL/v2/" || true)"
            asset_code="$(curl --silent --show-error -o /tmp/v75.js -w '%{http_code}' "$BASE_URL/v2/modules-v75-customer-service-interactions.js?v=75.2" || true)"
            build_ok=0
            if [ "$health_code" = "200" ] && RELEASE_BUILD="$RELEASE_BUILD" node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));process.exit(x.ok&&x.build===process.env.RELEASE_BUILD?0:1)"; then build_ok=1; fi
            if [ "$build_ok" = "1" ] && [ "$page_code" = "200" ] && [ "$asset_code" = "200" ] && \
               grep -Fq '/v2/modules-v75-customer-service-interactions.js?v=75.2' /tmp/v2.html && \
               grep -Fq "تم تسجيل المكالمة في سجل الأوردر" /tmp/v75.js && \
               grep -Fq "تم تسجيل محاولة التواصل في سجل الأوردر" /tmp/v75.js; then
              ready=1
              echo "Customer-service call/contact production verification passed."
              break
            fi
            echo "Waiting for production propagation: health=$health_code build=$build_ok page=$page_code asset=$asset_code attempt=$attempt/40"
            sleep 3
          done
          test "$ready" -eq 1

      - name: Roll back prior Worker version on failure
        if: failure() && steps.deploy_worker.outputs.version_id != '' && steps.previous.outputs.version_id != ''
        run: |
          set -euo pipefail
          npx wrangler versions deploy "${{ steps.previous.outputs.version_id }}@100%" --yes --config wrangler.production.toml --message "Rollback after customer service interaction deployment failure"
