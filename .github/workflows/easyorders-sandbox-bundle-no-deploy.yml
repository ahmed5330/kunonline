name: Easy Orders sandbox Worker bundle verification - no deploy
on:
  pull_request:
    branches:
      - fix/easyorders-explicit-store-gap-replay-20261024
    paths:
      - 'src/**'
      - 'wrangler.preview.toml'
      - 'wrangler.sync.preview.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/easyorders-sandbox-bundle-no-deploy.yml'
permissions:
  contents: read
jobs:
  dry-bundle-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preview Worker compile ONLY (Wrangler dry-run)
        run: npm run check:deploy
      - name: Dedicated Cron Worker compile ONLY (Wrangler dry-run)
        run: npm run check:sync-deploy
      - name: Compile did not require any Cloudflare account token
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          echo "PASS: all workers bundled locally using Wrangler dry-run, without deployment or database access."
