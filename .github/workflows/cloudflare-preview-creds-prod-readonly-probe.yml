name: Cloudflare Preview creds -> Production D1 read-only probe
on:
  push:
    branches:
      - develop/ux-system-upgrade
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Production D1 connectivity probe (SELECT-only)
        run: npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT 1 AS ok;"
      - name: Production tables (SELECT-only)
        run: npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
      - name: Production migration ledger presence (SELECT-only)
        run: npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT CASE WHEN EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='d1_migrations') THEN 1 ELSE 0 END AS has_d1_migrations;"
      - name: Commerce OS key-table compatibility (SELECT-only)
        run: |
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT name, CASE WHEN EXISTS(SELECT 1 FROM sqlite_master s WHERE s.type='table' AND s.name=req.name) THEN 1 ELSE 0 END AS present FROM (SELECT 'stores' AS name UNION ALL SELECT 'wallet_accounts' UNION ALL SELECT 'integration_connections' UNION ALL SELECT 'inventory_batches' UNION ALL SELECT 'order_duplicate_links') req;"
