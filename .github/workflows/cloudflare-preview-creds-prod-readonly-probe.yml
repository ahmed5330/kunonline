name: Cloudflare Production migration rehearsal
on:
  push:
    branches:
      - develop/ux-system-upgrade
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Export Production snapshot silently (remote read-only)
        run: |
          set -euo pipefail
          rm -f /tmp/prod.sql /tmp/prod.db /tmp/export.log
          if ! npx wrangler d1 export kunonline --remote --config wrangler.production.toml --output=/tmp/prod.sql >/tmp/export.log 2>&1; then
            echo 'Production export failed; output suppressed.'
            exit 1
          fi
          sqlite3 /tmp/prod.db < /tmp/prod.sql
          rm -f /tmp/prod.sql /tmp/export.log
          echo 'Ephemeral Production snapshot ready.'
      - name: Capture legacy row counts and aggregate tenancy metadata
        run: |
          set -euo pipefail
          echo "Legacy rows: orders=$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM orders;') users=$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM users;') customers=$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM customers;') products=$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM products;')"
          echo "Legacy client ids: $(sqlite3 /tmp/prod.db "SELECT COUNT(*) FROM (SELECT client_id FROM users WHERE client_id IS NOT NULL AND trim(client_id)<>'' UNION SELECT client_id FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' UNION SELECT client_id FROM customers WHERE client_id IS NOT NULL AND trim(client_id)<>'' UNION SELECT client_id FROM products WHERE client_id IS NOT NULL AND trim(client_id)<>'');")"
          echo 'User roles (aggregate only):'
          sqlite3 /tmp/prod.db "SELECT role,COUNT(*) FROM users GROUP BY role ORDER BY role;"
      - name: Apply legacy column bridge locally
        run: |
          set -euo pipefail
          sqlite3 /tmp/prod.db "ALTER TABLE chat_messages ADD COLUMN client_id TEXT;"
          echo 'Applied local-only bridge: chat_messages.client_id'
      - name: Apply migrations through multistore foundation locally
        run: |
          set -euo pipefail
          for file in migrations/0000_*.sql migrations/0001_*.sql migrations/0002_*.sql migrations/0003_*.sql migrations/0004_*.sql migrations/0005_*.sql migrations/0006_*.sql migrations/0007_*.sql migrations/0008_*.sql migrations/0009_*.sql migrations/0010_*.sql migrations/0011_*.sql; do
            echo "Applying locally: $file"
            sqlite3 /tmp/prod.db < "$file"
          done
      - name: Seed deterministic default stores and legacy user access locally
        run: |
          set -euo pipefail
          sqlite3 /tmp/prod.db <<'SQL'
          CREATE TEMP TABLE legacy_clients AS
          SELECT client_id FROM users WHERE client_id IS NOT NULL AND trim(client_id)<>''
          UNION SELECT client_id FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>''
          UNION SELECT client_id FROM customers WHERE client_id IS NOT NULL AND trim(client_id)<>''
          UNION SELECT client_id FROM products WHERE client_id IS NOT NULL AND trim(client_id)<>'';

          INSERT INTO stores (id,client_id,name,code,currency,timezone,status,is_default,created_at,updated_at)
          SELECT 'STR-LEGACY-'||client_id,client_id,'Main Store','MAIN','EGP','Africa/Cairo','active',1,datetime('now'),datetime('now')
          FROM legacy_clients lc
          WHERE NOT EXISTS (SELECT 1 FROM stores s WHERE s.client_id=lc.client_id AND s.status='active');

          INSERT OR IGNORE INTO user_store_access (id,client_id,user_id,store_id,role,created_at)
          SELECT 'USA-LEGACY-'||u.id,u.client_id,u.id,s.id,
                 CASE WHEN u.role='client' THEN 'owner' ELSE 'member' END,
                 datetime('now')
          FROM users u
          JOIN stores s ON s.client_id=u.client_id AND s.is_default=1 AND s.status='active'
          WHERE u.client_id IS NOT NULL AND trim(u.client_id)<>'';
          SQL
          echo "Seeded default stores: $(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM stores;')"
          echo "Seeded legacy user-store access rows: $(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM user_store_access;')"
      - name: Apply remaining Commerce OS migrations locally
        run: |
          set -euo pipefail
          for file in migrations/0012_*.sql migrations/0013_*.sql migrations/0014_*.sql migrations/0015_*.sql migrations/0016_*.sql migrations/0017_*.sql migrations/0018_*.sql migrations/0019_*.sql migrations/0020_*.sql migrations/0021_*.sql migrations/0022_*.sql; do
            echo "Applying locally: $file"
            sqlite3 /tmp/prod.db < "$file"
          done
      - name: Validate migrated Production snapshot locally
        run: |
          set -euo pipefail
          test "270" = "$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM orders;')"
          test "8" = "$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM users;')"
          test "97" = "$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM customers;')"
          test "11" = "$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM products;')"
          missing_orders="$(sqlite3 /tmp/prod.db "SELECT COUNT(*) FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL;")"
          missing_customers="$(sqlite3 /tmp/prod.db "SELECT COUNT(*) FROM customers WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL;")"
          missing_products="$(sqlite3 /tmp/prod.db "SELECT COUNT(*) FROM products WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL;")"
          missing_access="$(sqlite3 /tmp/prod.db "SELECT COUNT(*) FROM users u WHERE u.client_id IS NOT NULL AND trim(u.client_id)<>'' AND u.role<>'admin' AND NOT EXISTS (SELECT 1 FROM user_store_access a WHERE a.user_id=u.id AND a.client_id=u.client_id);")"
          test "$missing_orders" = 0
          test "$missing_customers" = 0
          test "$missing_products" = 0
          test "$missing_access" = 0
          for table in stores user_store_access store_connections integration_secrets order_events inventory_batches order_duplicate_links wallet_accounts; do
            test "$(sqlite3 /tmp/prod.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='$table';")" = 1
          done
          echo 'Migration rehearsal passed: legacy row counts preserved; all tenant rows mapped to stores; user access seeded; J&T/Commerce OS tables present.'
          echo "Post-migration seed state: stores=$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM stores;') tenant_settings=$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM tenant_settings;') wallet_accounts=$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM wallet_accounts;') store_connections=$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM store_connections;')"
      - name: Remove ephemeral snapshot
        if: always()
        run: rm -f /tmp/prod.sql /tmp/prod.db /tmp/export.log
