name: Cloudflare Production migration rehearsal
on:
  push:
    branches:
      - develop/ux-system-upgrade
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Export Production snapshot silently (remote read-only)
        run: |
          set -euo pipefail
          rm -f /tmp/prod.sql /tmp/prod.db /tmp/export.log
          if ! npx wrangler d1 export kunonline --remote --config wrangler.production.toml --output=/tmp/prod.sql >/tmp/export.log 2>&1; then
            echo 'Production export failed; output suppressed.'
            exit 1
          fi
          sqlite3 /tmp/prod.db < /tmp/prod.sql
          rm -f /tmp/prod.sql /tmp/export.log
          echo 'Ephemeral snapshot ready.'
      - name: Apply legacy-to-baseline bridge locally
        run: |
          set -euo pipefail
          sqlite3 /tmp/prod.db "ALTER TABLE chat_messages ADD COLUMN client_id TEXT;"
          echo 'Applied local bridge: chat_messages.client_id'
      - name: Rehearse all Commerce OS migrations locally
        run: |
          set -euo pipefail
          before_orders="$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM orders;')"
          before_users="$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM users;')"
          before_customers="$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM customers;')"
          before_products="$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM products;')"
          for file in migrations/*.sql; do
            echo "Applying locally: $file"
            if ! sqlite3 /tmp/prod.db < "$file"; then
              echo "LOCAL_MIGRATION_REHEARSAL_FAILED=$file"
              exit 1
            fi
          done
          test "$before_orders" = "$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM orders;')"
          test "$before_users" = "$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM users;')"
          test "$before_customers" = "$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM customers;')"
          test "$before_products" = "$(sqlite3 /tmp/prod.db 'SELECT COUNT(*) FROM products;')"
          echo "Legacy row counts preserved: orders=$before_orders users=$before_users customers=$before_customers products=$before_products"
          missing="$(sqlite3 /tmp/prod.db "SELECT group_concat(name, ',') FROM (SELECT 'stores' name UNION ALL SELECT 'wallet_accounts' UNION ALL SELECT 'integration_connections' UNION ALL SELECT 'inventory_batches' UNION ALL SELECT 'order_duplicate_links') req WHERE NOT EXISTS (SELECT 1 FROM sqlite_master s WHERE s.type='table' AND s.name=req.name);")"
          test -z "$missing"
          echo 'All key Commerce OS tables exist after local rehearsal.'
      - name: Remove ephemeral snapshot
        if: always()
        run: rm -f /tmp/prod.sql /tmp/prod.db /tmp/export.log
