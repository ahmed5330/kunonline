name: Cloudflare Preview creds -> Production D1 read-only probe
on:
  push:
    branches:
      - develop/ux-system-upgrade
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Show authorized Cloudflare account metadata
        run: npx wrangler whoami
      - name: Production D1 connectivity probe (SELECT-only)
        run: |
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT 1 AS ok;"
