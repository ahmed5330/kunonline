name: Cloudflare Preview creds -> Production D1 read-only probe
on:
  push:
    branches:
      - develop/ux-system-upgrade
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Production D1 connectivity probe (SELECT-only)
        run: npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT 1 AS ok;"
      - name: Production schema compatibility (SELECT-only)
        run: |
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT CASE WHEN EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='d1_migrations') THEN 1 ELSE 0 END AS has_d1_migrations;"
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT name, CASE WHEN EXISTS(SELECT 1 FROM sqlite_master s WHERE s.type='table' AND s.name=req.name) THEN 1 ELSE 0 END AS present FROM (SELECT 'stores' AS name UNION ALL SELECT 'wallet_accounts' UNION ALL SELECT 'integration_connections' UNION ALL SELECT 'inventory_batches' UNION ALL SELECT 'order_duplicate_links') req;"
      - name: Scan migrations for destructive SQL
        run: |
          set -euo pipefail
          echo '=== Potentially destructive migration statements ==='
          if grep -RniE '(^|[;[:space:]])(DROP[[:space:]]+TABLE|DROP[[:space:]]+COLUMN|DELETE[[:space:]]+FROM|TRUNCATE|ALTER[[:space:]]+TABLE[^;]*DROP|REPLACE[[:space:]]+INTO)' migrations/*.sql; then
            echo 'Potentially destructive statements found; review required.'
          else
            echo 'No DROP TABLE / DROP COLUMN / DELETE FROM / TRUNCATE / REPLACE INTO statements found.'
          fi
      - name: Export Production snapshot for ephemeral local rehearsal (read-only remote)
        run: |
          set -euo pipefail
          rm -f /tmp/kunonline-prod.sql /tmp/kunonline-rehearsal.db
          npx wrangler d1 export kunonline --remote --config wrangler.production.toml --output=/tmp/kunonline-prod.sql
          test -s /tmp/kunonline-prod.sql
          echo "Production snapshot exported for local-only rehearsal: $(wc -c </tmp/kunonline-prod.sql) bytes"
      - name: Rehearse all migrations locally against exact Production snapshot
        run: |
          set -euo pipefail
          sqlite3 /tmp/kunonline-rehearsal.db < /tmp/kunonline-prod.sql
          before_orders="$(sqlite3 /tmp/kunonline-rehearsal.db 'SELECT COUNT(*) FROM orders;')"
          before_users="$(sqlite3 /tmp/kunonline-rehearsal.db 'SELECT COUNT(*) FROM users;')"
          for file in migrations/*.sql; do
            echo "Applying locally: $file"
            if ! sqlite3 /tmp/kunonline-rehearsal.db < "$file"; then
              echo "LOCAL_MIGRATION_REHEARSAL_FAILED=$file"
              exit 1
            fi
          done
          after_orders="$(sqlite3 /tmp/kunonline-rehearsal.db 'SELECT COUNT(*) FROM orders;')"
          after_users="$(sqlite3 /tmp/kunonline-rehearsal.db 'SELECT COUNT(*) FROM users;')"
          test "$before_orders" = "$after_orders"
          test "$before_users" = "$after_users"
          echo "Local migration rehearsal succeeded. orders preserved=$after_orders users preserved=$after_users"
          echo '=== Rehearsed key tables ==='
          sqlite3 /tmp/kunonline-rehearsal.db "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('stores','wallet_accounts','integration_connections','inventory_batches','order_duplicate_links') ORDER BY name;"
      - name: Remove ephemeral Production snapshot
        if: always()
        run: rm -f /tmp/kunonline-prod.sql /tmp/kunonline-rehearsal.db
