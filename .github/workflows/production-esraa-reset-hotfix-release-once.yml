name: Production Esraa reset hotfix release once
on:
  push:
    branches: [release/commerce-v38-production-20260910]
    paths:
      - .github/workflows/production-esraa-reset-hotfix-release-once.yml
concurrency:
  group: kunonline-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Verify production resource isolation
        run: npm run check:production-config
      - name: Verify exact hotfix scope
        run: |
          set -euo pipefail
          base=ad9a49d1a8805d5c402bb512838e0e62db5f4c72
          git fetch origin "$base" --depth=1
          files="$(git diff --name-only "$base" HEAD | grep -v '^.github/workflows/production-esraa-reset-hotfix-release-once.yml$' || true)"
          expected=$'public/v2/index.html\npublic/v2/modules-v23-admin.js'
          test "$files" = "$expected"
          grep -q 'modules-v23-admin.js?v=23.4' public/v2/index.html
          grep -q "resetBtn.dataset.busy==='1'" public/v2/modules-v23-admin.js
          grep -q "event?.preventDefault?.()" public/v2/modules-v23-admin.js
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.kun-online.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Recheck production isolation
        run: npm run check:production-config
      - name: Deploy hotfix production Worker only
        run: npx wrangler deploy --config wrangler.production.toml
