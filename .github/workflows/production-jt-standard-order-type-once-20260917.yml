name: Deploy Production J&T standard order type once

on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: ['.github/workflows/production-jt-standard-order-type-once-20260917.yml']

permissions:
  contents: read

concurrency:
  group: kunonline-production-jt-standard-order-type-20260917
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_REF: release/commerce-v38-production-20260910
      EXPECTED_RELEASE_SHA: 94fa55474c410a82daec61ebf1c94b2bc4566095
      PROD_CUSTOM: https://app.kun-online.com
      PROD_WORKERS: https://kunonline.mr-a-mnaa.workers.dev
      EXPECTED_BUILD: production-commerce-v38-free-tier-safe-2026-09-10
    steps:
      - name: Checkout exact validated Production release
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate exact J&T payload and Production config
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          grep -Fq "orderType:'1'" src/jt-express-eg-api.js
          if grep -Fq "orderType:'2'" src/jt-express-eg-api.js; then echo 'Legacy J&T orderType 2 still present' >&2; exit 1; fi
          node --check src/jt-express-eg-api.js
          npm run check:production-config
          npx wrangler deploy --dry-run --config wrangler.production.toml
      - name: Verify Production D1 readiness read-only
        run: |
          set -euo pipefail
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS orders_total FROM orders; SELECT COUNT(*) AS shipped_orders FROM orders WHERE state='shipped';" --json > /tmp/d1.json
          node - <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8')),rows=[];const walk=x=>{if(Array.isArray(x))return x.forEach(walk);if(x&&typeof x==='object'){if(Array.isArray(x.results))rows.push(...x.results);Object.values(x).forEach(walk)}};walk(p);const total=Number(rows.find(x=>x.orders_total!=null)?.orders_total);if(!Number.isFinite(total)||total<1)throw new Error('Production orders unavailable');console.log(`Read-only D1 check passed: orders=${total}`);
          NODE
      - name: Capture current Production Worker version
        id: before
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.production.toml --json)"
          version="$(printf '%s' "$status" | node -e 'let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const root=JSON.parse(raw),hits=[];const walk=x=>{if(Array.isArray(x)){x.forEach(walk);return}if(!x||typeof x!=="object")return;const id=x.version_id||x.versionId,p=x.percentage??x.traffic_percentage??x.trafficPercentage;if(id)hits.push({id:String(id),p:p==null?null:Number(p)});Object.values(x).forEach(walk)};walk(root);const u=[...new Map(hits.map(x=>[x.id,x])).values()];const full=u.find(x=>x.p===100||x.p===1)||(u.length===1?u[0]:null);if(!full)process.exit(2);process.stdout.write(full.id)});')"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
      - name: Deploy Worker and assets only
        id: deploy
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --config wrangler.production.toml
      - name: Validate Production runtime on both hosts
        run: |
          set -euo pipefail
          for base in "$PROD_WORKERS" "$PROD_CUSTOM"; do
            ready=0
            for i in $(seq 1 30); do
              health="$(curl -sS -o /tmp/health -w '%{http_code}' "$base/health/easyorders-sync" || true)"
              v2="$(curl -sS -o /tmp/v2 -w '%{http_code}' "$base/v2/" || true)"
              auth="$(curl -sS -o /tmp/auth -w '%{http_code}' -X POST -H 'Content-Type: application/json' "$base/api/jt/shipments/KUN-NO-ORDER" --data '{}' || true)"
              build_ok=0
              if [ "$health" = "200" ] && EXPECTED_BUILD="$EXPECTED_BUILD" node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/health","utf8"));process.exit(p.ok===true&&p.build===process.env.EXPECTED_BUILD?0:1)' >/dev/null 2>&1; then build_ok=1; fi
              if [ "$build_ok" = "1" ] && [ "$v2" = "200" ] && [ "$auth" = "401" ] && node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/auth","utf8"));process.exit(p.code==="AUTH_REQUIRED"?0:1)' >/dev/null 2>&1; then ready=1; echo "Runtime verified on $base at attempt $i"; break; fi
              sleep 2
            done
            test "$ready" = "1"
          done
      - name: Roll back exact prior Worker if validation fails
        if: failure() && steps.deploy.outputs.attempted == 'true' && steps.before.outputs.version_id != ''
        run: |
          set -euo pipefail
          npx wrangler versions deploy "${{ steps.before.outputs.version_id }}@100%" --yes --config wrangler.production.toml --message "Automatic rollback after failed J&T standard order type deployment"
      - name: Clean temporary files
        if: always()
        run: rm -f /tmp/d1.json /tmp/health /tmp/v2 /tmp/auth
