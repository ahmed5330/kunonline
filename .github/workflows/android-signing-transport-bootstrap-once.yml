name: Android signing transport bootstrap once

on:
  push:
    branches:
      - fix/android-stable-signing-20260916
    paths:
      - '.github/workflows/android-signing-transport-bootstrap-once.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANDROID_SIGNING_MASTER: ${{ secrets.ANDROID_SIGNING_MASTER }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/android-stable-signing-20260916
      - name: Generate protected transport key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/signing
          if [ -s android/signing/transport-private.pem.enc ] && [ -s android/signing/transport-public.pem ]; then
            echo 'Transport key already exists; nothing to bootstrap.'
            exit 0
          fi
          SOURCE="${ANDROID_SIGNING_MASTER:-}"
          if [ -z "$SOURCE" ]; then SOURCE="$CLOUDFLARE_API_TOKEN"; fi
          test -n "$SOURCE"
          MASTER="$(printf '%s|kun-online-android-signing-v1' "$SOURCE" | sha256sum | awk '{print $1}')"
          export MASTER
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/transport-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/transport-private.pem -pubout -out android/signing/transport-public.pem
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in /tmp/transport-private.pem \
            -out android/signing/transport-private.pem.enc \
            -pass env:MASTER
          rm -f /tmp/transport-private.pem
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/signing/transport-public.pem android/signing/transport-private.pem.enc
          git commit -m 'Add protected Android signing transport key'
          git push origin HEAD:fix/android-stable-signing-20260916
