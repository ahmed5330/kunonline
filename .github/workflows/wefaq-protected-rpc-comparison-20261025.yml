name: Protected Wefaq cursor boundary comparison - read only data
on:
  push:
    branches: [codex/serialized-warehouse-operations]
    paths: ['.github/workflows/wefaq-protected-rpc-comparison-20261025.yml']
permissions:
  contents: read
concurrency:
  group: kunonline-wefaq-readonly-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate scope, range, caller source and metadata privacy offline
        run: |
          node scripts/wefaq-protected-rpc-comparison-test.mjs
          node scripts/wefaq-readonly-scope-inventory-test.mjs
      - name: Compare bounded cursor through next Short ID without order writes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KUN_AUDIT_RANGE_MODE: 'cursor-boundary'
          KUN_EXPECTED_PREVIEW_VERSION: '5805b5aa-71cd-4f44-a7bd-0b86e2675877'
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/wefaq-protected-rpc-comparison.mjs
      - name: Remove temporary read-only caller after success failure or cancellation
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/wefaq-protected-rpc-comparison.mjs --cleanup
# Only the expiring caller is deployed/deleted. Customer DB and provider
# operations are SELECT/GET-only; provider secrets remain inside the app.
