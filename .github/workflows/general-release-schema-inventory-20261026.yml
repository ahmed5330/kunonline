name: Protected general release schema metadata only
on:
  push:
    branches: [codex/serialized-warehouse-operations]
    paths: ['.github/workflows/general-release-schema-inventory-20261026.yml']
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --check scripts/general-release-schema-inventory.mjs
      - name: Inspect exact bound database column and trigger names without row data
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/general-release-schema-inventory.mjs
