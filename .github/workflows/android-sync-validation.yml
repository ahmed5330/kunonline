name: Android sync validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/mobile-state-sync.js'
      - 'scripts/mobile-state-sync-test.mjs'
      - '.github/workflows/android-sync-validation.yml'
permissions:
  contents: read
concurrency:
  group: android-sync-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/mobile-state-sync-test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test delta merges and build Android release
        working-directory: android
        run: gradle test assembleRelease
