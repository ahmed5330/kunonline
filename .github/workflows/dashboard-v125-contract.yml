name: Dashboard v125 Contract

on:
  pull_request:
    paths:
      - 'public/v2/modules-v125-dashboard-section-periods.js'
      - 'src/index-commerce-v38.js'
      - 'src/index-production-mobile-update.js'
      - 'scripts/dashboard-v125-contract-test.mjs'
      - '.github/workflows/dashboard-v125-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check dashboard v125 syntax
        run: node --check public/v2/modules-v125-dashboard-section-periods.js
      - name: Validate dashboard v125 contract
        run: node scripts/dashboard-v125-contract-test.mjs
