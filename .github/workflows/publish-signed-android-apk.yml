name: Publish stable-signed Android APK

on:
  push:
    branches: [main]
    paths:
      - 'public/downloads/Kun-Online-Mobile.apk'
      - '.github/workflows/publish-signed-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kunonline-signed-android-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify signed APK exists
        run: test -s public/downloads/Kun-Online-Mobile.apk
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -1)"
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"
      - name: Publish stable APK asset
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.name }}
        run: |
          set -euo pipefail
          gh release upload android-latest public/downloads/Kun-Online-Mobile.apk --clobber
          gh release edit android-latest \
            --target "$GITHUB_SHA" \
            --title "Kun Online Android v$APP_VERSION" \
            --notes "Stable-signed Kun Online Caller ID v$APP_VERSION. Future updates use the same signing identity."
      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view android-latest --json assets --jq '.assets[].name' | grep -Fxq 'Kun-Online-Mobile.apk'
