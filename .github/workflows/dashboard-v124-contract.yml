name: Dashboard v124 Contract

on:
  pull_request:
    paths:
      - 'public/v2/modules-v124-dashboard-periods-province.js'
      - 'src/index-commerce-v38.js'
      - 'src/index-production-mobile-update.js'
      - 'scripts/dashboard-v124-contract-test.mjs'
      - '.github/workflows/dashboard-v124-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check dashboard v124 syntax
        run: node --check public/v2/modules-v124-dashboard-periods-province.js
      - name: Validate dashboard v124 contract
        run: node scripts/dashboard-v124-contract-test.mjs
