name: Fix J&T standard order type once

on:
  push:
    branches: [fix/jt-standard-order-type-unprinted-20260917]
    paths: ['.github/workflows/fix-jt-standard-order-type-once.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/jt-standard-order-type-unprinted-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Apply documented standard J&T order type
        run: |
          set -euo pipefail
          file=src/jt-express-eg-api.js
          count="$(grep -o "orderType:'2'" "$file" | wc -l | tr -d ' ')"
          test "$count" = "1"
          python - <<'PY'
          from pathlib import Path
          p=Path('src/jt-express-eg-api.js')
          s=p.read_text()
          old="orderType:'2'"
          new="orderType:'1'"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          grep -Fq "orderType:'1'" "$file"
          node --check "$file"
      - name: Run J&T and system tests
        run: |
          npm test
          npm run check:production-config
          npx wrangler deploy --dry-run --config wrangler.production.toml
      - name: Commit validated source change
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/jt-express-eg-api.js
          git commit -m "Use standard J&T order type for shipment creation"
          git push origin HEAD:fix/jt-standard-order-type-unprinted-20260917
