name: Backfill Production store scope and restore v2 once

on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: ['.github/workflows/production-v2-backfill-and-restore-once-20260916.yml']

concurrency:
  group: kunonline-production-v2-backfill-restore-20260916
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_REF: release/commerce-v38-production-20260910
      EXPECTED_RELEASE_SHA: 21e440deb6351c6850fa51314ce2d62d3d219e86
      EXPECTED_BUILD: production-commerce-v38-free-tier-safe-2026-09-10
      PROD_CUSTOM: https://app.kun-online.com
      PROD_WORKERS: https://kunonline.mr-a-mnaa.workers.dev
    steps:
      - name: Checkout exact approved release
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm install --ignore-scripts

      - name: Validate approved release locally
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          grep -Fq "import app from './index-commerce-v38.js';" src/index-production-sync.js
          grep -Fq "const BUILD='$EXPECTED_BUILD';" src/index-production-sync.js
          test -s public/v2/index.html
          node --check src/index-production-sync.js
          node --check src/index-commerce-v38.js
          npm run check:production-config
          npx wrangler deploy --dry-run --config wrangler.production.toml >/tmp/prod-dry-run.log 2>&1
          rm -f /tmp/prod-dry-run.log

      - name: Preflight Production store mapping read-only
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS total_orders FROM orders; SELECT COUNT(*) AS total_customers FROM customers; SELECT COUNT(*) AS total_products FROM products; SELECT COUNT(*) AS unmapped_orders FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL; SELECT COUNT(*) AS unmapped_customers FROM customers WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL; SELECT COUNT(*) AS unmapped_products FROM products WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL; SELECT COUNT(*) AS no_target_orders FROM orders o WHERE o.client_id IS NOT NULL AND trim(o.client_id)<>'' AND o.store_id IS NULL AND NOT EXISTS (SELECT 1 FROM stores s WHERE s.client_id=o.client_id AND s.status='active'); SELECT COUNT(*) AS no_target_customers FROM customers c WHERE c.client_id IS NOT NULL AND trim(c.client_id)<>'' AND c.store_id IS NULL AND NOT EXISTS (SELECT 1 FROM stores s WHERE s.client_id=c.client_id AND s.status='active'); SELECT COUNT(*) AS no_target_products FROM products p WHERE p.client_id IS NOT NULL AND trim(p.client_id)<>'' AND p.store_id IS NULL AND NOT EXISTS (SELECT 1 FROM stores s WHERE s.client_id=p.client_id AND s.status='active'); SELECT COUNT(*) AS null_customer_duplicate_groups FROM (SELECT client_id,phone,COUNT(*) AS n FROM customers WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL GROUP BY client_id,phone HAVING COUNT(*)>1); SELECT COUNT(*) AS customer_existing_collisions FROM customers c WHERE c.client_id IS NOT NULL AND trim(c.client_id)<>'' AND c.store_id IS NULL AND EXISTS (SELECT 1 FROM customers c2 WHERE c2.id<>c.id AND c2.client_id=c.client_id AND c2.phone=c.phone AND c2.store_id=(SELECT id FROM stores s WHERE s.client_id=c.client_id AND s.status='active' ORDER BY s.is_default DESC,s.created_at,id LIMIT 1));" --json)"
          printf '%s' "$result" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const p=JSON.parse(raw),rows=[];const walk=x=>{if(Array.isArray(x))return x.forEach(walk);if(x&&typeof x==="object"){if(Array.isArray(x.results))rows.push(...x.results);Object.values(x).forEach(walk)}};walk(p);const get=k=>Number(rows.find(x=>x[k]!=null)?.[k]);const totals={orders:get("total_orders"),customers:get("total_customers"),products:get("total_products")};const gaps={orders:get("unmapped_orders"),customers:get("unmapped_customers"),products:get("unmapped_products")};const noTargets=[get("no_target_orders"),get("no_target_customers"),get("no_target_products")];const dup=get("null_customer_duplicate_groups"),collisions=get("customer_existing_collisions");for(const [k,v] of Object.entries(totals))if(!Number.isFinite(v)||v<0)throw new Error(`Invalid total ${k}=${v}`);if(Object.values(gaps).every(v=>v===0))throw new Error("No store-scope gap remains; refusing unnecessary write");if(noTargets.some(v=>v!==0))throw new Error(`Missing active target store: orders=${noTargets[0]} customers=${noTargets[1]} products=${noTargets[2]}`);if(dup!==0||collisions!==0)throw new Error(`Customer uniqueness risk: null_duplicate_groups=${dup} existing_collisions=${collisions}`);console.log(`Preflight passed: gaps orders=${gaps.orders}, customers=${gaps.customers}, products=${gaps.products}; every target is resolvable.`);for(const [k,v] of Object.entries(totals))console.log(`TOTAL_${k.toUpperCase()}=${v}`);});' >/tmp/preflight.txt
          cat /tmp/preflight.txt
          for key in ORDERS CUSTOMERS PRODUCTS; do
            value="$(sed -nE "s/^TOTAL_${key}=([0-9]+)$/\1/p" /tmp/preflight.txt | tail -1)"
            test -n "$value"
            echo "total_${key,,}=$value" >> "$GITHUB_OUTPUT"
          done
          rm -f /tmp/preflight.txt

      - name: Capture exact current Production Worker version
        id: before
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.production.toml --json)"
          version="$(printf '%s' "$status" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const root=JSON.parse(raw),hits=[];const walk=x=>{if(Array.isArray(x)){x.forEach(walk);return}if(!x||typeof x!=="object")return;const id=x.version_id||x.versionId,p=x.percentage??x.traffic_percentage??x.trafficPercentage;if(id)hits.push({id:String(id),p:p==null?null:Number(p)});Object.values(x).forEach(walk)};walk(root);const u=[...new Map(hits.map(x=>[x.id,x])).values()];const full=u.find(x=>x.p===100||x.p===1)||(u.length===1?u[0]:null);if(!full)process.exit(2);process.stdout.write(full.id)});')"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
          echo 'Captured pre-repair Production Worker version.'

      - name: Backfill only missing store_id values in core scoped tables
        id: backfill
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "UPDATE orders SET store_id=(SELECT id FROM stores s WHERE s.client_id=orders.client_id AND s.status='active' ORDER BY s.is_default DESC,s.created_at,id LIMIT 1) WHERE store_id IS NULL AND client_id IS NOT NULL AND trim(client_id)<>''; UPDATE customers SET store_id=(SELECT id FROM stores s WHERE s.client_id=customers.client_id AND s.status='active' ORDER BY s.is_default DESC,s.created_at,id LIMIT 1) WHERE store_id IS NULL AND client_id IS NOT NULL AND trim(client_id)<>''; UPDATE products SET store_id=(SELECT id FROM stores s WHERE s.client_id=products.client_id AND s.status='active' ORDER BY s.is_default DESC,s.created_at,id LIMIT 1) WHERE store_id IS NULL AND client_id IS NOT NULL AND trim(client_id)<>'';" >/tmp/backfill.log 2>&1
          rm -f /tmp/backfill.log

      - name: Verify backfill preserved rows and closed all core mapping gaps
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS total_orders FROM orders; SELECT COUNT(*) AS total_customers FROM customers; SELECT COUNT(*) AS total_products FROM products; SELECT COUNT(*) AS unmapped_orders FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL; SELECT COUNT(*) AS unmapped_customers FROM customers WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL; SELECT COUNT(*) AS unmapped_products FROM products WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL;" --json)"
          BEFORE_ORDERS='${{ steps.preflight.outputs.total_orders }}' BEFORE_CUSTOMERS='${{ steps.preflight.outputs.total_customers }}' BEFORE_PRODUCTS='${{ steps.preflight.outputs.total_products }}' node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const p=JSON.parse(raw),rows=[];const walk=x=>{if(Array.isArray(x))return x.forEach(walk);if(x&&typeof x==="object"){if(Array.isArray(x.results))rows.push(...x.results);Object.values(x).forEach(walk)}};walk(p);const get=k=>Number(rows.find(x=>x[k]!=null)?.[k]);for(const k of ["orders","customers","products"]){const now=get(`total_${k}`),before=Number(process.env[`BEFORE_${k.toUpperCase()}`]),gap=get(`unmapped_${k}`);if(now!==before)throw new Error(`${k} row count changed: before=${before} after=${now}`);if(gap!==0)throw new Error(`${k} unmapped remain=${gap}`);}console.log("Backfill verified: all row counts preserved and core mapping gaps are zero.");});' <<<"$result"

      - name: Deploy approved Commerce v38 Worker and v2 assets only
        id: deploy
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --config wrangler.production.toml

      - name: Validate Production v2 and build on both hosts
        run: |
          set -euo pipefail
          for base in "$PROD_WORKERS" "$PROD_CUSTOM"; do
            ready=0
            for i in $(seq 1 35); do
              health="$(curl -sS -o /tmp/health -w '%{http_code}' "$base/health/easyorders-sync" || true)"
              v2="$(curl -sS -o /tmp/v2 -w '%{http_code}' "$base/v2/" || true)"
              build_ok=0
              if [ "$health" = "200" ] && EXPECTED_BUILD="$EXPECTED_BUILD" node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/health","utf8"));process.exit(p.ok===true&&p.build===process.env.EXPECTED_BUILD?0:1)' >/dev/null 2>&1; then build_ok=1; fi
              if [ "$build_ok" = "1" ] && [ "$v2" = "200" ] && grep -Eqi '<!DOCTYPE html|<html' /tmp/v2; then
                ready=1
                echo "Production v2 ready on $base at attempt $i."
                break
              fi
              sleep 2
            done
            test "$ready" = "1"
          done

      - name: Validate protected J&T route without creating shipment
        run: |
          set -euo pipefail
          for base in "$PROD_WORKERS" "$PROD_CUSTOM"; do
            code="$(curl -sS -o /tmp/jt -w '%{http_code}' -X POST -H 'Content-Type: application/json' "$base/api/jt/shipments/KUN-SMOKE-NO-ORDER" --data '{}' || true)"
            test "$code" = "401"
            node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/jt","utf8"));if(p.code!=="AUTH_REQUIRED")process.exit(2);'
          done

      - name: Final Production core store-scope invariant
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT COUNT(*) AS unmapped_orders FROM orders WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL; SELECT COUNT(*) AS unmapped_customers FROM customers WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL; SELECT COUNT(*) AS unmapped_products FROM products WHERE client_id IS NOT NULL AND trim(client_id)<>'' AND store_id IS NULL;" --json)"
          printf '%s' "$result" | node -e 'let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{const p=JSON.parse(raw),rows=[];const walk=x=>{if(Array.isArray(x))return x.forEach(walk);if(x&&typeof x==="object"){if(Array.isArray(x.results))rows.push(...x.results);Object.values(x).forEach(walk)}};walk(p);for(const k of ["unmapped_orders","unmapped_customers","unmapped_products"]){const n=Number(rows.find(x=>x[k]!=null)?.[k]);if(n!==0)throw new Error(`${k}=${n}`);}console.log("Final core store-scope invariant passed.");});'

      - name: Roll back exact prior Worker if runtime validation fails
        if: failure() && steps.deploy.outputs.attempted == 'true' && steps.before.outputs.version_id != ''
        run: |
          set -euo pipefail
          npx wrangler versions deploy "${{ steps.before.outputs.version_id }}@100%" --yes --config wrangler.production.toml --message "Automatic rollback after failed Production v2 restore"
          echo 'Previous Production Worker restored. The safe core store_id backfill remains applied.'

      - name: Clean temporary files
        if: always()
        run: rm -f /tmp/prod-dry-run.log /tmp/health /tmp/v2 /tmp/jt /tmp/backfill.log /tmp/preflight.txt
