name: Diagnose Android WebView v2 HTTP

on:
  push:
    branches: [diag/webview-v2-http-20260916]
    paths: ['.github/workflows/diag-webview-v2-http.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare custom domain and Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Linux; Android 14; SM-A135F Build/UP1A.231005.007; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/140.0.0.0 Mobile Safari/537.36'
          for base in 'https://app.kun-online.com' 'https://kunonline.mr-a-mnaa.workers.dev'; do
            echo "##### BASE=$base #####"
            for path in '/' '/v2' '/v2/' '/health/easyorders-sync' '/healthz'; do
              url="$base$path"
              echo "=== $url ==="
              curl -sS -L -A "$UA" -o /tmp/body -D /tmp/headers -w 'status=%{http_code} final=%{url_effective} type=%{content_type} bytes=%{size_download}\n' "$url" || true
              sed -n '1,12p' /tmp/headers
              printf 'sha256='; sha256sum /tmp/body | awk '{print $1}'
              echo "body_head=$(head -c 180 /tmp/body | tr '\n' ' ')"
              echo
            done
          done
