name: Isolated read-only client login diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/esraa-prod-readonly-worker-once.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DIAG_NAME: kunonline-client-login-readonly-20260915
      DIAG_URL: https://kunonline-client-login-readonly-20260915.mr-a-mnaa.workers.dev
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Create read-only diagnostic Worker
        run: |
          set -euo pipefail
          cat > /tmp/diag-worker.mjs <<'JS'
          const json=(data,status=200)=>new Response(JSON.stringify(data),{status,headers:{'content-type':'application/json; charset=utf-8','cache-control':'no-store'}});
          const mask=email=>{const [l='',d='']=String(email||'').toLowerCase().split('@');return `${l.slice(0,2)}***@${d}`};
          export default {async fetch(request,env){
            const url=new URL(request.url);
            if(request.method!=='GET'||url.pathname!=='/status') return json({error:'not_found'},404);
            const {results=[]}=await env.DB.prepare(`
              SELECT u.id,u.email,u.role,u.status,u.client_id,u.created_at,u.last_login,
                     COALESCE(l.fails,0) AS fails,l.locked_until
              FROM users u
              LEFT JOIN login_attempts l ON lower(l.email)=lower(u.email)
              WHERE u.role='client' AND lower(u.email) LIKE 'esraa%@gmail.com'
              ORDER BY u.created_at,u.id
            `).all();
            const accounts=[];
            for(const r of results){
              const roleCount=await env.DB.prepare("SELECT COUNT(*) AS n FROM users WHERE client_id=? AND role='client'").bind(r.client_id).first();
              const reset=await env.DB.prepare("SELECT COUNT(*) AS n,MAX(created_at) AS latest FROM audit_log WHERE action='platform.client.password_reset' AND client_id=?").bind(r.client_id).first();
              accounts.push({maskedEmail:mask(r.email),role:r.role,status:r.status,clientId:r.client_id||null,createdAt:r.created_at||null,lastLogin:r.last_login||null,failedAttempts:Number(r.fails||0),lockedUntil:r.locked_until||null,clientRoleCount:Number(roleCount?.n||0),resetCount:Number(reset?.n||0),latestResetAt:reset?.latest||null});
            }
            return json({ok:true,matched:accounts.length,accounts});
          }};
          JS
          cat > /tmp/wrangler-diag.toml <<'TOML'
          name = "kunonline-client-login-readonly-20260915"
          main = "/tmp/diag-worker.mjs"
          compatibility_date = "2026-08-23"
          workers_dev = true
          [[d1_databases]]
          binding = "DB"
          database_name = "kunonline"
          database_id = "c426601d-182f-486e-a5c1-bb1bca0ecb0b"
          TOML
          node --check /tmp/diag-worker.mjs
          ! grep -Eq '\b(UPDATE|DELETE|INSERT|REPLACE|DROP|ALTER|CREATE)\b' /tmp/diag-worker.mjs
          ! grep -Fq 'u.password' /tmp/diag-worker.mjs
          ! grep -Fq 'SELECT password' /tmp/diag-worker.mjs
      - name: Install Wrangler
        run: npm install --no-save wrangler@4.125.0
      - name: Deploy isolated read-only Worker
        run: npx wrangler deploy --config /tmp/wrangler-diag.toml --message "Read-only client login diagnostic"
      - name: Read masked client state
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error -o /tmp/status.json -w '%{http_code}' "$DIAG_URL/status?ts=$(date +%s%N)" || true)"
            if [ "$code" = "200" ] && grep -Fq '"ok":true' /tmp/status.json; then ready=1; break; fi
            sleep 2
          done
          cat /tmp/status.json || true
          test "$ready" -eq 1
