name: Session revocation contract
on:
  pull_request:
  push:
    branches: [codex/session-canonical-20261024]
permissions:
  contents: read
jobs:
  isolated-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --experimental-loader ./scripts/session-test-cloudflare-loader.mjs scripts/session-revocation-test.mjs
      - run: node scripts/session-logout-ui-test.mjs
      - run: node tests.mjs
      - run: node scripts/auth-status-test.mjs
      - run: node scripts/access-control-test.mjs
      - run: node scripts/store-sql-integration-test.mjs
      - run: node scripts/onboarding-buttons-test.mjs
      - run: node scripts/faos-accounting-qa-test.mjs
      - run: node scripts/faos-api-isolation-test.mjs
      - run: node scripts/faos-reconciliation-test.mjs
      - run: node scripts/faos-event-projection-test.mjs
      - run: node scripts/faos-operational-sql-test.mjs
