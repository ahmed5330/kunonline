name: Production D1 read-only diagnostic v2
on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: [.github/workflows/production-d1-readonly-diagnostic-v2.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/commerce-v38-production-20260910
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Inspect legacy J&T state structure only
        run: |
          set -euo pipefail
          q(){
            local sql="$1"
            for i in 1 2 3 4 5; do
              if npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "$sql" --json; then return 0; fi
              sleep $((i*2))
            done
            return 1
          }
          echo '=== state rows ==='
          q "SELECT id,length(json) AS json_length,updated_at FROM state ORDER BY id;"
          echo '=== J&T-related JSON keys/paths only; no values ==='
          q "SELECT DISTINCT j.fullkey,j.key,j.type FROM state s,json_tree(s.json) j WHERE lower(CAST(j.key AS TEXT)) LIKE '%jt%' OR lower(CAST(j.key AS TEXT)) LIKE '%j&t%' OR lower(CAST(j.key AS TEXT)) LIKE '%customer_code%' OR lower(CAST(j.key AS TEXT)) LIKE '%customerpassword%' OR lower(CAST(j.key AS TEXT)) LIKE '%customer_password%' OR lower(CAST(j.key AS TEXT)) LIKE '%source_code%' OR lower(CAST(j.key AS TEXT)) LIKE '%private_key%' OR lower(CAST(j.key AS TEXT)) LIKE '%api_account%' ORDER BY j.fullkey LIMIT 200;"
          echo '=== top-level and client object key names only ==='
          q "SELECT DISTINCT j.path,j.key,j.type FROM state s,json_tree(s.json) j WHERE j.type IN ('object','array') AND (j.path='$' OR j.path LIKE '$.clients%') ORDER BY j.path,j.key LIMIT 250;"
