name: Production D1 read-only diagnostic v2
on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: [.github/workflows/production-d1-readonly-diagnostic-v2.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/commerce-v38-production-20260910
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Inspect J&T connection and saved secret names only
        run: |
          set -euo pipefail
          q(){
            local sql="$1"
            for i in 1 2 3 4 5; do
              if npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "$sql" --json; then return 0; fi
              sleep $((i*2))
            done
            return 1
          }
          echo '=== J&T connection rows (no secret values) ==='
          q "SELECT id,client_id,provider,status,external_store_id,CASE WHEN last_error IS NULL OR trim(last_error)='' THEN 0 ELSE 1 END AS has_last_error FROM store_connections WHERE lower(provider) LIKE '%jt%' OR lower(provider) LIKE '%j&t%' ORDER BY updated_at DESC;"
          echo '=== Saved secret names for J&T-linked connections (names only) ==='
          q "SELECT s.connection_id,s.secret_name,CASE WHEN length(COALESCE(s.ciphertext_b64,''))>0 THEN 1 ELSE 0 END AS has_ciphertext FROM integration_secrets s JOIN store_connections c ON c.id=s.connection_id AND c.client_id=s.client_id WHERE lower(c.provider) LIKE '%jt%' OR lower(c.provider) LIKE '%j&t%' ORDER BY s.connection_id,s.secret_name;"
          echo '=== All provider ids, counts only ==='
          q "SELECT provider,COUNT(*) AS connections FROM store_connections GROUP BY provider ORDER BY provider;"
          echo '=== Source locations that write integration_secrets ==='
          grep -RIn "integration_secrets" src --include='*.js' | grep -E "INSERT|UPDATE|DELETE|prepare" | head -80 || true
