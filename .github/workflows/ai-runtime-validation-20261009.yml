name: Workers AI one-time runtime verification
on:
  push:
    branches:
      - qa/ai-runtime-validation-20261009
permissions:
  contents: read
jobs:
  model-inference:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 5
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm model is wired and code is syntactically valid
        run: |
          node --check src/ai-marketing-analyst.js
          node --check public/v2/modules-v138-ai-marketing.js
          node scripts/ai-marketing-test.mjs
          grep -Fq '[ai]' wrangler.preview.toml
          grep -Fq 'binding = "AI"' wrangler.preview.toml
      - name: Execute a real Cloudflare Workers AI inference without merchant data
        run: |
          node --input-type=module <<'NODE'
          const account=process.env.CF_ACCOUNT,token=process.env.CF_TOKEN;
          if(!account||!token)throw Error('Cloudflare secrets missing for runtime validation');
          const model='@cf/meta/llama-3.1-8b-instruct-fp8';
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/ai/run/'+model;
          const controller=new AbortController();
          const timeout=setTimeout(()=>controller.abort(),20000);
          let response;
          try {
            response=await fetch(url,{method:'POST',signal:controller.signal,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:'You are testing deployment readiness. Reply with one short word only.'},{role:'user',content:'Say READY.'}],temperature:0,max_tokens:32})});
          }finally{clearTimeout(timeout)}
          const json=await response.json().catch(()=>null);
          if(!response.ok||json?.success===false){
            const codes=(json?.errors||[]).map(e=>Number(e.code)||'unknown').join(',');
            throw Error('Live Workers AI provider probe failed, HTTP '+response.status+'; provider error codes '+codes+' (response omitted to avoid secrets)');
          }
          const answer=json?.result?.response;
          if(typeof answer!=='string'||!answer.trim())throw Error('Workers AI returned empty response; runtime not verified');
          console.log('Real Workers AI model inference SUCCESS, model '+model+', answer length '+answer.length+'. No merchant data used.');
          NODE
