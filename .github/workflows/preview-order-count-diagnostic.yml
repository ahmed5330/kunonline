name: Preview Easy Orders business-date repair

on:
  push:
    branches:
      - develop/ux-system-upgrade
    paths:
      - .github/workflows/preview-order-count-diagnostic.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - name: Repair Easy Orders business dates in Preview D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_D1_ID: 31cd5cdf-fc01-42d7-ba1e-571f3dd58495
        run: |
          node <<'NODE'
          const accountId=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const databaseId=process.env.PREVIEW_D1_ID;
          if(!accountId||!token||!databaseId) throw new Error('Missing Preview repair credentials');
          if(databaseId!=='31cd5cdf-fc01-42d7-ba1e-571f3dd58495') throw new Error('Refusing to run outside the pinned Preview D1 database');
          const url=`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${databaseId}/query`;
          async function d1(sql,params=[]){
            const r=await fetch(url,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});
            const p=await r.json();
            const x=p?.result?.[0];
            if(!r.ok||p.success===false||x?.success===false) throw new Error(`D1 query failed: ${JSON.stringify(p?.errors||x?.error||p).slice(0,1000)}`);
            return {rows:x?.results||[],changes:Number(x?.meta?.changes||0)};
          }
          function cairoDate(value){
            const d=new Date(value);if(Number.isNaN(d.getTime()))return null;
            const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),g=t=>parts.find(x=>x.type===t)?.value||'';
            return `${g('year')}-${g('month')}-${g('day')}`;
          }
          const today=cairoDate(new Date());
          const before=(await d1(`SELECT s.client_id,s.id store_id,s.name store_name,COUNT(o.id) canonical_today
            FROM stores s LEFT JOIN orders o ON o.client_id=s.client_id AND o.store_id=s.id
              AND date(COALESCE(o.date,o.created_at))=date(?)
              AND NOT EXISTS (SELECT 1 FROM order_duplicate_links d WHERE d.duplicate_order_id=o.id)
            WHERE s.status='active' GROUP BY s.client_id,s.id,s.name ORDER BY canonical_today DESC`,[today])).rows;
          const source='المتجر (Easy Orders)';
          const orders=(await d1(`SELECT id,client_id,store_id,date,created_at FROM orders WHERE source=? AND created_at LIKE '____-__-__T%' ORDER BY created_at`,[source])).rows;
          const corrected=[];
          for(const order of orders){
            const expected=cairoDate(order.created_at);if(!expected||expected===order.date)continue;
            const result=await d1('UPDATE orders SET date=? WHERE id=? AND client_id=? AND source=?',[expected,order.id,order.client_id,source]);
            if(result.changes===1)corrected.push({id:order.id,store_id:order.store_id,from:order.date,to:expected});
          }
          const after=(await d1(`SELECT s.client_id,s.id store_id,s.name store_name,COUNT(o.id) canonical_today
            FROM stores s LEFT JOIN orders o ON o.client_id=s.client_id AND o.store_id=s.id
              AND date(COALESCE(o.date,o.created_at))=date(?)
              AND NOT EXISTS (SELECT 1 FROM order_duplicate_links d WHERE d.duplicate_order_id=o.id)
            WHERE s.status='active' GROUP BY s.client_id,s.id,s.name ORDER BY canonical_today DESC`,[today])).rows;
          const previous=new Map(before.map(x=>[`${x.client_id}:${x.store_id}`,Number(x.canonical_today)||0]));
          const changedStores=after.map(x=>({...x,before:previous.get(`${x.client_id}:${x.store_id}`)||0,after:Number(x.canonical_today)||0})).filter(x=>x.before!==x.after);
          console.log('PREVIEW_BUSINESS_DATE_REPAIR='+JSON.stringify({today,scanned:orders.length,corrected:corrected.length,changedStores,correctedOrders:corrected}));
          NODE
