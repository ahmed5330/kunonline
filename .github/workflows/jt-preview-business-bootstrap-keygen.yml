name: J&T Preview encrypted business bootstrap keygen
on:
  push:
    branches: [develop/ux-system-upgrade]
    paths: [.github/run-jt-preview-business-bootstrap-keygen.txt]
permissions:
  contents: read
jobs:
  keygen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Generate one-time encrypted transport key
        shell: bash
        run: |
          node - <<'NODE'
          const crypto=require('crypto');
          const {webcrypto,randomBytes,createHash}=crypto;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw new Error('Preview transport secret is unavailable');
          const b64=b=>Buffer.from(b).toString('base64url');
          (async()=>{
            const pair=await webcrypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
            const publicSpki=await webcrypto.subtle.exportKey('spki',pair.publicKey);
            const privatePkcs8=await webcrypto.subtle.exportKey('pkcs8',pair.privateKey);
            const wrapRaw=createHash('sha256').update(`kun-jt-preview-bootstrap-v1:${token}`).digest();
            const wrapKey=await webcrypto.subtle.importKey('raw',wrapRaw,{name:'AES-GCM'},false,['encrypt']);
            const iv=randomBytes(12);
            const wrapped=await webcrypto.subtle.encrypt({name:'AES-GCM',iv},wrapKey,privatePkcs8);
            const bundle={v:1,keyId:randomBytes(12).toString('hex'),issuedAt:new Date().toISOString(),publicSpkiB64:b64(publicSpki),wrappedPrivateB64:b64(wrapped),wrapIvB64:b64(iv)};
            console.log('JT_BOOTSTRAP_KEY_BUNDLE='+Buffer.from(JSON.stringify(bundle)).toString('base64url'));
          })().catch(()=>{console.error('J&T bootstrap key generation failed');process.exit(1)});
          NODE