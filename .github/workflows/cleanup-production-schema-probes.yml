name: Cleanup temporary Production schema probes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-production-schema-probes.yml
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Delete temporary schema probe Workers only
        shell: bash
        run: |
          set -euo pipefail
          for worker in kunonline-schema-34488177041 kunonline-schema-34488410793; do
            code="$(curl --silent --show-error -o "/tmp/${worker}.json" -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker" || true)"
            if [ "$code" = "200" ] || [ "$code" = "404" ]; then
              echo "$worker cleaned (HTTP $code)"
            else
              echo "Could not clean $worker (HTTP $code)"
              cat "/tmp/${worker}.json" || true
              exit 1
            fi
          done
