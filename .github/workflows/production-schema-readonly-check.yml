name: Production schema compatibility read-only
on:
  push:
    branches:
      - release/easyorders-prod-sync-20260831
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Verify target is Production D1
        run: |
          grep -q 'database_name = "kunonline"' wrangler.production.toml
          grep -q 'APP_ENV = "production"' wrangler.production.toml
      - name: Read Production schema only
        run: |
          echo '=== Production tables ==='
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
          echo '=== D1 migration ledger presence ==='
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT CASE WHEN EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='d1_migrations') THEN 1 ELSE 0 END AS has_d1_migrations;"
          echo '=== Commerce OS key-table compatibility ==='
          npx wrangler d1 execute kunonline --remote --config wrangler.production.toml --command "SELECT name, CASE WHEN EXISTS(SELECT 1 FROM sqlite_master s WHERE s.type='table' AND s.name=req.name) THEN 1 ELSE 0 END AS present FROM (SELECT 'stores' AS name UNION ALL SELECT 'wallet_accounts' UNION ALL SELECT 'integration_connections' UNION ALL SELECT 'inventory_batches' UNION ALL SELECT 'order_duplicate_links') req;"
