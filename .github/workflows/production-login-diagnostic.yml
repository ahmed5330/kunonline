name: Production login read-only diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-login-diagnostic.yml'
      - 'src/index-production-login-diagnostic.js'
      - 'wrangler.production-login-diagnostic.toml'

permissions:
  contents: read

concurrency:
  group: kunonline-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://app.kun-online.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://app.kun-online.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate diagnostic wrapper is read-only
        run: |
          set -euo pipefail
          node --check src/index-production-login-diagnostic.js
          ! grep -E 'UPDATE |INSERT |DELETE |DROP |ALTER |CREATE TABLE|wrangler d1' src/index-production-login-diagnostic.js
      - name: Capture current Production Worker version
        id: previous
        run: |
          set -euo pipefail
          status="$(npx wrangler deployments status --config wrangler.production.toml --json)"
          version="$(printf '%s' "$status" | node -e '
            let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{
              const root=JSON.parse(raw),hits=[];
              const walk=x=>{if(Array.isArray(x)){for(const v of x)walk(v);return;}if(!x||typeof x!=="object")return;
                const id=x.version_id||x.versionId,pct=x.percentage??x.traffic_percentage??x.trafficPercentage;
                if(id)hits.push({id:String(id),pct:pct==null?null:Number(pct)});for(const v of Object.values(x))walk(v);};
              walk(root);const unique=[...new Map(hits.map(x=>[x.id,x])).values()];
              const full=unique.find(x=>x.pct===100||x.pct===1)||(unique.length===1?unique[0]:null);
              if(!full)process.exit(2);process.stdout.write(full.id);
            });')"
          test -n "$version"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
      - name: Install ephemeral diagnostic secret
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "LOGIN_DIAG_TOKEN=$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | npx wrangler secret put LOGIN_DIAGNOSTIC_TOKEN --name kunonline
      - name: Deploy delegating read-only login diagnostic
        run: npx wrangler deploy --config wrangler.production-login-diagnostic.toml --message "Temporary read-only login schema diagnostic"
      - name: Read sanitized login schema evidence
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 20); do
            code="$(curl --silent --show-error -o /tmp/login-diag.json -w '%{http_code}' -H "X-Kun-Diagnostic-Token: $LOGIN_DIAG_TOKEN" "$BASE_URL/__internal/login-schema-diagnostic" || true)"
            if [ "$code" = "200" ]; then ready=1; break; fi
            echo "Waiting for login diagnostic route: HTTP $code attempt=$attempt/20"
            sleep 2
          done
          test "$ready" -eq 1
          cat /tmp/login-diag.json
          echo
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/login-diag.json','utf8')); if(!x.ok||!x.readOnly) process.exit(1);"
      - name: Restore official Production and remove diagnostic secret
        if: always()
        run: |
          set -u
          restored=0
          if npx wrangler deploy --config wrangler.production.toml --message "Restore official Production after login diagnostic"; then
            restored=1
          elif [ -n "${{ steps.previous.outputs.version_id }}" ] && npx wrangler versions deploy "${{ steps.previous.outputs.version_id }}@100%" --yes --config wrangler.production.toml --message "Fallback restore after login diagnostic"; then
            restored=1
          fi
          current="$(npx wrangler secret list --name kunonline 2>&1 || true)"
          if printf '%s' "$current" | grep -Fq 'LOGIN_DIAGNOSTIC_TOKEN'; then printf 'y\n' | npx wrangler secret delete LOGIN_DIAGNOSTIC_TOKEN --name kunonline || true; fi
          test "$restored" -eq 1
      - name: Verify diagnostic route closed
        if: always()
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/closed.json -w '%{http_code}' "$BASE_URL/__internal/login-schema-diagnostic" || true)"
          test "$code" = "404"
