# إعدادات النشر على Cloudflare — Preview environment

name = "kunonline-preview"
main = "src/index-commerce-v2.js"
compatibility_date = "2026-05-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "kunonline-preview"
database_id = "31cd5cdf-fc01-42d7-ba1e-571f3dd58495"

[triggers]
crons = ["0 */2 * * *"]

[vars]
TRACKING_PROVIDER = "track123"
