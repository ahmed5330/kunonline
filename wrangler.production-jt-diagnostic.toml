# Temporary read-only J&T diagnostic wrapper. Uses the same Production resources and performs no database migration.
name = "kunonline"
main = "src/index-production-jt-diagnostic.js"
compatibility_date = "2026-08-23"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "kunonline"
database_id = "c426601d-182f-486e-a5c1-bb1bca0ecb0b"

[triggers]
crons = ["*/5 * * * *", "0 */2 * * *"]

[vars]
APP_ENV = "production"
TRACKING_PROVIDER = "track123"

[observability]
enabled = true
