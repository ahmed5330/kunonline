function bindOrderActionButtons(){
  document.querySelectorAll('[data-st]').forEach(el=> el.onchange = async ()=>{
    const o = DB.orders.find(x=>x.id===el.dataset.st);
    const next = el.value;
    const body = { state: next };
    if(next === 'collected' && (o.shippingCost == null || o.otherCost == null)){
      const costs = await askCosts(o);
      if(!costs){ paint(true); return; }          /* لغى — نرجّع القايمة زي ما كانت */
      Object.assign(body, costs);
      o.shippingCost = costs.shippingCost; o.otherCost = costs.otherCost;
    } else if(next === 'collected'){
      body.shippingCost = o.shippingCost; body.otherCost = o.otherCost;
    } else if(next === 'deferred'){
      const deferUntil = await askDeferDate(o);
      if(!deferUntil){ paint(true); return; }      /* لغى — نرجّع القايمة زي ما كانت */
      body.deferUntil = deferUntil;
      o.deferUntil = deferUntil;
    } else if(next === 'returned' && o.state !== 'returned'){
      const ret = await askReturnDetails(o);
      if(!ret){ paint(true); return; }              /* لغى — نرجّع القايمة زي ما كانت */
      Object.assign(body, ret);
      o.returnType = ret.returnType; o.refundAmount = ret.refundAmount;
    }
    o.state = next; o.checkpoint = STATE_TEXT[next] || '';
    try{
      if(ONLINE) await api('/api/orders/'+encodeURIComponent(o.id), {method:'PATCH', body:JSON.stringify(body)});
      else await persist();
      paint(true); toast(next==='deferred' ? 'اتأجّل الأوردر لحد '+arDate(body.deferUntil) : 'الحالة اتغيّرت');
    }catch(e){ toast(e.message); paint(true); }
  });
  document.querySelectorAll('[data-awb]').forEach(el=> el.onchange = async ()=>{
    const o = DB.orders.find(x=>x.id===el.dataset.awb);
    o.awb = el.value.trim() || null;
    if(o.awb && o.state==='pending'){ o.state='shipped'; o.checkpoint=STATE_TEXT.shipped; }
    if(ONLINE) await api('/api/orders/'+encodeURIComponent(o.id), {method:'PATCH', body:JSON.stringify({awb:o.awb, state:o.state})});
    else await persist();
    paint(true); toast('اتحفظ رقم البوليصة');
  });
  document.querySelectorAll('[data-hist]').forEach(b=> b.onclick = ()=>{
    const o = DB.orders.find(x=>x.id===b.dataset.hist);
    if(o) showHistoryModal(o);
  });
  document.querySelectorAll('[data-contact]').forEach(b=> b.onclick = ()=>{
    const o = DB.orders.find(x=>x.id===b.dataset.contact);
    if(o) showContactModal(o);
  });
  document.querySelectorAll('[data-wa]').forEach(b=> b.onclick = ()=>{
    const o = DB.orders.find(x=>x.id===b.dataset.wa);
    const c = o && DB.clients.find(x=>x.id===o.clientId);
    if(o) showWhatsAppModal(o, c && c.name);
  });
  document.querySelectorAll('[data-notesave]').forEach(b=> b.onclick = async ()=>{
    const o = DB.orders.find(x=>x.id===b.dataset.notesave);
    const input = document.querySelector('[data-noteinput="'+b.dataset.notesave+'"]');
    const note = input ? input.value.trim() : '';
    try{
      await api('/api/orders/'+encodeURIComponent(o.id), {method:'PATCH', body:JSON.stringify({note})});
      o.note = note; paint(true); toast('اتحفظت الملاحظة');
    }catch(e){ toast(e.message); }
  });
  document.querySelectorAll('[data-delorder]').forEach(b=> b.onclick = async ()=>{
    const o = DB.orders.find(x=>x.id===b.dataset.delorder);
    if(!o) return;
    if(!confirm(`متأكد إنك عايز تحذف أوردر "${o.name||''}"؟ الخطوة دي نهائية.`)) return;
    try{
      await api('/api/orders/'+encodeURIComponent(o.id), {method:'DELETE'});
      DB.orders = DB.orders.filter(x=>x.id!==o.id);
      paint(true); toast('اتحذف الأوردر');
    }catch(e){ toast(e.message); }
  });
}

      if(!groupId) return;
      try{
        await api('/api/wa-groups/'+encodeURIComponent(gid),{method:'PATCH', body:JSON.stringify({groupId})});
        waGroupsList = await api('/api/wa-groups'); toast('اترابط'); paint();
      }catch(e){ toast(e.message); }
    });
    document.querySelectorAll('[data-delwagroup]').forEach(b=> b.onclick = async ()=>{
      const [, gid] = b.dataset.delwagroup.split(':');
      try{
        await api('/api/wa-groups/'+encodeURIComponent(gid),{method:'DELETE'});
        waGroupsList = await api('/api/wa-groups'); toast('اتحذف'); paint();
      }catch(e){ toast(e.message); }
    });
  }

  if(adminTab==='import'){
    document.querySelectorAll('#impSeg button').forEach(b=> b.onclick = ()=>{
      importMode=b.dataset.im; importRows=[]; importHeaders=[]; importMap={}; paint(); });
    const ic = $('imp_client'); if(ic) ic.onchange = ()=>{ importClient = ic.value; };
    const f = $('imp_file');
    if(f) f.onchange = async e=>{
      const file = e.target.files[0]; if(!file) return;
      const useRows = rows=>{
        if(rows.length < 2){ toast('الملف فاضي'); return; }
        importHeaders = rows[0].map(h=>String(h==null?'':h));
        importRows = rows.slice(1);
        importMap = {};
        IMPORT_FIELDS[importMode].forEach(([key,,keys])=>{ importMap[key] = guessColumn(importHeaders, keys); });
        paint();
        toast(`قرينا ${importRows.length} صف — راجع ربط الأعمدة`);
      };
      if(/\.xlsx?$/i.test(file.name)){
        try{
          await loadSheetJS();
          const buf = await file.arrayBuffer();
          const wb = XLSX.read(buf, {type:'array'});
          /* ملف J&T فيه صفحتين: ملخص الفاتورة وتفاصيل الشحنات.
             بندوّر على الصفحة اللي فيها عمود البوليصة مش أول صفحة */
          const wanted = importMode==='tracking'
            ? ['waybill','بوليصة','order no']
            : ['fullname','phone','total cost','name'];
          let best = null;
          for(const nm of wb.SheetNames){
            const rr = XLSX.utils.sheet_to_json(wb.Sheets[nm], {header:1, raw:false, defval:''})
              .filter(r=> r.some(x=>String(x).trim()!==''));
            if(rr.length < 2) continue;
            const head = rr[0].map(h=>String(h).toLowerCase());
            const hit = wanted.some(w=> head.some(h=> h.includes(w)));
            if(hit){ best = rr; break; }
            if(!best) best = rr;
          }
          if(!best){ toast('الملف مفيهوش بيانات'); return; }
          useRows(best);
        }catch(err){
          toast('ما قدرناش نقرا ملف Excel — احفظه CSV UTF-8 وجرّب تاني');
        }
        return;
      }
      const r = new FileReader();
      r.onload = ()=> useRows(parseCSV(String(r.result)));
      r.onerror = ()=> toast('ما قدرناش نقرا الملف');
      r.readAsText(file, 'UTF-8');
    };
    document.querySelectorAll('[data-map]').forEach(el=> el.onchange = ()=>{
      importMap[el.dataset.map] = Number(el.value);
    });
    const run = $('runImport');
    if(run) run.onclick = async ()=>{
      if(importMode==='orders' && !importClient){ toast('اختار المتجر الأول'); return; }
      const get = (row,key)=> importMap[key]>=0 ? String(row[importMap[key]]||'').trim() : '';
      const numOf = v => Number(String(v||'').replace(/[^\d.\-]/g,''))||0;
      let rows = importRows.map(r=>{
        const o = {};
        IMPORT_FIELDS[importMode].forEach(([k])=>{ const v = get(r,k); if(v!=='') o[k]=v; });
        if(o.qty)   o.qty   = numOf(o.qty)||1;
        if(o.total) o.total = numOf(o.total);
        if(o.unitPrice) o.unitPrice = numOf(o.unitPrice);
        if(o.shippingCost) o.shippingCost = numOf(o.shippingCost);
        if(o.date) o.date = normDate(o.date);
        if(importMode==='tracking'){
          if(o.otherCost) o.otherCost = numOf(o.otherCost);
          if(o.codAmount) o.codAmount = numOf(o.codAmount);
        }
        if(importMode==='orders'){
          o.source = sourceFromUtm(o.utm, o.payment);
          if(o.variant) o.product = (o.product||'') + ' — ' + o.variant;
          if(o.ref) o.note = 'طلب #' + o.ref + (o.note ? ' · ' + o.note : '');
          if(o.altPhone && o.phone !== o.altPhone) o.note = (o.note||'') + ' · تليفون تاني ' + o.altPhone;
          if(!o.id && o.ref) o.id = o.ref;
        }
        return o;
      }).filter(o=> importMode==='tracking' ? (o.awb || o.ref) : (o.name || o.phone || o.id));

      /* الأوردر اللي فيه أكتر من منتج بييجي في أكتر من صف — بنجمعهم
         عشان الإيراد ما يتحسبش مرتين */
      if(importMode==='orders'){
        const merged = new Map();
        rows.forEach(o=>{
          const key = o.id || (o.phone + '|' + o.date + '|' + o.total);
          const prev = merged.get(key);
          if(!prev){ merged.set(key, o); return; }
          prev.qty = (prev.qty||1) + (o.qty||1);
          if(o.product && !String(prev.product||'').includes(o.product)){
            prev.product = (prev.product||'') + ' + ' + o.product;
          }
          if(o.sku && prev.sku !== o.sku) prev.sku = prev.sku ? prev.sku + ',' + o.sku : o.sku;
          /* الإجمالي بيفضل زي ما هو — مش بنجمعه */
        });
        rows = [...merged.values()];
      }
      if(!rows.length){ toast('مفيش صفوف صالحة — راجع ربط الأعمدة'); return; }
      run.disabled = true; run.textContent = 'بنستورد...';
      try{
        const res = await api('/api/orders/bulk',{method:'POST',
          body:JSON.stringify({ mode:importMode, clientId:importClient, rows })});
        DB.orders = (await api('/api/state')).orders || DB.orders;
        const box = document.getElementById('importResult');
        box.innerHTML = importMode==='orders'
          ? `<div class="note-card" style="margin-top:14px"><h4>الاستيراد خلص</h4>
             <p>أضفنا ${num(res.created)} أوردر جديد وحدّثنا ${num(res.updated)}.
             ${res.noCost ? '\n⚠️ ' + num(res.noCost) + ' أوردر ما لقيناش تكلفة بضاعته — ضيف المنتجات في تبويب المنتجات عشان الربح يطلع صح.' : 'وتكلفة البضاعة اتحسبت من كتالوج المنتجات.'}</p></div>`
          : `<div class="note-card" style="margin-top:14px"><h4>الاستيراد خلص</h4>
             <p>طابقنا ${num(res.matched)} شحنة${res.byRef? ' (منهم '+num(res.byRef)+' بـ Order NO. مش بالبوليصة)':''}،
             منهم ${num(res.signed||0)} اتسلّموا (تحصيل منتظر)، ${num(res.collected)} اتحصّلوا فعلاً،
             و${num(res.returned||0)} مرتجع.
             ${res.unmatchedCount? '\n⚠️ '+num(res.unmatchedCount)+' شحنة مالهاش أوردر عندنا: '+res.unmatched.slice(0,8).join(' · ') : ''}</p></div>`;
        toast('الاستيراد خلص');
      }catch(e){ toast(e.message); }
      finally{ run.disabled=false; run.textContent='استيراد'; }
    };
  }

  if(adminTab==='finance'){
    document.querySelectorAll('#txSeg button').forEach(b=> b.onclick = ()=>{ txRange=b.dataset.tx; paint(); });
    const setCats = ()=>{
      const t = $('t_type').value;
      $('t_cat').innerHTML = (t==='income'?INCOME_CATS:EXPENSE_CATS).map(c=>`<option>${esc(c)}</option>`).join('');
    };
    if($('t_type')) $('t_type').onchange = setCats;
    const st = $('saveTx');
    if(st) st.onclick = async ()=>{
      const amount = +$('t_amount').value||0;
      if(amount<=0){ toast('اكتب مبلغ صحيح'); return; }
      const body = { type:$('t_type').value, category:$('t_cat').value, amount,
        currency:$('t_cur').value, method:$('t_method').value, date:$('t_date').value||today(),
        clientId:$('t_client').value||null, note:$('t_note').value.trim() };
      try{
        await api('/api/transactions',{method:'POST', body:JSON.stringify(body)});
        DB._tx = await api('/api/transactions'); paint(); toast('الحركة اتسجّلت');
      }catch(e){ toast(e.message); }
    };
    document.querySelectorAll('[data-deltx]').forEach(b=> b.onclick = async ()=>{
      if(!confirm('هتمسح الحركة دي. تكمل؟')) return;
      try{ await api('/api/transactions/'+encodeURIComponent(b.dataset.deltx),{method:'DELETE'});
        DB._tx = await api('/api/transactions'); paint(true); toast('اتحذفت');
      }catch(e){ toast(e.message); }
    });
    const ex = $('expTx');
    if(ex) ex.onclick = ()=>{
      const head = ['التاريخ','النوع','البند','المبلغ','العملة','طريقة الدفع','العميل','البيان'];
      const lines = txFor(txRange).map(t=>{
        const c = DB.clients.find(x=>x.id===t.clientId);
        return [t.date, t.type==='income'?'تحصيل':'مصروف', t.category, t.amount,
          t.currency||'EGP', t.method||'', c?c.name:'', (t.note||'').replace(/,/g,' ')].join(',');
      });
      downloadFile('konline-accounts.csv', [head.join(','), ...lines].join('\n'), 'text/csv;charset=utf-8');
      toast('اتنزّل الملف');
    };
  }

  if(adminTab==='users'){
    const refresh = async ()=>{ try{ DB._users = await api('/api/users'); }catch(e){} };
    const su = $('saveUser');
    if(su) su.onclick = async ()=>{
      const email=$('u_email').value.trim(), pass=$('u_password').value;
      if(!email.includes('@')){ toast('اكتب إيميل صحيح'); return; }
      if(!editingUser && pass.length<8){ toast('حساب جديد محتاج كلمة مرور ٨ حروف على الأقل'); return; }
      if(pass && pass.length<8){ toast('كلمة المرور لازم تكون ٨ حروف على الأقل'); return; }
      const role = $('u_role').value;
      const body = { email, name:$('u_name').value.trim(), role,
        clientId:$('u_client').value || null,
        status:$('u_status').value };
      if(editingUser) body.id = editingUser.id;
      if(pass) body.password = pass;
      try{
        await api('/api/users', {method:'POST', body:JSON.stringify(body)});
        editingUser=null; await refresh(); paint(); toast('اتحفظ');
      }catch(e){ toast(e.message); }
    };
    const cu = $('cancelUser'); if(cu) cu.onclick = ()=>{ editingUser=null; paint(); };
    document.querySelectorAll('[data-edituser]').forEach(b=> b.onclick = ()=>{
      editingUser = (DB._users||[]).find(u=>u.id===b.dataset.edituser); paint(); });
    document.querySelectorAll('[data-deluser]').forEach(b=> b.onclick = async ()=>{
      if(!confirm('هتمسح الحساب ده نهائياً. تكمل؟')) return;
      try{ await api('/api/users/'+encodeURIComponent(b.dataset.deluser), {method:'DELETE'});
        await refresh(); paint(); toast('اتحذف');
      }catch(e){ toast(e.message); }
    });
  }

  if(adminTab==='settings'){
    $('expJSON').onclick = async ()=>{
      if(!ONLINE){ downloadFile('konline-backup.json', JSON.stringify(DB,null,2), 'application/json'); return; }
      const b = $('expJSON'); b.disabled = true; b.textContent = 'بنجهّز النسخة...';
      try{
        const r = await fetch('/api/backup', {credentials:'same-origin'});
        if(!r.ok) throw new Error('فشل التنزيل');
        const text = await r.text();
        downloadFile(`konline-backup-${today()}.json`, text, 'application/json');
        const d = JSON.parse(text);
        toast(`اتنزّلت النسخة — ${d.orders.length} أوردر`);
      }catch(e){ toast(e.message); }
      finally{ b.disabled=false; b.textContent='تنزيل نسخة دلوقتي'; }
    };
    $('impBtn').onclick = ()=> $('impFile').click();
    $('impFile').onchange = e=>{
      const file = e.target.files[0]; if(!file) return;
      const r = new FileReader();
      r.onload = ()=>{
        let d;
        try{ d = JSON.parse(r.result); }
        catch(err){ toast('الملف مش JSON سليم'); return; }
        if(!d.state || !Array.isArray(d.orders)){ toast('الملف مش نسخة صالحة'); return; }
        const box = document.getElementById('restoreBox');
        box.innerHTML = `
          <div class="note-card" style="margin-top:14px;background:var(--brick-soft);border-color:var(--brick-line)">
            <h4 style="color:var(--brick)">راجع قبل الاسترجاع</h4>
            <p style="color:#7A2415">النسخة دي من <b>${esc(String(d.takenAt||'').slice(0,16).replace('T',' '))}</b>
              وفيها ${num(d.orders.length)} أوردر · ${num((d.products||[]).length)} منتج ·
              ${num((d.transactions||[]).length)} حركة حسابات.

              الاسترجاع هيمسح الأوردرات والمنتجات والحركات الموجودة دلوقتي ويحط اللي في الملف.
              حسابات الدخول وكلمات المرور مش هتتأثر.

              <b>الخطوة دي ما بترجعش.</b> نزّل نسخة من الوضع الحالي الأول لو ما عملتش.</p>
            <div class="form-actions">
              <button class="btn sm danger" id="doRestore">أنا متأكد — استرجع</button>
              <button class="btn sm line" id="cancelRestore">إلغاء</button>
            </div>
          </div>`;
        document.getElementById('cancelRestore').onclick = ()=>{ box.innerHTML=''; $('impFile').value=''; };
        document.getElementById('doRestore').onclick = async ()=>{
          const btn = document.getElementById('doRestore');
          btn.disabled = true; btn.textContent = 'بنسترجع...';
          try{
            const res = await api('/api/restore', {method:'POST',
              body: JSON.stringify({...d, confirm:'RESTORE'})});
            DB = await api('/api/state'); normalizeDB();
            box.innerHTML = '';
            paint(); toast(`اتسترجعت النسخة — ${res.orders} أوردر`);
          }catch(err){ toast(err.message); btn.disabled=false; btn.textContent='أنا متأكد — استرجع'; }
        };
      };
      r.readAsText(file);
    };
    bindPasswordCard();
    $('saveAgency').onclick = async ()=>{
      const v = $('adminEmail').value.trim();
      if(!v){ toast('اكتب إيميل'); return; }
      DB.agency.adminEmail=v; await persist(); renderDemoAccounts(); toast('اتحفظ');
    };
  }
}

boot();
</script>
</body>
</html>
