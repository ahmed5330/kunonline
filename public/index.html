<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كن أونلاين — نظام إدارة متاجر العملاء</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0E5095">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="كن أونلاين">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12212B;
  --ink-2:#3D5563;
  --ink-3:#7C929E;
  --ground:#E9EFEC;
  --surface:#FFFFFF;
  --surface-2:#F5F8F7;
  --line:#D3DEDA;
  --pine:#3F8F2B;
  --pine-soft:#E8F7E1;
  --pine-line:#C3E8B0;
  --gold:#C08A00;
  --gold-soft:#FBF0D6;
  --gold-line:#EBDCB2;
  --gold-line-2:#D9C48A;
  --gold-ink:#7A5900;
  --gold-ink-2:#5C4400;
  --brick:#A8321D;
  --brick-soft:#FAE6E1;
  --brick-line:#E7C4BC;
  --chrome-bg:#0E5095;
  --chrome-fg:#fff;
  --radius:14px;
  --shadow:0 1px 2px rgba(18,33,43,.06), 0 8px 24px -12px rgba(18,33,43,.18);
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --sans:'Tajawal', system-ui, 'Segoe UI', sans-serif;
}
/* الوضع المظلم */
[data-theme="dark"]{
  --ink:#EAF1EE; --ink-2:#B7C6C2; --ink-3:#84958F;
  --ground:#0E1512; --surface:#182019; --surface-2:#1E2823;
  --line:#2B362F;
  --pine:#7ED957; --pine-soft:#1E3313; --pine-line:#345823;
  --gold:#E3B646; --gold-soft:#332A11; --gold-line:#4A3C18; --gold-line-2:#5C4B1E;
  --gold-ink:#E8C776; --gold-ink-2:#F0D89A;
  --brick:#E8836C; --brick-soft:#3A211B; --brick-line:#52302A;
  --chrome-bg:#0A2C52; --chrome-fg:#EAF1EE;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
/* الوضع الرمادي — بدرجات الرمادي بس، من غير أي لون */
[data-theme="gray"]{
  --ink:#1C1C1C; --ink-2:#4B4B4B; --ink-3:#7A7A7A;
  --ground:#E2E2E2; --surface:#F3F3F3; --surface-2:#EAEAEA;
  --line:#C7C7C7;
  --pine:#3F3F3F; --pine-soft:#DCDCDC; --pine-line:#C7C7C7;
  --gold:#4B4B4B; --gold-soft:#DEDEDE; --gold-line:#C7C7C7; --gold-line-2:#B5B5B5;
  --gold-ink:#3A3A3A; --gold-ink-2:#2A2A2A;
  --brick:#333333; --brick-soft:#D9D9D9; --brick-line:#BFBFBF;
  --chrome-bg:#2B2B2B; --chrome-fg:#F3F3F3;
  --shadow:0 1px 2px rgba(0,0,0,.08), 0 8px 24px -12px rgba(0,0,0,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--ground);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.shell{max-width:1180px;margin:0 auto;padding:0 16px 64px}
.topbar{
  background:var(--chrome-bg);color:var(--chrome-fg);position:sticky;top:0;z-index:40;
}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.2px}
.brand-mark{
  width:28px;height:28px;border-radius:50%;background:#fff;overflow:hidden;
  display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.4)
}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand small{display:block;font-weight:400;font-size:11px;color:#9DB4B0;letter-spacing:.06em}
.topbar .spacer{flex:1}
.who{font-size:13px;color:#A9BEC4;display:flex;align-items:center;gap:10px;max-width:100%}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.ghost-btn{
  border:1px solid rgba(255,255,255,.22);color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;
  transition:background .15s
}
.ghost-btn:hover{background:rgba(255,255,255,.1)}
.theme-switch{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:9px;padding:2px}
.theme-switch button{
  width:28px;height:28px;border-radius:7px;font-size:14px;color:var(--chrome-fg);opacity:.55;
  display:grid;place-items:center;transition:background .15s,opacity .15s
}
.theme-switch button[aria-pressed="true"]{background:rgba(255,255,255,.18);opacity:1}
.theme-switch button:hover{opacity:.9}
#chatFab{
  position:fixed;bottom:22px;inset-inline-start:22px;z-index:150;
  width:52px;height:52px;border-radius:50%;background:var(--chrome-bg);color:var(--chrome-fg);
  font-size:22px;display:grid;place-items:center;box-shadow:var(--shadow);border:none;cursor:pointer;
  transition:transform .15s
}
#chatFab:hover{transform:scale(1.06)}
.chat-badge{
  position:absolute;top:-4px;inset-inline-end:-4px;background:var(--brick);color:#fff;
  font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;
  display:grid;place-items:center;padding:0 5px;border:2px solid var(--ground)
}
.chat-panel{
  position:fixed;bottom:0;inset-inline-start:0;top:0;z-index:160;width:min(380px,92vw);
  background:var(--surface);box-shadow:var(--shadow);border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column
}
.wallet-top-panel{
  position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:150;width:min(320px,90vw);
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  max-height:70vh;overflow-y:auto;padding:10px
}
.wallet-row{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.wallet-row:last-child{border-bottom:none}
.chat-panel-head{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.chat-panel-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column}
.chat-msg{max-width:85%;padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:13.5px;background:var(--surface-2)}
.chat-msg.mine{align-self:flex-end;background:var(--pine-soft)}
.chat-msg .who{font-size:11px;color:var(--ink-3);margin-bottom:2px}
.chat-msg .when{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.chat-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-input-row input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px}
.task-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.task-card.done{opacity:.55}
.task-card .t-title{font-weight:700;font-size:13.5px}
.task-card .t-meta{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.mention{color:var(--pine);font-weight:700}
.mention-list{position:absolute;bottom:56px;inset-inline:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);max-height:160px;overflow-y:auto;z-index:5}
.mention-list button{display:block;width:100%;text-align:start;padding:8px 12px;font-size:13px;background:none;border:none;cursor:pointer}
.mention-list button:hover{background:var(--surface-2)}

/* ---------- login ---------- */
.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(1000px 600px at 80% -10%, #DCEAE5 0%, transparent 60%), var(--ground)}
.login{width:100%;max-width:420px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}
.login h1{font-size:23px;letter-spacing:-.4px;margin-bottom:6px}
.login p.sub{color:var(--ink-2);font-size:14px;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  transition:border-color .15s, background .15s
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pine);background:#fff;outline:none}
.btn{
  width:100%;background:var(--pine);color:#fff;padding:12px;border-radius:10px;font-weight:700;
  transition:filter .15s, transform .05s
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.sm{width:auto;padding:9px 16px;font-size:14px;font-weight:500}
.btn.line{background:transparent;color:var(--pine);border:1px solid var(--pine)}
.btn.dark{background:var(--chrome-bg)}
.btn.danger{background:transparent;color:var(--brick);border:1px solid var(--brick-line)}
.demo-list{margin-top:20px;border-top:1px dashed var(--line);padding-top:16px}
.demo-list h4{font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:.08em;margin-bottom:9px}
.demo-chip{
  display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;
  padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;font-size:13px;background:#fff;
  text-align:right;transition:border-color .15s
}
.demo-chip:hover{border-color:var(--pine)}
.demo-chip span.mono{font-size:11.5px;color:var(--ink-3)}
.err{background:var(--brick-soft);color:var(--brick);padding:10px 12px;border-radius:9px;font-size:13.5px;margin-bottom:14px}

/* ---------- page head ---------- */
.page-head{padding:26px 0 18px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px}
.page-head h2{font-size:26px;letter-spacing:-.5px;line-height:1.25}
.page-head .eyebrow{font-size:12px;color:var(--ink-3);letter-spacing:.1em;margin-bottom:3px}
.page-head .spacer{flex:1}
.seg{display:flex;background:#DDE7E3;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 13px;border-radius:8px;font-size:13px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(18,33,43,.1)}

/* ---------- funding gauge (signature) ---------- */
.gauge{
  background:var(--chrome-bg);color:var(--chrome-fg);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;
  position:relative;overflow:hidden
}
.gauge-top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;margin-bottom:14px}
.gauge-label{font-size:12.5px;color:#9DB4B0;letter-spacing:.06em}
.gauge-amount{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-1px}
.gauge-amount .cur{font-size:14px;color:#9DB4B0;margin-inline-start:5px}
.gauge-top .spacer{flex:1}
.gauge-days{text-align:left;font-size:12.5px;color:#9DB4B0}
.gauge-days b{display:block;font-family:var(--mono);font-size:20px;color:#fff;font-weight:500}
.track{height:9px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden;display:flex}
.track i{display:block;height:100%;background:var(--pine);transition:width .7s cubic-bezier(.3,1,.4,1)}
.track i.low{background:var(--gold)}
.track i.crit{background:#E2603F}
.gauge-foot{display:flex;justify-content:space-between;font-size:11.5px;color:#8FA6A2;margin-top:8px}
.gauge-alert{
  margin-top:13px;background:rgba(226,96,63,.16);border:1px solid rgba(226,96,63,.4);
  padding:9px 12px;border-radius:9px;font-size:13px;color:#FFD9CF
}

/* ---------- kpi grid ---------- */
.section-title{font-size:12.5px;color:var(--ink-3);letter-spacing:.1em;font-weight:500;margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.section-title:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
.kpi .k-label{font-size:12.5px;color:var(--ink-2);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.kpi .k-val{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-1px;line-height:1.15}
.kpi .k-val .cur{font-size:12px;color:var(--ink-3);font-family:var(--sans);margin-inline-start:4px;letter-spacing:0}
.kpi .k-foot{margin-top:7px;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.delta{font-family:var(--mono);font-size:11.5px;padding:1px 6px;border-radius:99px;font-weight:500}
.delta.up{background:var(--pine-soft);color:var(--pine)}
.delta.down{background:var(--brick-soft);color:var(--brick)}
.delta.flat{background:var(--surface-2);color:var(--ink-3)}
.kpi.accent-gold{background:var(--gold-soft);border-color:var(--gold-line)}
.kpi.accent-pine{background:var(--pine-soft);border-color:var(--pine-line)}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block}
.dot.pine{background:var(--pine)} .dot.gold{background:var(--gold)} .dot.brick{background:var(--brick)}

/* ---------- chart ---------- */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.chart-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:12px}
.chart-head h3{font-size:15px;font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-inline-start:auto}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{
  text-align:right;font-size:11.5px;color:var(--ink-3);font-weight:500;letter-spacing:.04em;
  padding:11px 13px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap
}
td{padding:11px 13px;border-bottom:1px solid #EDF2F0;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;text-align:left}
.pill{font-size:11.5px;padding:2px 9px;border-radius:99px;background:#EDF2F0;color:var(--ink-2)}
.pill.on{background:var(--pine-soft);color:var(--pine)}
.pill.off{background:var(--brick-soft);color:var(--brick)}
.row-act{display:flex;gap:6px}
.icon-btn{padding:4px 9px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--ink-2);background:#fff;text-decoration:none;display:inline-block}
.icon-btn:hover{border-color:var(--pine);color:var(--pine)}

/* ---------- note ---------- */
.note-card{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:var(--radius);padding:16px}
.note-card h4{font-size:13px;margin-bottom:6px;color:var(--gold-ink)}
.note-card p{font-size:14px;color:var(--gold-ink-2);white-space:pre-wrap}

/* ---------- admin nav ---------- */
.admin-nav{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;-webkit-overflow-scrolling:touch}
.admin-nav button{
  padding:8px 15px;border-radius:99px;font-size:14px;color:var(--ink-2);white-space:nowrap;
  border:1px solid transparent
}
.admin-nav button[aria-pressed="true"]{background:var(--chrome-bg);color:var(--chrome-fg)}
.admin-nav button:not([aria-pressed="true"]):hover{border-color:var(--line);background:#fff}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.hint{font-size:12.5px;color:var(--ink-3)}
.toast{
  position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);
  background:var(--chrome-bg);color:var(--chrome-fg);padding:11px 18px;border-radius:10px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:var(--shadow)
}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.detail-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.detail-strip>div{background:var(--surface);padding:11px 14px}
.detail-strip .dt{font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.detail-strip .dd{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.split{display:flex;height:24px;border-radius:7px;overflow:hidden;background:var(--line);margin:4px 0 16px}
.split i{display:block;height:100%;min-width:1px}
.cost-list{list-style:none;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.cost-list li{background:var(--surface);display:flex;align-items:center;gap:10px;padding:9px 13px;font-size:13.5px}
.cost-list li .sw{width:10px;height:10px;border-radius:3px;flex:none}
.cost-list li .g{flex:1}
.cost-list li .v{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr}
.cost-list li .p{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);width:44px;text-align:left;direction:ltr}
.cost-list li.sum{background:var(--surface-2);font-weight:700}
.sub-head{font-size:12px;color:var(--ink-3);margin:16px 0 8px;font-weight:500}
.pill.wait{background:var(--gold-soft);color:var(--gold-ink)}
.pill.mid{background:#E4EDF1;color:#2F5A70}
.gov-row{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-bottom:9px}
.gov-row .g{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gov-row .bar{flex:1;height:8px;border-radius:99px;background:#EDF2F0;overflow:hidden}
.gov-row .bar i{display:block;height:100%;background:var(--pine);border-radius:99px}
.gov-row .n{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);width:70px;text-align:left;direction:ltr;flex:none}
@media (max-width:520px){ .gov-row .g{width:74px} .gov-row .n{width:60px;font-size:11.5px} }

@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:repeat(2,1fr)}
  .page-head h2{font-size:22px}
}
@media (max-width:520px){
  .g4,.g3,.g2{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .gauge-amount{font-size:26px}
  .kpi .k-val{font-size:21px}
  .shell{padding-inline:12px}
  .topbar-in{gap:8px;padding:10px 12px}
  .brand small{display:none}
  .brand>span{font-size:14px}
  .who span{max-width:80px;font-size:12px}
  .ghost-btn{padding:6px 9px;font-size:12px}
  #installAppBtn .btn-label,#walletTopBtn .btn-label{display:none}
  .theme-switch{order:3;flex:1 0 100%;justify-content:center}
  .wallet-top-panel{inset-inline-end:auto;inset-inline-start:0;width:min(280px,88vw)}
  .seg{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .seg button{white-space:nowrap}
  .page-head{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media print{
  .topbar,.seg,.admin-nav,.btn,.icon-btn{display:none !important}
  body{background:#fff}
  .card,.chart-card,.table-wrap{break-inside:avoid}
}
</style>
</head>

/* ---------- 1. التخزين ---------- */

/* ---------- 1ب. الاتصال بالسيرفر ---------- */

async function api(path, opts){

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- 3. قوائم ثابتة ---------- */
const GOV_BY_MARKET = {

/* ---------- 3. بيانات البداية ---------- */
let seedState = 987654321;
function rnd(){ seedState = (seedState*1664525 + 1013904223) % 4294967296; return seedState/4294967296; }
function around(base, spread){ return Math.max(0, base + (rnd()-0.5)*2*spread); }

function seedData(){
  const clients = [
    { id:'c1', name:'عيد ستور — السعودية', email:'eid@demo.com', currency:'SAR', market:'السعودية',
      store:'3eedstores.com', adAccount:'act_000000000000001', status:'active',

    { id:'c3', name:'Har Mony', email:'harmony@demo.com', currency:'EGP', market:'مصر',
      store:'harmony.store', adAccount:'act_000000000000003', status:'active',
      manager:'أحمد', phone:'+20xxxxxxxxxx', startDate:addDays(today(),-60), plan:'إدارة كاملة',

  const profiles = {

  };
  const entries=[], funding=[];
  const start = addDays(today(), -29);
  clients.forEach(c=>{
    const p = profiles[c.id];
    for(let i=0;i<30;i++){
      const date = addDays(start,i);

        gov:govs[Math.floor(rnd()*govs.length)],
        total: Math.round(price*qty),
        qty,
        awb: ['pending','confirmed','cancelled'].includes(st) ? null : 'JT'+String(Math.floor(rnd()*900000000)+100000000)+'EG',
        state: st,

  });
  return {
    agency:{ name:'كن أونلاين', adminEmail:'admin@konline.agency' },

}

/* ---------- 4. الحسابات ---------- */
function rangeDates(range){
  const t = today();
  if(range==='week') return [addDays(t,-6), t];
  if(range==='last30') return [addDays(t,-29), t];
  if(range==='month'){
    const d = new Date(t+'T00:00:00');
    return [iso(new Date(d.getFullYear(), d.getMonth(), 1)), t];
  }
  if(range && range.startsWith('custom:')){
    const [,from,to] = range.split(':');
    return [from||t, to||t];
  }
  /* توافق قديم */
  if(range==='today') return [t,t];
  if(range==='7') return [addDays(t,-6), t];
  if(range==='30') return [addDays(t,-29), t];
  return ['1900-01-01', t];
}
function entriesFor(clientId, range){
  const [from,to] = rangeDates(range);
  return DB.entries
    .filter(e=>e.clientId===clientId && e.date>=from && e.date<=to)
    .sort((a,b)=> a.date < b.date ? -1 : 1);
}
function agg(list){
  const t = { orders:0, adSpend:0, revenue:0, cogs:0, shipping:0, other:0, confirmed:0, delivered:0, returned:0 };
  list.forEach(e=>{ for(const k in t) t[k] += Number(e[k]||0); });
  t.expenses = t.adSpend + t.cogs + t.shipping + t.other;
  t.profit   = t.revenue - t.expenses;
  t.cpo      = safeDiv(t.adSpend, t.orders);
  t.aov      = safeDiv(t.revenue, t.delivered);
  t.roas     = safeDiv(t.revenue, t.adSpend);
  t.margin   = safeDiv(t.profit, t.revenue)*100;
  t.confRate = safeDiv(t.confirmed, t.orders)*100;
  t.delRate  = safeDiv(t.delivered, t.confirmed)*100;
  t.retRate  = safeDiv(t.returned, t.delivered)*100;
  return t;
}
/* الداشبورد بيتحسب من الأوردرات نفسها — الإيراد والربح من المحصّل بس */
function orderAgg(list){
  const t = { orders:list.length, pending:0, confirmed:0, preparing:0, shipped:0,
    signed:0, collected:0, returned:0, cancelled:0,
    revenue:0, productCost:0, shipping:0, other:0, returnedShipping:0, pipeline:0,
    awaiting:0, awaitingCost:0 };
  list.forEach(o=>{
    t[o.state] = (t[o.state] || 0) + 1;
    const total = Number(o.total)||0;
    if(o.state === 'collected'){
      /* الفلوس وصلت — دي بس اللي بتدخل الربح */
      t.revenue      += total;
      t.productCost  += Number(o.productCost)||0;
      t.shipping     += Number(o.shippingCost)||0;
      t.other        += Number(o.otherCost)||0;
    } else if(o.state === 'signed'){
      /* J&T سلّم بس الفلوس لسه ما وصلتش — تحصيل منتظر */
      t.awaiting     += total;
      t.awaitingCost += (Number(o.productCost)||0) + (Number(o.shippingCost)||0) + (Number(o.otherCost)||0);
    } else if(o.state === 'returned'){
      /* المرتجع مبيجبش إيراد لكن بيكلّف شحن رايح جاي */
      t.returnedShipping += Number(o.shippingCost)||0;
    } else if(o.state !== 'cancelled'){
      t.pipeline += total;   /* لسه في الطريق */
    }
  });
  t.inProgress = t.pending + t.confirmed + t.preparing + t.shipped;
  t.directCost = t.productCost + t.shipping + t.other + t.returnedShipping;
  t.grossProfit = t.revenue - t.directCost;
  t.awaitingProfit = t.awaiting - t.awaitingCost;
  t.aov = safeDiv(t.revenue, t.collected);
  t.collectRate = safeDiv(t.collected, t.orders)*100;
  t.deliverRate = safeDiv(t.signed + t.collected, t.orders)*100;
  t.returnRate  = safeDiv(t.returned, t.signed + t.collected + t.returned)*100;
  t.confirmRate = safeDiv(t.orders - t.pending - t.cancelled, t.orders)*100;
  return t;
}
/* الإنفاق الإعلاني لسه بييجي من الإدخال اليومي — الإعلانات مش بتظهر في الأوردرات */
function adSpendFor(clientId, range){
  return entriesFor(clientId, range).reduce((s,e)=> s + (Number(e.adSpend)||0), 0);
}

function fundingState(clientId){
  const dep = DB.funding.filter(f=>f.clientId===clientId)
    .reduce((s,f)=> s + (f.type==='deposit'? Number(f.amount) : -Number(f.amount)), 0);
  const spent = DB.entries.filter(e=>e.clientId===clientId).reduce((s,e)=>s+Number(e.adSpend||0),0);
  const last7 = entriesFor(clientId,'7');
  const avgDaily = safeDiv(last7.reduce((s,e)=>s+Number(e.adSpend||0),0), last7.length||1);
  const left = dep - spent;
  return { deposited:dep, spent, left, avgDaily, days: avgDaily>0 ? left/avgDaily : Infinity, pct: dep>0 ? Math.max(0,Math.min(100,left/dep*100)) : 0 };
}
/** بديل fundingState القديم — بيستخدم رصيد ميتا الحقيقي المتزامن تلقائي بدل التمويل اليدوي اللي محدّش بيحدّثه */
function realBalanceState(client){
  const last7 = entriesFor(client.id,'7');
  const avgDaily = safeDiv(last7.reduce((s,e)=>s+Number(e.adSpend||0),0), last7.length||1);
  const bal = client.metaBalance;
  const days = (bal!=null && avgDaily>0) ? bal/avgDaily : Infinity;
  return { balance: bal, avgDaily, days };
}
const ECON_DEFAULTS = { price:0, productCost:0, shipping:0, packaging:0, codFeePct:0, confirmCost:0, otherCost:0, returnCost:0 };
const COST_COLORS = ['#3D5563','#5E7684','#8FA3AD','#B9C7CE','#CBD6DB','#DDE5E8'];

/* تحليل ربحية الأوردر الواحد: سعر البيع − المصاريف الضمنية − التكلفة الإعلانية */
function orderEconomics(client, cpoActual){
  const e = Object.assign({}, ECON_DEFAULTS, client.econ||{});
  const fee = e.price * (Number(e.codFeePct)||0) / 100;
  const items = [
    { label:'تكلفة المنتج',            v:Number(e.productCost)||0 },
    { label:'الشحن للعميل',            v:Number(e.shipping)||0 },
    { label:'التغليف والتعبئة',        v:Number(e.packaging)||0 },
    { label:'عمولة التحصيل / الدفع',   v:fee },
    { label:'التأكيد وخدمة العملاء',   v:Number(e.confirmCost)||0 },
    { label:'مصاريف ضمنية أخرى',       v:Number(e.otherCost)||0 }
  ].map((x,i)=> Object.assign(x,{ color:COST_COLORS[i] }));
  const implicit = items.reduce((s,x)=>s+x.v,0);
  const contribution = e.price - implicit;              // الربح قبل الإعلان = أقصى تكلفة إعلانية مسموحة
  const ad = Number(cpoActual)||0;
  const net = contribution - ad;
  return { e, items, implicit, contribution, ad, net,
    margin: safeDiv(net, e.price)*100,
    marginBefore: safeDiv(contribution, e.price)*100,
    breakeven: contribution,
    healthy: ad>0 ? ad <= contribution : true,
    ready: e.price>0 };
}

function deltaBadge(cur, prev, higherIsBetter=true){
  if(!prev) return '<span class="delta flat mono">جديد</span>';
  const d = (cur-prev)/Math.abs(prev)*100;
  if(Math.abs(d) < 1) return '<span class="delta flat mono">0%</span>';
  const good = higherIsBetter ? d>0 : d<0;
  return `<span class="delta ${good?'up':'down'} mono">${d>0?'+':''}${d.toFixed(0)}%</span>`;
}

/* ---------- 5. الرسم البياني ---------- */
function chartSVG(list, currency){
  if(!list.length) return '<div class="empty">لسه مفيش بيانات في الفترة دي.</div>';
  const W=760, H=230, pad={t:14,r:34,b:26,l:34};
  const iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  const maxRev = Math.max(...list.map(e=>e.revenue), 1);
  const maxAd  = Math.max(...list.map(e=>e.adSpend), 1);
  const n = list.length;
  const bw = Math.max(3, iw/n*0.55);
  const x = i => pad.l + (iw/n)*(i+0.5);
  let bars='', line='', dots='', labels='';
  list.forEach((e,i)=>{
    const h = (e.revenue/maxRev)*ih;
    bars += `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(pad.t+ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="var(--pine-line)"><title>${arDate(e.date)} — إيراد ${money(e.revenue)} ${currency}</title></rect>`;
    const ly = pad.t + ih - (e.adSpend/maxAd)*ih*0.9;
    line += `${i?'L':'M'}${x(i).toFixed(1)},${ly.toFixed(1)}`;
    dots += `<circle cx="${x(i).toFixed(1)}" cy="${ly.toFixed(1)}" r="2.6" fill="var(--gold)"><title>${arDate(e.date)} — إعلانات ${money(e.adSpend)} ${currency}</title></circle>`;
  });
  const step = Math.ceil(n/6);
  list.forEach((e,i)=>{ if(i%step===0 || i===n-1)
    labels += `<text x="${x(i).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="#7C929E" font-family="IBM Plex Mono">${arDate(e.date)}</text>`; });
  let grid='';
  for(let g=0;g<=3;g++){ const y = pad.t + (ih/3)*g; grid += `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#EDF2F0" stroke-width="1"/>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="الإيراد والإنفاق الإعلاني يومياً">
    ${grid}${bars}
    <path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
  </svg>`;
}

const RETURN_TYPE_LABEL = { full:'مرتجع كامل', partial:'مرتجع جزئي', exchange:'استبدال' };
function ordersFor(clientId, range){
  const [from,to] = rangeDates(range);
  return (DB.orders||[]).filter(o=>o.clientId===clientId && o.date>=from && o.date<=to)
    .sort((a,b)=> a.date<b.date?1:-1);
}

/** بيقرأ النموذج ويرجّع أوردر جاهز — أو null لو في نقص */
function readOrderForm(clientId){
  const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const name = g('n_name').trim(), phone = g('n_phone').trim(), total = +g('n_total')||0;
  if(!name || !phone){ toast('اسم المشتري ورقم التليفون مطلوبين'); return null; }
  if(total<=0){ toast('اكتب إجمالي الأوردر'); return null; }
  const sel = document.getElementById('n_product_id');
  const opt = sel && sel.selectedOptions[0];
  const pid = sel ? sel.value : '';
  const qty = +g('n_qty')||1;
  const pr  = (DB.products||[]).find(x=>x.id===pid);
  const varSel = document.getElementById('n_variant_id');
  const varOpt = varSel && varSel.value ? varSel.selectedOptions[0] : null;
  const variantId = varOpt ? varOpt.value : null;
  const variantPrice = varOpt && varOpt.dataset.price !== '' ? Number(varOpt.dataset.price) : null;
  return {
    id:'MN-'+uid().toUpperCase(), clientId, date:g('n_date')||today(),
    name, phone, gov:g('n_gov').trim()||'غير محدد', address:g('n_address').trim(),
    product: pr ? (variantId ? pr.name+' — '+varOpt.textContent.trim() : pr.name) : g('n_product').trim(),
    productId: pid || null,
    variantId: variantId || null,
    productNote: g('n_product_note').trim() || (variantId ? varOpt.textContent.trim() : ''),
    unitPrice: variantPrice != null ? variantPrice : (pr ? pr.price : safeDiv(total, qty)),
    productCost: pr ? (Number(pr.cost)||0)*qty : 0,
    qty, total,
    couponCode: g('n_coupon').trim() || undefined,
    source:g('n_source')||'واتساب', note:g('n_note').trim(),
    awb:null, state:'pending', checkpoint:STATE_TEXT.pending
  };
}

/* قسم أوردرات المشترين وحالة الشحن */
function ordersSection(client, range){
  const list = ordersFor(client.id, range);
  if(!list.length) return '';
  const cur = client.currency;
  const cnt = st => list.filter(o=>o.state===st).length;
  const govs = {};
  list.forEach(o=>{ govs[o.gov] = govs[o.gov] || {orders:0, delivered:0, revenue:0};
    govs[o.gov].orders++;
    if(o.state==='collected' || o.state==='signed'){ govs[o.gov].delivered++; govs[o.gov].revenue += o.total; } });
  const top = Object.entries(govs).sort((a,b)=>b[1].orders-a[1].orders).slice(0,6);
  const maxG = top.length ? top[0][1].orders : 1;
  const govRows = top.map(([g,v])=>`<div class="gov-row">
      <span class="g">${esc(g)}</span>
      <span class="bar"><i style="width:${(v.orders/maxG*100).toFixed(0)}%"></i></span>
      <span class="n">${v.orders} طلب</span>
      <span class="n">${(safeDiv(v.delivered,v.orders)*100).toFixed(0)}% توصيل</span>
    </div>`).join('');
  const rows = list.slice(0,25).map(o=>{
    const st = ORDER_STATE[o.state] || ORDER_STATE.pending;
    return `<tr>
      <td>${arDate(o.date)}</td>
      <td>${esc(o.name)}</td>
      <td class="num">${esc(o.phone)}</td>
      <td>${esc(o.gov)}</td>
      <td class="num">${money(o.total)}</td>
      <td class="mono" style="font-size:11.5px">${o.awb?esc(o.awb):'—'}</td>
      <td><span class="pill ${st.cls}">${st.ar}</span></td>
      <td><span class="hint">${esc(o.checkpoint)}</span></td>
      <td><div class="row-act" style="flex-wrap:wrap;gap:4px">
        <button class="icon-btn" data-chist="${o.id}">تاريخ</button>
        <a class="icon-btn" href="${telLink(o.phone)}">مكالمة</a>
        <button class="icon-btn" data-cwa="${o.id}">واتساب</button>
      </div></td>
    </tr>`;}).join('');
  return `
  <div class="section-title">أوردرات المشترين وحالة الشحن</div>
  <div class="grid g4">
    <div class="card kpi"><div class="k-label">أوردرات الفترة</div><div class="k-val">${num(list.length)}</div>
      <div class="k-foot">جايّة أوتوماتيك من المتجر</div></div>
    <div class="card kpi accent-pine"><div class="k-label">تم التحصيل</div><div class="k-val">${num(cnt('collected'))}</div>
      <div class="k-foot">${(safeDiv(cnt('collected'),list.length)*100).toFixed(0)}% من الأوردرات</div></div>
    <div class="card kpi ${cnt('signed')?'accent-gold':''}"><div class="k-label">تحصيل منتظر</div><div class="k-val">${num(cnt('signed'))}</div>
      <div class="k-foot">اتسلّمت والفلوس جاية</div></div>
    <div class="card kpi"><div class="k-label">مرتجع / ملغي</div>
      <div class="k-val" style="color:var(--brick)">${num(cnt('returned')+cnt('cancelled'))}</div>
      <div class="k-foot">${num(cnt('returned'))} مرتجع · ${num(cnt('cancelled'))} ملغي</div></div>
  </div>

/* شاشة العميل: الحسابات — الربح والخسارة، نسبة التسليم، إيداعات فيسبوك */
function clientFinanceView(client){
  if(!financeData){
    return `<div class="page-head"><div><h2>الحسابات</h2></div></div>
    <div class="card"><p class="hint">بنحسبلك...</p></div>`;
  }
  const f = financeData, cur = client.currency;
  const depRows = (depositsList||[]).map(d=>`
    <tr><td>${arDate(d.date)}</td><td class="mono">${money(d.amount)} <span class="cur">${cur}</span></td>
      <td>${esc(d.note||'')}</td>
      <td><button class="icon-btn" data-deldeposit="${d.id}">حذف</button></td></tr>`).join('');
  const depositsTotal = (depositsList||[]).reduce((s,d)=>s+(Number(d.amount)||0),0);
  return `
  <div class="page-head">
    <div><div class="eyebrow">${esc(client.name)}</div><h2>الحسابات</h2></div>
    <div class="spacer"></div>
    <div class="seg" id="clientTabs">
      <button data-ctab="dash" aria-pressed="false">الداشبورد</button>
      <button data-ctab="add" aria-pressed="false">الأوردرات</button>
      ${client.inventoryEnabled ? `<button data-ctab="inventory" aria-pressed="${clientTab==='inventory'}">المخزون</button>` : ''}
      ${client.customerServiceEnabled ? `<button data-ctab="service" aria-pressed="${clientTab==='service'}">خدمة العملاء</button>` : ''}
      <button data-ctab="products" aria-pressed="false">منتجاتي</button>
      <button data-ctab="customers" aria-pressed="${clientTab==='customers'}">العملاء</button>
      <button data-ctab="finance" aria-pressed="true">الحسابات</button>
      <button data-ctab="wallet" aria-pressed="${clientTab==='wallet'}">المحفظة</button>
      <button data-ctab="integrations" aria-pressed="false">التكاملات</button>
    </div>
  </div>

  <div class="grid g4">
    <div class="card kpi"><div class="k-label">أوردرات النهارده</div>
      <div class="k-val mono" id="liveOrderCount">${num(f.ordersToday)}</div></div>
    <div class="card kpi"><div class="k-label">نسبة التسليم</div>
      <div class="k-val mono">${f.deliveryRatePct}<span class="cur">%</span></div>
      <div class="k-foot">${f.deliveryRateMode==='manual'?'يدوية':'تلقائية من سجل الحالات'}</div></div>
    <div class="card kpi"><div class="k-label">تكلفة الأوردر — قبل نسبة التسليم</div>
      <div class="k-val mono">${money(f.cpaBeforeRate)} <span class="cur">${cur}</span></div></div>
    <div class="card kpi"><div class="k-label">تكلفة الأوردر — بعد نسبة التسليم</div>
      <div class="k-val mono">${money(f.cpaAfterRate)} <span class="cur">${cur}</span></div></div>
  </div>

  <div class="section-title">الأرباح</div>
  <div class="grid g3">
    <div class="card kpi accent-gold"><div class="k-label">أرباح منتظرة (وصلت ولسه ما اتحصّلتش)</div>
      <div class="k-val mono">${money(f.profitPending)} <span class="cur">${cur}</span></div>
      <div class="k-foot">${num(f.counts.pendingCollection)} أوردر</div></div>
    <div class="card kpi accent-pine"><div class="k-label">أرباح محصّلة فعلاً</div>
      <div class="k-val mono">${money(f.profitCollected)} <span class="cur">${cur}</span></div>
      <div class="k-foot">${num(f.counts.collected)} أوردر</div></div>
    <div class="card kpi"><div class="k-label">أرباح متوقعة (كل المرفوع × نسبة التسليم)</div>
      <div class="k-val mono">${money(f.profitExpected)} <span class="cur">${cur}</span></div>
      <div class="k-foot">إيراد متوقع ${money(f.revenueExpected)} ${cur}</div></div>
  </div>

  <div class="section-title">هامش ربح متوقع</div>
  <div class="grid g3">
    <div class="card kpi ${f.profitMarginExpectedPct>=0?'accent-pine':''}">
      <div class="k-label">هامش الربح المتوقع</div>
      <div class="k-val mono" style="color:${f.profitMarginExpectedPct>=0?'var(--pine)':'var(--brick)'}">${f.profitMarginExpectedPct} <span class="cur">%</span></div>
      <div class="k-foot">صافي الربح المتوقع ÷ الإيراد المتوقع</div>
    </div>
  </div>

    <div class="form-grid">
      <div class="field" style="display:flex;align-items:center;gap:8px;padding-top:22px">
        <input type="checkbox" id="f_rate_manual" style="width:auto" ${f.deliveryRateMode==='manual'?'checked':''}>

      </div>
      <div class="field"><label>النسبة %</label>
        <input id="f_rate_value" type="number" min="0" max="100" step="0.1"
          value="${f.deliveryRateMode==='manual'?f.deliveryRatePct:''}" placeholder="مثال: 75"></div>
    </div>
    <div class="form-actions"><button class="btn sm" id="saveDeliveryRate">حفظ</button>
      <span class="hint">مبلغ الإدارة الثابت لكل أوردر: ${money(f.adminFee)} ${cur}</span></div>
  </div>

  <div class="section-title">إيداعات فيسبوك</div>

    <div class="form-grid">
      <div class="field"><label>المبلغ</label><input id="dep_amount" type="number" min="0" step="0.01" placeholder="0"></div>
      <div class="field"><label>التاريخ</label><input id="dep_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field" style="grid-column:1/-1"><label>ملاحظة (اختياري)</label><input id="dep_note" placeholder="مثال: شحن رصيد الحملة"></div>
    </div>
    <div class="form-actions"><button class="btn sm" id="addDeposit">إضافة إيداع</button></div>
  </div>

    ${depositsList && depositsList.length ? `<tfoot><tr><td><b>الإجمالي</b></td><td class="mono"><b>${money(depositsTotal)} ${cur}</b></td><td></td><td></td></tr></tfoot>` : ''}
  </table></div>

  <div class="section-title">كل حركاتي المالية</div>
  ${(() => {
    const list = clientTxList || [];
    const inc = list.filter(t=>t.type==='income'), exp = list.filter(t=>t.type==='expense');
    const income = inc.reduce((s,t)=>s+Number(t.amount||0),0), expense = exp.reduce((s,t)=>s+Number(t.amount||0),0);
    const net = income - expense;
    const txRows = list.slice(0,60).map(t=>`
      <tr><td>${arDate(t.date)}</td>
        <td><span class="pill ${t.type==='income'?'on':'off'}">${t.type==='income'?'تحصيل':'مصروف'}</span></td>
        <td>${esc(t.category)}</td>
        <td class="num" style="color:${t.type==='income'?'var(--pine)':'var(--brick)'}">${t.type==='income'?'+':'−'}${money(t.amount)} ${esc(t.currency||cur)}</td>
        <td>${esc(t.note||'')}</td>
        <td><button class="icon-btn" data-cdeltx="${esc(t.id)}">حذف</button></td></tr>`).join('');

    <div class="grid g3">
      <div class="card kpi accent-pine"><div class="k-label">إجمالي التحصيلات</div>
        <div class="k-val mono" style="color:var(--pine)">${money(income)} <span class="cur">${cur}</span></div></div>
      <div class="card kpi"><div class="k-label">إجمالي المصاريف</div>
        <div class="k-val mono" style="color:var(--brick)">${money(expense)} <span class="cur">${cur}</span></div></div>
      <div class="card kpi ${net>=0?'accent-gold':''}"><div class="k-label">الصافي</div>
        <div class="k-val mono" style="color:${net>=0?'var(--pine)':'var(--brick)'}">${money(net)} <span class="cur">${cur}</span></div></div>
    </div>
    <div class="card" style="margin-top:10px">
      <div class="form-grid">
        <div class="field"><label>النوع</label><select id="ct_type">
          <option value="expense">مصروف</option><option value="income">تحصيل / إيراد</option></select></div>
        <div class="field"><label>البند</label><select id="ct_cat">${EXPENSE_CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
        <div class="field"><label>المبلغ</label><input id="ct_amount" type="number" min="0" step="0.01" placeholder="0"></div>

/* شاشة العميل: إدارة التخزين والشحن — الأوردرات المؤكدة الجاهزة للتغليف والشحن */

  const thresholdInput = p => `
        <span class="hint">الحد الأدنى</span>
        <input type="number" min="0" class="mono" data-thresholdedit="${p.id}" value="${num(p.lowStockThreshold)}"
          style="width:64px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px;text-align:center">`;
  const stockRow = p => `
    <div class="card" style="margin-bottom:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">

  const lowStockSection = lowStock.length ? `

async function showCustomerModal(customerId){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(18,33,43,.55);z-index:200;display:grid;place-items:center;padding:18px;overflow-y:auto';
  wrap.innerHTML = `<div class="card" style="max-width:560px;width:100%;box-shadow:var(--shadow)"><p class="hint">بنجيب بيانات العميل...</p></div>`;
  document.body.appendChild(wrap);
  const close = ()=> document.body.removeChild(wrap);
  wrap.onclick = ev => { if(ev.target === wrap) close(); };
  try{
    const c = await api('/api/customers/'+encodeURIComponent(customerId));
    const orderRow = o => `
      <tr><td>${arDate(o.date)}</td><td>${esc(o.product||'')}</td>
        <td class="num">${money(o.total)}</td>
        <td><span class="pill ${ORDER_STATE[o.state]?ORDER_STATE[o.state].cls:''}">${ORDER_STATE[o.state]?ORDER_STATE[o.state].ar:esc(o.state)}</span></td></tr>`;
    wrap.innerHTML = `
      <div class="card" style="max-width:560px;width:100%;box-shadow:var(--shadow);max-height:85vh;overflow-y:auto">
        <h3 style="font-size:16px;margin-bottom:2px">${esc(c.name||'بدون اسم')}</h3>
        <p class="hint mono" style="margin-bottom:12px">${esc(c.phone)}${c.gov?' · '+esc(c.gov):''}${c.address?' · '+esc(c.address):''}</p>
        <div class="field"><label>اسم العميل</label><input id="custName" value="${esc(c.name||'')}"></div>
        <div class="field"><label>تاجات (افصل بفاصلة)</label><input id="custTags" value="${esc((c.tags||[]).join('، '))}" placeholder="مثال: VIP، بيرجع كتير"></div>
        <div class="field"><label>ملاحظة</label><input id="custNote" value="${esc(c.note||'')}"></div>
        <div class="form-actions" style="margin-top:8px;margin-bottom:14px">
          <button class="btn sm" id="custSave">حفظ</button>
        </div>
        <div class="section-title" style="margin:0 0 8px">تاريخ الأوردرات (${num(c.orders.length)})</div>
        <div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المنتج</th><th>الإجمالي</th><th>الحالة</th></tr></thead>
          <tbody>${c.orders.map(orderRow).join('') || '<tr><td colspan="4" class="empty">مفيش أوردرات.</td></tr>'}</tbody></table></div>
        <div class="form-actions" style="margin-top:12px"><button class="btn sm line" id="custClose">قفل</button></div>
      </div>`;
    wrap.querySelector('#custClose').onclick = close;
    wrap.querySelector('#custSave').onclick = async ()=>{
      const name = wrap.querySelector('#custName').value.trim();
      const note = wrap.querySelector('#custNote').value.trim();
      const tags = wrap.querySelector('#custTags').value.split(/[،,]/).map(s=>s.trim()).filter(Boolean);
      try{
        await api('/api/customers/'+encodeURIComponent(customerId), {method:'PATCH', body:JSON.stringify({name, note, tags})});
        DB.customers = await api('/api/customers');
        toast('اتحفظت بيانات العميل'); close(); paint(true);
      }catch(e){ toast(e.message); }
    };
  }catch(e){ wrap.innerHTML = `<div class="card"><p class="hint">${esc(e.message)}</p></div>`; }
}

/* قسم اقتصاديات الأوردر الواحد */
function econSection(ec, cur){
  if(!ec.ready) return `
  <div class="section-title">اقتصاديات الأوردر الواحد</div>
  <div class="card"><div class="empty"><b>لسه ما اتحددش سعر الأوردر ومصاريفه</b>فريق كن أونلاين هيضيفهم من لوحة الإدارة وهتلاقي التحليل هنا.</div></div>`;

  const price = ec.e.price;
  const pct = v => safeDiv(v, price)*100;
  const segs = ec.items.filter(i=>i.v>0)
    .map(i=>`<i style="width:${pct(i.v).toFixed(2)}%;background:${i.color}" title="${i.label}"></i>`).join('')
    + (ec.ad>0 ? `<i style="width:${Math.min(100,pct(ec.ad)).toFixed(2)}%;background:var(--gold)" title="التكلفة الإعلانية"></i>` : '')
    + (ec.net>0 ? `<i style="width:${pct(ec.net).toFixed(2)}%;background:var(--pine)" title="صافي الربح"></i>` : '');

  const rows = ec.items.map(i=>`<li>
      <span class="sw" style="background:${i.color}"></span>
      <span class="g">${i.label}</span>
      <span class="v">${money(i.v,1)}</span><span class="p">${pct(i.v).toFixed(0)}%</span></li>`).join('');

  return `
  <div class="section-title">اقتصاديات الأوردر الواحد</div>
  <div class="grid g4">
    <div class="card kpi"><div class="k-label">إجمالي سعر الأوردر</div>
      <div class="k-val">${money(price,1)}<span class="cur">${cur}</span></div>
      <div class="k-foot">سعر البيع للعميل النهائي</div></div>
    <div class="card kpi"><div class="k-label">مصاريف الأوردر الضمنية</div>
      <div class="k-val">${money(ec.implicit,1)}<span class="cur">${cur}</span></div>
      <div class="k-foot">${pct(ec.implicit).toFixed(0)}% من سعر الأوردر</div></div>
    <div class="card kpi accent-gold"><div class="k-label"><i class="dot gold"></i>التكلفة الإعلانية للطلب</div>
      <div class="k-val">${money(ec.ad,1)}<span class="cur">${cur}</span></div>
      <div class="k-foot">${ec.healthy
        ? `في الأمان — الحد الأقصى ${money(ec.breakeven,1)}`
        : `<span style="color:var(--brick)">أعلى من الحد الأقصى ${money(ec.breakeven,1)}</span>`}</div></div>
    <div class="card kpi ${ec.net>=0?'accent-pine':''}"><div class="k-label">ربح الأوردر الواحد</div>
      <div class="k-val" style="color:${ec.net>=0?'var(--pine)':'var(--brick)'}">${money(ec.net,1)}<span class="cur">${cur}</span></div>
      <div class="k-foot">هامش ${ec.margin.toFixed(1)}%</div></div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="chart-head">
      <h3>سعر الأوردر بيروح فين</h3>
      <span class="legend" style="font-size:12px">أقصى تكلفة إعلانية تقدر تدفعها للطلب:
        <b class="mono" style="margin-inline-start:5px">${money(ec.breakeven,1)} ${cur}</b></span>
    </div>
    <div class="split">${segs}</div>
    <ul class="cost-list">
      ${rows}
      <li class="sum"><span class="sw" style="background:var(--ink-3)"></span><span class="g">إجمالي المصاريف الضمنية</span>
        <span class="v">${money(ec.implicit,1)}</span><span class="p">${pct(ec.implicit).toFixed(0)}%</span></li>
      <li><span class="sw" style="background:var(--gold)"></span><span class="g">التكلفة الإعلانية (فعلية)</span>
        <span class="v">${money(ec.ad,1)}</span><span class="p">${pct(ec.ad).toFixed(0)}%</span></li>
      <li class="sum"><span class="sw" style="background:${ec.net>=0?'var(--pine)':'var(--brick)'}"></span>
        <span class="g">صافي ربح الأوردر</span>
        <span class="v" style="color:${ec.net>=0?'var(--pine)':'var(--brick)'}">${money(ec.net,1)}</span>
        <span class="p">${ec.margin.toFixed(0)}%</span></li>
    </ul>
    <p class="hint" style="margin-top:10px">الربح قبل الإعلان ${money(ec.contribution,1)} ${cur} (${ec.marginBefore.toFixed(0)}%) — ده الرقم اللي بنبني عليه سقف الميزانية.</p>

`;

/* التحصيل ما يتسجّلش من غير تكاليفه — النافذة دي بتطلبها */
function askCosts(order){
  return new Promise(resolve=>{
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(18,33,43,.55);z-index:200;display:grid;place-items:center;padding:18px';
    wrap.innerHTML = `
      <div class="card" style="max-width:420px;width:100%;box-shadow:var(--shadow)">
        <h3 style="font-size:16px;margin-bottom:4px">تسجيل التحصيل</h3>
        <p class="hint" style="margin-bottom:14px">${esc(order.name||'')} — إجمالي ${money(order.total)}.
          محتاجين تكاليف الأوردر عشان الربح يطلع صح.</p>
        <div class="field"><label>سعر الشحن</label>
          <input id="ac_ship" type="number" min="0" step="0.01" value="${order.shippingCost!=null?order.shippingCost:''}" placeholder="0"></div>
        <div class="field"><label>مصاريف أخرى</label>
          <input id="ac_other" type="number" min="0" step="0.01" value="${order.otherCost!=null?order.otherCost:0}" placeholder="0"></div>
        <div class="form-actions">
          <button class="btn sm" id="ac_ok">تأكيد التحصيل</button>
          <button class="btn sm line" id="ac_cancel">إلغاء</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const close = v => { document.body.removeChild(wrap); resolve(v); };
    wrap.querySelector('#ac_cancel').onclick = ()=> close(null);
    wrap.onclick = ev => { if(ev.target === wrap) close(null); };
    const ship = wrap.querySelector('#ac_ship');
    ship.focus();
    wrap.querySelector('#ac_ok').onclick = ()=>{
      const sv = ship.value, ov = wrap.querySelector('#ac_other').value;
      if(sv === ''){ toast('اكتب سعر الشحن'); return; }
      close({ shippingCost: Number(sv)||0, otherCost: Number(ov)||0 });
    };
  });
}

/** بيفتح فوراً أول ما تختار حالة "مرتجع" — لازم تحدد نوع المرتجع (وقيمة الاسترداد لو جزئي)
    قبل ما نأكّد، عشان تحديث المخزون وتسجيل الاسترداد يبقوا صح من أول مرة */
function askReturnDetails(order){
  return new Promise(resolve=>{
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(18,33,43,.55);z-index:200;display:grid;place-items:center;padding:18px';
    wrap.innerHTML = `
      <div class="card" style="max-width:420px;width:100%;box-shadow:var(--shadow)">
        <h3 style="font-size:16px;margin-bottom:4px">تسجيل مرتجع</h3>
        <p class="hint" style="margin-bottom:14px">${esc(order.name||'')} — إجمالي الأوردر ${money(order.total)}.
          ${order.productId ? 'الكمية هترجع تلقائي للمخزون.' : ''}</p>
        <div class="field"><label>نوع المرتجع</label>
          <select id="rt_type">
            <option value="full">مرتجع كامل — استرداد المبلغ بالكامل</option>
            <option value="partial">مرتجع جزئي — استرداد جزء من المبلغ</option>
            <option value="exchange">استبدال — العميل هياخد منتج بدل الأوردر</option>
          </select>
        </div>
        <div class="field" id="rt_amount_field"><label>قيمة الاسترداد</label>
          <input id="rt_amount" type="number" min="0" step="0.01" value="${money(order.total)}"></div>
        <div class="form-actions">
          <button class="btn sm" id="rt_ok">تأكيد المرتجع</button>
          <button class="btn sm line" id="rt_cancel">إلغاء</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const close = v => { document.body.removeChild(wrap); resolve(v); };
    wrap.querySelector('#rt_cancel').onclick = ()=> close(null);
    wrap.onclick = ev => { if(ev.target === wrap) close(null); };
    const typeSel = wrap.querySelector('#rt_type');
    const amountField = wrap.querySelector('#rt_amount_field');
    const amountInput = wrap.querySelector('#rt_amount');
    const syncAmountField = ()=>{
      if(typeSel.value==='full'){ amountInput.value = money(order.total); amountField.style.opacity='0.55'; amountInput.disabled=true; }
      else if(typeSel.value==='exchange'){ amountField.style.opacity='0.55'; amountInput.disabled=true; }
      else { amountField.style.opacity='1'; amountInput.disabled=false; }
    };
    typeSel.onchange = syncAmountField;
    syncAmountField();
    wrap.querySelector('#rt_ok').onclick = ()=>{
      const returnType = typeSel.value;
      if(returnType==='partial' && (amountInput.value===''||Number(amountInput.value)<0)){
        toast('اكتب قيمة الاسترداد'); return;
      }
      close({ returnType, refundAmount: returnType==='exchange' ? 0 : (Number(amountInput.value)||0) });
    };
  });
}

function waLink(phone, text){
  let p = String(phone||'').replace(/[^\d]/g,'');
  if(p.startsWith('0')) p = '20' + p.slice(1);
  else if(!p.startsWith('20')) p = '20' + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}
function telLink(phone){
  let p = String(phone||'').replace(/[^\d]/g,'');
  if(p.startsWith('0')) p = '20' + p.slice(1);
  else if(!p.startsWith('20')) p = '20' + p;
  return `tel:+${p}`;
}
/** أكواد إيزي أوردرز بتيجي أحيانًا UUID طويل — نعرضه مختصر، من غير ما نلمس المعرّف الحقيقي المستخدم في الأزرار */
function shortOrderRef(id){
  const s = String(id||'');
  return s.length>14 ? ('…'+s.slice(-8)) : s;
}

function renderMentions(text){
  let out = esc(text);
  teamUsers.forEach(u=>{
    const name = (u.name||u.email||'').trim();
    if(!name) return;
    const re = new RegExp('@'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g');
    out = out.replace(re, `<span class="mention">@${esc(name)}</span>`);
  });
  return out;
}

  }
  const rows = chatMsgList.map(m=>`
    <div class="chat-msg ${m.author_id===MYUID?'mine':''}">

async function openChatPanel(){
  document.getElementById('chatPanel').classList.remove('hidden');
  try{
    if(!teamUsers.length) teamUsers = await api('/api/users');
    const chanQs = chatChannel ? ('?clientId='+encodeURIComponent(chatChannel)) : '';
    chatMsgList = await api('/api/chat/messages'+chanQs);
    taskList = await api('/api/tasks');
    await api('/api/chat/seen',{method:'POST'});
    await refreshChatBadge();
  }catch(e){}
  bindAndRenderChatPanel();
}
function closeChatPanel(){ document.getElementById('chatPanel').classList.add('hidden'); }
function bindAndRenderChatPanel(){
  document.getElementById('chatPanelBody').innerHTML = renderChatPanel();
  document.querySelectorAll('#chatPanelTabs button').forEach(b=> b.setAttribute('aria-pressed', b.dataset.cpt===chatPanelTab?'true':'false'));
  document.querySelectorAll('#chatChannelSeg button').forEach(b=> b.onclick = async ()=>{
    chatChannel = b.dataset.chan || null;
    const chanQs = chatChannel ? ('?clientId='+encodeURIComponent(chatChannel)) : '';
    try{ chatMsgList = await api('/api/chat/messages'+chanQs); }catch(e){}
    bindAndRenderChatPanel();
  });
  const sendBtn = document.getElementById('chatSendBtn');
  if(sendBtn) sendBtn.onclick = async ()=>{
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;
    try{
      const chanQs = chatChannel ? ('?clientId='+encodeURIComponent(chatChannel)) : '';
      await api('/api/chat/messages'+chanQs, {method:'POST', body:JSON.stringify({text})});
      input.value='';
      chatMsgList = await api('/api/chat/messages'+chanQs);
      bindAndRenderChatPanel();
    }catch(e){ toast(e.message); }
  };
  const chatInput = document.getElementById('chatInput');
  if(chatInput) chatInput.onkeydown = ev=>{ if(ev.key==='Enter' && !document.querySelector('.mention-list')) sendBtn.click(); };
  if(chatInput) chatInput.oninput = ()=>{
    const existing = document.querySelector('.mention-list');
    if(existing) existing.remove();
    const v = chatInput.value;
    const at = v.lastIndexOf('@');
    if(at===-1 || /\s/.test(v.slice(at+1))) return;
    const q = v.slice(at+1).toLowerCase();
    const matches = teamUsers.filter(u=>(u.name||u.email||'').toLowerCase().includes(q)).slice(0,6);
    if(!matches.length) return;
    const list = document.createElement('div');
    list.className = 'mention-list';
    list.innerHTML = matches.map(u=>`<button type="button" data-mname="${esc(u.name||u.email)}">${esc(u.name||u.email)}</button>`).join('');
    chatInput.parentElement.style.position = 'relative';
    chatInput.parentElement.appendChild(list);
    list.querySelectorAll('button').forEach(b=> b.onclick = ()=>{
      chatInput.value = v.slice(0,at) + '@' + b.dataset.mname + ' ';
      list.remove(); chatInput.focus();
    });
  };
  const addTaskBtn = document.getElementById('addTaskBtn');
  if(addTaskBtn) addTaskBtn.onclick = async ()=>{
    const title = document.getElementById('newTaskTitle').value.trim();
    if(!title){ toast('اكتب عنوان التاسك'); return; }
    const body = { title, assignedTo: document.getElementById('newTaskAssignee').value,
      description: document.getElementById('newTaskDesc').value.trim() };
    try{
      await api('/api/tasks', {method:'POST', body:JSON.stringify(body)});
      taskList = await api('/api/tasks');
      bindAndRenderChatPanel(); toast('اتضاف التاسك');
    }catch(e){ toast(e.message); }
  };
  document.querySelectorAll('[data-tasktoggle]').forEach(b=> b.onclick = async ()=>{
    try{
      await api('/api/tasks/'+b.dataset.tasktoggle, {method:'PATCH', body:JSON.stringify({status:b.dataset.next})});
      taskList = await api('/api/tasks');
      bindAndRenderChatPanel();
    }catch(e){ toast(e.message); }
  });
}

}

let deferredInstallPrompt = null;
function setupInstallButton(){
  const btn = document.getElementById('installAppBtn');
  if(!btn) return;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isStandalone) return; /* متثبت بالفعل */
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    btn.classList.remove('hidden');
  });

  if(isIOS){ btn.classList.remove('hidden'); } /* آبل مابتدعمش الزرار البرمجي، فنوريه دايمًا مع تعليمات يدوية */

  btn.onclick = async ()=>{
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if(choice.outcome==='accepted') btn.classList.add('hidden');
      return;
    }
    if(isIOS){
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;inset:0;background:rgba(18,33,43,.55);z-index:200;display:grid;place-items:center;padding:18px';
      wrap.innerHTML = `
        <div class="card" style="max-width:340px;width:100%;box-shadow:var(--shadow)">
          <h3 style="font-size:16px;margin-bottom:10px">تثبيت التطبيق على آيفون</h3>
          <ol style="padding-inline-start:20px;font-size:13.5px;line-height:2">
            <li>دوس زرار المشاركة <span class="mono">⬆️</span> تحت في سفاري</li>
            <li>اختار "Add to Home Screen" / "إضافة إلى الشاشة الرئيسية"</li>
            <li>دوس "إضافة" فوق يمين</li>
          </ol>
          <div class="form-actions" style="margin-top:12px"><button class="btn sm" id="iosInstallClose">تمام</button></div>
        </div>`;
      document.body.appendChild(wrap);
      const close = ()=> document.body.removeChild(wrap);
      wrap.querySelector('#iosInstallClose').onclick = close;
      wrap.onclick = ev => { if(ev.target === wrap) close(); };
      return;
    }
    toast('التطبيق متثبت بالفعل أو المتصفح مش بيدعم التثبيت المباشر');
  };
}

let orderFilter = 'all';
let orderStateFilter = 'all';
let orderFormClient = null;
let csClientFilter = null;
/* رمز مميز لكل متجر في شريط الأيقونات — بيدور حسب ترتيب العملاء */
const STORE_ICONS = ['🏬','🛍️','📦','🧵','👗','🧴','🧸','💄','👜','⌚'];
function storeIcon(idx){ return STORE_ICONS[idx % STORE_ICONS.length]; }

/* قسم خدمة العملاء — أيقونة لكل متجر فوق، واختيار متجر يعرض أوردراته بمراحله.
   التغيير الفعلي بيحصل من الكارت نفسه، وأي أوردر بيختفي تلقائي من عموده أول ما حالته تتغيّر */
function adminCustomerService(){

    ['confirmed', 'التجهيز والتغليف', 'mid'],

      <div class="hint mono" style="font-size:11.5px">${esc(o.phone)}</div>
      <div class="hint" style="font-size:11.5px;margin-top:2px">📍 ${esc(o.gov||'')}${o.gov&&o.address?' — ':''}${esc(o.address||'')}</div>
      <div style="font-size:12.5px;margin-top:4px"><b>${esc(o.product||'')}</b>${o.qty>1?` × ${num(o.qty)}`:''}
        ${o.productNote?`<div class="hint" style="font-size:11px">${esc(o.productNote)}</div>`:''}</div>
      ${csClientFilter==='all' ? `<div class="hint" style="font-size:11px;margin-top:2px">${esc(c?c.name.split(' —')[0]:'—')}</div>` : ''}

      <input data-noteinput="${o.id}" value="${esc(o.note||'')}" placeholder="ملاحظة على الأوردر"

      <input class="mono" data-awb="${o.id}" value="${esc(o.awb||'')}" placeholder="رقم البوليصة"

        <button class="icon-btn" data-wa="${o.id}">واتساب</button>
        <button class="icon-btn" data-notesave="${o.id}">حفظ الملاحظة</button>
        ${may('orders_delete') ? `<button class="icon-btn" data-delorder="${o.id}" style="color:var(--brick)">حذف</button>` : ''}
      </div>
    </div>`;
  };
  const deferredCardFor = o => {
    const c = DB.clients.find(x=>x.id===o.clientId);
    return `<div class="card" style="margin-bottom:8px;padding:10px 12px">
      <div style="font-weight:700;font-size:13px">${esc(o.name)}</div>
      <div class="hint mono" style="font-size:11.5px">${esc(o.phone)}</div>
      ${csClientFilter==='all' ? `<div class="hint" style="font-size:11px">${esc(c?c.name.split(' —')[0]:'—')}</div>` : ''}
      <div style="font-size:12.5px;margin-top:4px"><b>${esc(o.product||'')}</b>${o.qty>1?` × ${num(o.qty)}`:''}</div>
      <div class="pill wait" style="margin-top:6px">هيرجع يوم ${arDate(o.deferUntil)}</div>
      <div class="row-act" style="flex-wrap:wrap;gap:4px;margin-top:8px">
        <select data-st="${o.id}" style="padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px">${stOpts(o)}</select>
        <button class="icon-btn" data-hist="${o.id}">تاريخ</button>
      </div>
    </div>`;
  };

  <div class="page-head">
    <div><h2>خدمة العملاء</h2></div>
  </div>
  <div class="seg" id="csStoreTabs" style="flex-wrap:wrap;margin-bottom:14px">

  <div class="grid g3">

      const list = scoped.filter(o=>o.state===state).sort((a,b)=> a.date<b.date?1:-1);

}

  <div class="section-title">كل الأوردرات</div>
  <div class="page-head" style="padding:0 0 12px">
    <span class="hint">${num(list.length)} أوردر · منهم ${num(manual.length)} مسجّل يدوي</span>

    <div class="seg" id="orderFilter">
      <button data-of="all" aria-pressed="${orderFilter==='all'}">الكل</button>

function adminFunding(){
  const clientOpts = DB.clients.map(c=>`<option value="${c.id}">${esc(c.name)} (${c.currency})</option>`).join('');
  const rows = DB.funding.slice().sort((a,b)=> a.date<b.date?1:-1).map(f=>{
    const c = DB.clients.find(c=>c.id===f.clientId);
    return `<tr>
      <td>${arDate(f.date)}</td><td>${esc(c?c.name:'—')}</td>
      <td><span class="pill ${f.type==='deposit'?'on':'off'}">${f.type==='deposit'?'إيداع':'خصم'}</span></td>
      <td class="num">${money(f.amount)} ${c?c.currency:''}</td>
      <td>${esc(f.note||'')}</td>
      <td><button class="icon-btn" data-delfund="${f.id}">حذف</button></td>
    </tr>`;
  }).join('');
  const balances = DB.clients.map(c=>{
    const f = realBalanceState(c);
    return `<div class="card kpi">
      <div class="k-label">${esc(c.name)}</div>
      <div class="k-val" style="color:${f.days<7?'var(--brick)':'inherit'}">${f.balance!=null?money(f.balance):'—'}<span class="cur">${c.currency}</span></div>
      <div class="k-foot">يكفي ${f.days===Infinity?'—':Math.floor(f.days)} يوم بمعدل ${money(f.avgDaily)}/يوم</div>
    </div>`;
  }).join('');
  return `
  <div class="section-title">أرصدة التمويل الحالية</div>
  <div class="grid g3">${balances}</div>
  <div class="section-title">إضافة حركة تمويل</div>
  <div class="card">
    <div class="form-grid">
      <div class="field"><label>العميل</label><select id="fu_client">${clientOpts}</select></div>
      <div class="field"><label>النوع</label><select id="fu_type"><option value="deposit">إيداع تمويل</option><option value="withdraw">خصم / استرداد</option></select></div>
      <div class="field"><label>المبلغ</label><input id="fu_amount" type="number" min="0" step="0.01" placeholder="0"></div>
      <div class="field"><label>التاريخ</label><input id="fu_date" type="date" value="${today()}"></div>
      <div class="field" style="grid-column:1/-1"><label>ملاحظة</label><input id="fu_note" type="text" placeholder="تحويل بنكي / فودافون كاش..."></div>
    </div>
    <div class="form-actions"><button class="btn sm" id="saveFunding">تسجيل الحركة</button>
    <span class="hint">الرصيد = إجمالي الإيداعات − إجمالي الإنفاق الإعلاني المسجّل.</span></div>
  </div>
  <div class="section-title">كشف الحركات</div>
  <div class="table-wrap"><table>
    <thead><tr><th>التاريخ</th><th>العميل</th><th>النوع</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" class="empty">مفيش حركات.</td></tr>'}</tbody>
  </table></div>`;
}

/* نموذج المنتج مشترك بين الإدارة وصاحب المتجر */
function bindProductForm(refresh, clientIdFn){
  const $ = id => document.getElementById(id);
  const sp = $('saveProduct');
  if(!sp) return;
  sp.onclick = async ()=>{
    const name = $('p_name').value.trim();
    if(!name){ toast('اكتب اسم المنتج'); return; }
    const body = { name, sku:$('p_sku').value.trim(), category:($('p_category')?$('p_category').value.trim():''),
      price:+$('p_price').value||0, cost:+$('p_cost').value||0,
      stock: Math.max(0, +$('p_stock').value||0), lowStockThreshold: Math.max(0, +$('p_lowstock').value||5),
      active: $('p_active').value === '1' };
    if(clientIdFn) body.clientId = clientIdFn();
    if(editingProduct) body.id = editingProduct.id;
    try{
      await api('/api/products',{method:'POST', body:JSON.stringify(body)});
      editingProduct=null; await refresh(); paint(); toast('اتحفظ');
    }catch(e){ toast(e.message); }
  };
  const cp = $('cancelProduct'); if(cp) cp.onclick = ()=>{ editingProduct=null; paint(); };
  document.querySelectorAll('[data-editp]').forEach(b=> b.onclick = ()=>{
    editingProduct = (DB.products||[]).find(x=>x.id===b.dataset.editp); paint(); });
  document.querySelectorAll('[data-delp]').forEach(b=> b.onclick = async ()=>{
    if(!confirm('هتمسح المنتج ده. تكمل؟')) return;
    try{ await api('/api/products/'+encodeURIComponent(b.dataset.delp),{method:'DELETE'});
      await refresh(); paint(true); toast('اتحذف');
    }catch(e){ toast(e.message); }
  });
  document.querySelectorAll('[data-variants]').forEach(b=> b.onclick = ()=>{
    const p = (DB.products||[]).find(x=>x.id===b.dataset.variants);
    if(p) showVariantsModal(p);
  });
}

async function showVariantsModal(product){

  let list = [];
  try{ list = await api('/api/products/'+encodeURIComponent(product.id)+'/variants'); }catch(e){ toast(e.message); }

    <div class="card" style="margin-bottom:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">

        <button class="icon-btn" data-delvar="${v.id}">حذف</button>
      </div>

  const paintList = () => {
    const box = wrap.querySelector('#varList');
    box.innerHTML = list.map(variantRow).join('') || '<p class="hint">لسه مفيش متغيرات (ألوان/مقاسات) لهذا المنتج.</p>';
    box.querySelectorAll('[data-delvar]').forEach(b=> b.onclick = async ()=>{
      if(!confirm('متأكد إنك عايز تحذف المتغير ده؟')) return;
      try{
        await api('/api/variants/'+encodeURIComponent(b.dataset.delvar), {method:'DELETE'});
        list = list.filter(x=>x.id!==b.dataset.delvar);
        paintList(); toast('اتحذف المتغير');
      }catch(e){ toast(e.message); }
    });
    box.querySelectorAll('[data-addstockvar]').forEach(b=> b.onclick = async ()=>{
      const delta = +prompt('هتضيف كام قطعة؟') || 0;
      if(delta<=0) return;
      try{
        await api('/api/variants/'+encodeURIComponent(b.dataset.addstockvar)+'/stock/add',
          {method:'POST', body:JSON.stringify({delta, note:'إضافة يدوية'})});
        list = await api('/api/products/'+encodeURIComponent(product.id)+'/variants');
        paintList(); toast('اتضافت الكمية');
      }catch(e){ toast(e.message); }
    });
  };
  wrap.innerHTML = `
    <div class="card" style="max-width:480px;width:100%;box-shadow:var(--shadow);max-height:85vh;overflow-y:auto">
      <h3 style="font-size:16px;margin-bottom:2px">متغيرات: ${esc(product.name)}</h3>
      <p class="hint" style="margin-bottom:12px">كل متغير له مخزون مستقل، ولو محتاج سعر مختلف عن المنتج الأصلي اكتبه.</p>

      <div class="form-grid" style="margin-top:10px">
        <div class="field" style="grid-column:span 2"><label>اسم المتغير</label><input id="varName" placeholder="مثال: أحمر — مقاس L"></div>
        <div class="field"><label>الكود (SKU) اختياري</label><input id="varSku"></div>
        <div class="field"><label>الكمية</label><input id="varStock" type="number" min="0" value="0"></div>
        <div class="field" style="grid-column:span 2"><label>سعر خاص (اختياري — سيبه فاضي يستخدم سعر المنتج)</label>

        <button class="btn sm" id="varSave">إضافة متغير</button>
        <button class="btn sm line" id="varClose">قفل</button>
      </div>
    </div>`;
  paintList();
  wrap.querySelector('#varClose').onclick = close;
  wrap.onclick = ev => { if(ev.target === wrap) close(); };
  wrap.querySelector('#varSave').onclick = async ()=>{
    const name = wrap.querySelector('#varName').value.trim();
    if(!name){ toast('اكتب اسم المتغير'); return; }
    const sku = wrap.querySelector('#varSku').value.trim();
    const stock = Math.max(0, +wrap.querySelector('#varStock').value || 0);
    const priceRaw = wrap.querySelector('#varPrice').value;
    const price = priceRaw === '' ? null : Math.max(0, +priceRaw || 0);
    try{
      await api('/api/products/'+encodeURIComponent(product.id)+'/variants',
        {method:'POST', body:JSON.stringify({name, sku, stock, price})});
      list = await api('/api/products/'+encodeURIComponent(product.id)+'/variants');
      wrap.querySelector('#varName').value=''; wrap.querySelector('#varSku').value='';
      wrap.querySelector('#varStock').value='0'; wrap.querySelector('#varPrice').value='';
      paintList(); toast('اتضاف المتغير');
    }catch(e){ toast(e.message); }
  };
}

/* قارئ CSV بسيط بيتعامل مع علامات التنصيص والفواصل جوه الخانات */
function parseCSV(text){
  const rows = []; let row = [], field = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ field+='"'; i++; } else q = false; }
      else field += ch;
    } else if(ch === '"') q = true;
    else if(ch === ',' || ch === ';' || ch === '\t'){ row.push(field); field=''; }
    else if(ch === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(ch !== '\r') field += ch;
  }
  if(field || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=> r.some(x=> String(x).trim() !== ''));
}

let sheetJSLoaded = null;
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve();
  if(sheetJSLoaded) return sheetJSLoaded;
  sheetJSLoaded = new Promise((res,rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc);
  });
  return sheetJSLoaded;
}

/* مصدر الإعلان من عمود UTM */
function sourceFromUtm(utm, payment){
  const u = String(utm||'').toLowerCase();
  if(u.includes('fb') || u.includes('facebook')) return 'إعلان فيسبوك';
  if(u.includes('ig') || u.includes('insta'))    return 'إنستجرام';
  if(u.includes('tiktok') || u.includes('tt'))   return 'تيك توك';
  if(u.includes('google'))                       return 'جوجل';
  if(u.includes('whats'))                        return 'واتساب';
  return 'المتجر (إيزي أوردرز)';
}
/* التاريخ بيجي بأشكال كتير — بناخد أول ١٠ حروف لو الشكل قياسي */
function normDate(v){
  const t = String(v||'').trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(t)) return t.slice(0,10);
  const d = new Date(t);
  return isNaN(d) ? today() : iso(d);
}

function guessColumn(headers, keys){
  const norm = x => String(x||'').trim().toLowerCase();
  for(const k of keys){
    const i = headers.findIndex(h=> norm(h) === norm(k));
    if(i>=0) return i;
  }
  for(const k of keys){
    const i = headers.findIndex(h=> norm(h).includes(norm(k)));
    if(i>=0) return i;
  }
  return -1;
}

function downloadFile(name, content, type){
  const blob = new Blob(["\ufeff"+content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function clientCSV(client){
  const head = ['التاريخ','رقم الأوردر','المشتري','التليفون','المحافظة','المنتج','الكمية','الإجمالي',
    'تكلفة البضاعة','الشحن','مصاريف أخرى','ربح الأوردر','البوليصة','الحالة','المصدر'];
  const lines = ordersFor(client.id,'all').map(o=>{
    const st = ORDER_STATE[o.state] || {ar:o.state};
    const profit = o.state==='collected'
      ? (Number(o.total)||0) - (Number(o.productCost)||0) - (Number(o.shippingCost)||0) - (Number(o.otherCost)||0)
      : 0;
    return [o.date, o.id, (o.name||'').replace(/,/g,' '), o.phone, o.gov, (o.product||'').replace(/,/g,' '),
      o.qty||1, o.total, o.productCost||0, o.shippingCost==null?'':o.shippingCost,
      o.otherCost==null?'':o.otherCost, profit, o.awb||'', st.ar, o.source||''].join(',');
  });
  return [head.join(','), ...lines].join('\n');
}

async function doLogin(){
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  const password = document.getElementById('passInput').value;
  const err = document.getElementById('loginErr');
  const fail = m => { err.textContent=m; err.classList.remove('hidden'); };
  if(!email){ fail('اكتب إيميلك الأول.'); return; }
  if(ONLINE){
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'بنتأكد...';
    try{
      const res = await api('/api/login', {method:'POST', body:JSON.stringify({email, password})});
      const meNow = await api('/api/me');
      MYPERMS = meNow.perms || []; MYUID = meNow.uid || null;
      session = res.role==='client' ? {role:'client', clientId:res.clientId}
                                    : {role:'admin', staffRole:res.role, name:meNow.name};
      DB = await api('/api/state'); normalizeDB();
      clientTab='dash'; err.classList.add('hidden'); show('app');
      if(session.role==='client'){ await loadPerf(); paint(true); }
    }catch(e){ fail(e.message); }
    finally{ btn.disabled=false; btn.textContent='دخول'; }
    return;
  }
  if(email === DB.agency.adminEmail.toLowerCase()){ session={role:'admin'}; err.classList.add('hidden'); show('app'); return; }
  const c = DB.clients.find(c=>c.email.toLowerCase()===email);
  if(!c){ err.textContent='الإيميل ده مش مسجّل عندنا. كلّم فريق كن أونلاين يضيفك.'; err.classList.remove('hidden'); return; }
  if(c.status!=='active'){ err.textContent='الحساب موقوف مؤقتاً. كلّم فريق الحساب.'; err.classList.remove('hidden'); return; }
  session={role:'client', clientId:c.id}; clientTab='dash'; err.classList.add('hidden'); show('app');
}
async function doSetup(){
  const email = document.getElementById('setupEmail').value.trim();
  const pass  = document.getElementById('setupPass').value;
  const pass2 = document.getElementById('setupPass2').value;
  const err = document.getElementById('setupErr');
  const fail = m => { err.textContent=m; err.classList.remove('hidden'); };

  if(pass.length < 8) return fail('كلمة المرور لازم تكون ٨ حروف على الأقل.');
  if(pass !== pass2) return fail('كلمتين المرور مش متطابقتين.');
  const btn = document.getElementById('setupBtn');
  btn.disabled = true; btn.textContent = 'بننشئ الحساب...';
  try{
    const res = await api('/api/setup', {method:'POST', body:JSON.stringify({email, password:pass})});
    session = {role:'admin', staffRole:'admin'};

  finally{ btn.disabled=false; btn.textContent='إنشاء الحساب'; }

function bindProductPicker(){
  const sel = document.getElementById('n_product_id');
  if(!sel) return;
  const qty = document.getElementById('n_qty');
  const total = document.getElementById('n_total');
  const hint = document.getElementById('totalHint');
  const varField = document.getElementById('n_variant_field');
  const varSel = document.getElementById('n_variant_id');
  const recalc = ()=>{
    const opt = sel.selectedOptions[0];
    const varOpt = varSel && varSel.value ? varSel.selectedOptions[0] : null;
    if(!opt || !sel.value){ if(hint) hint.textContent='اكتب الإجمالي بإيدك'; return; }
    const price = varOpt && varOpt.dataset.price !== '' ? Number(varOpt.dataset.price) : (Number(opt.dataset.price)||0);
    const q = Number(qty.value)||1;
    total.value = Math.round(price*q*100)/100;
    if(hint) hint.textContent = `${money(price)} × ${q} — تقدر تعدّله`;
  };
  const loadVariants = async ()=>{
    if(!varField || !varSel) return;
    const pid = sel.value;
    if(!pid){ varField.style.display='none'; varSel.innerHTML='<option value="">— بدون متغير —</option>'; return; }
    try{
      const list = await api('/api/products/'+encodeURIComponent(pid)+'/variants');
      if(!list.length){ varField.style.display='none'; varSel.innerHTML='<option value="">— بدون متغير —</option>'; return; }
      varSel.innerHTML = '<option value="">— اختار —</option>' +
        list.map(v=>`<option value="${esc(v.id)}" data-price="${v.price!=null?v.price:''}">${esc(v.name)} (متاح: ${num(v.stock)})</option>`).join('');
      varField.style.display='';
    }catch(e){ varField.style.display='none'; }
  };
  sel.onchange = async ()=>{ await loadVariants(); recalc(); };
  qty.oninput = recalc;
  if(varSel) varSel.onchange = recalc;
  if(sel.value) loadVariants();
}
