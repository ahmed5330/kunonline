<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>استعادة أدمن Preview — Kun Online</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0f172a;color:#e5e7eb;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(480px,100%);background:#111827;border:1px solid #334155;border-radius:18px;padding:24px;box-sizing:border-box}h1{margin:0 0 8px;font-size:24px}p{color:#94a3b8;line-height:1.7}label{display:block;margin:14px 0 6px;font-weight:700}.input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff}.btn{width:100%;padding:12px 14px;margin-top:18px;border:0;border-radius:10px;background:#3b82f6;color:white;font-weight:800;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:10px;display:none}.ok{display:block;background:#052e16;color:#86efac}.err{display:block;background:#450a0a;color:#fecaca}a{color:#93c5fd}.ver{margin-top:10px;font-size:11px;color:#64748b}</style></head><body><div class="card"><h1>استعادة أدمن Preview</h1><p>الصفحة دي تعمل على بيئة Preview فقط ولمرة واحدة. اكتب كود الاستعادة، الإيميل الذي تريد استخدامه كأدمن، وكلمة مرور جديدة.</p><label>كود الاستعادة</label><input class="input" id="code" autocomplete="off"><label>إيميل الأدمن</label><input class="input" id="email" type="email" autocomplete="username"><label>كلمة المرور الجديدة</label><input class="input" id="password" type="password" minlength="10" autocomplete="new-password"><button class="btn" id="save">تجهيز حساب الأدمن</button><div class="msg" id="msg"></div><p><a href="/">العودة لتسجيل الدخول</a></p><div class="ver">preview-recovery v23</div></div><script>const $=id=>document.getElementById(id);$('save').onclick=async()=>{const b=$('save'),m=$('msg');b.disabled=true;m.className='msg';m.style.display='none';try{const r=await fetch('/api/preview-admin-recovery',{method:'POST',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},cache:'no-store',body:JSON.stringify({recoveryCode:$('code').value,email:$('email').value,password:$('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'تعذر تنفيذ الاستعادة');m.className='msg ok';m.textContent='تم تجهيز الأدمن. تقدر ترجع لتسجيل الدخول الآن.';b.textContent='تم بنجاح';}catch(e){m.className='msg err';m.textContent=e.message;b.disabled=false;}m.style.display='block';};</script></body></html>
