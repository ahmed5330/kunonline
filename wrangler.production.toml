# Production resources. Database migrations are intentionally absent from CI.
name = "kunonline"
main = "src/index.js"
compatibility_date = "2026-08-23"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "kunonline"
database_id = "c426601d-182f-486e-a5c1-bb1bca0ecb0b"

[triggers]
crons = ["0 */2 * * *"]

[vars]
APP_ENV = "production"
TRACKING_PROVIDER = "track123"

[observability]
enabled = true

